- id: kc.mth.o.trigonometry.pythagoras
  code: MTH-O-06.01.K01
  node_id: cur.mth.o.trigonometry.pythagoras_theorem
  statement: Use Pythagoras' theorem to find a missing side of a right-angled triangle
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.163
  prerequisites:
  - kc_id: kc.mth.o.number.powers_and_roots
    strength: required
  misconception_ids:
  - mc.mth.o.pythag_add_for_leg
  - mc.mth.o.pythag_no_root
  - mc.mth.o.pythag_sides_added
  - mc.mth.o.square_as_double
  skill_ids:
  - mth-o-trigonometry
  glossary:
  - Pythagoras' theorem
  - Pythagoras
  - hypotenuse
  - right-angled triangle
  - square root
  key_points:
  - id: kp_hypotenuse
    text:
      en: Pythagoras applies to right-angled triangles only, and the hypotenuse is the longest side, opposite the right angle.
    follow_up:
      en: In what kind of triangle does the theorem work, and which side is special?
  - id: kp_add_or_subtract
    text:
      en: To find the hypotenuse add the squares of the other sides, and to find a shorter side subtract the squares.
    follow_up:
      en: How do you decide whether to add or subtract the squares?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.trigonometry.trig_side
  code: MTH-O-06.02.K01
  node_id: cur.mth.o.trigonometry.right_angled_triangles
  statement: Use sine, cosine or tangent to find a missing side of a right-angled triangle
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.163
  prerequisites:
  - kc_id: kc.mth.o.trigonometry.pythagoras
    strength: helpful
  - kc_id: kc.mth.o.algebra_and_graphs.change_subject
    strength: required
  misconception_ids:
  - mc.mth.o.calculator_radians
  - mc.mth.o.trig_ratio_wrong
  - mc.mth.o.trig_rearrange_wrong
  skill_ids:
  - mth-o-trigonometry
  glossary:
  - sine
  - cosine
  - tangent
  - hypotenuse
  - opposite
  - adjacent
  - right-angled triangle
  - trigonometry
  - ratio
  - Pythagoras' theorem
  key_points:
  - id: kp_label_sides
    text:
      en: Label the sides opposite, adjacent and hypotenuse relative to the given angle before choosing a ratio.
    follow_up:
      en: What do you decide first before picking sine, cosine or tangent?
  - id: kp_choose_ratio
    text:
      en: The ratio is chosen by the two sides involved, one known and one wanted, and then rearranged to get the unknown.
    follow_up:
      en: How do you choose between the three ratios for a particular problem?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.mth.o.trigonometry.trig_angle
  code: MTH-O-06.02.K02
  node_id: cur.mth.o.trigonometry.right_angled_triangles
  statement: Use inverse sine, cosine or tangent to find an angle in a right-angled triangle
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.15
  prerequisites:
  - kc_id: kc.mth.o.trigonometry.trig_side
    strength: required
  misconception_ids:
  - mc.mth.o.calculator_radians
  - mc.mth.o.trig_ratio_inverted
  - mc.mth.o.trig_ratio_wrong
  skill_ids:
  - mth-o-trigonometry
  glossary:
  - inverse sine
  - inverse cosine
  - inverse tangent
  - sine
  - cosine
  - tangent
  - hypotenuse
  - opposite
  - adjacent
  - right-angled triangle
  key_points:
  - id: kp_inverse_function
    text:
      en: When two sides are known, the ratio of them is found and the inverse function on the calculator turns it into the angle.
    follow_up:
      en: Which calculator button turns a ratio back into an angle?
  - id: kp_calculator_mode
    text:
      en: The calculator must be in degree mode, and the answer is checked against the triangle for reasonableness.
    follow_up:
      en: What setting on the calculator affects the angle answer?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.mth.o.trigonometry.elevation_depression
  code: MTH-O-06.02.K03
  node_id: cur.mth.o.trigonometry.right_angled_triangles
  statement: Solve problems with angles of elevation and depression using right-angled triangles
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.mth.o.trigonometry.trig_side
    strength: required
  misconception_ids:
  - mc.mth.o.calculator_radians
  - mc.mth.o.depression_from_vertical
  - mc.mth.o.eye_height_ignored
  - mc.mth.o.trig_ratio_wrong
  skill_ids:
  - mth-o-trigonometry
  glossary:
  - angle of elevation
  - angle of depression
  - elevation
  - depression
  - horizontal
  - vertical
  - tangent
  - right-angled triangle
  key_points:
  - id: kp_from_horizontal
    text:
      en: Angles of elevation and depression are measured from the horizontal, upwards or downwards.
    follow_up:
      en: From which line are these angles measured?
  - id: kp_draw_right_triangle
    text:
      en: A sketch with a right-angled triangle is drawn, and the depression angle equals the elevation angle from the other end.
    follow_up:
      en: How are the angle of depression from the top and the angle of elevation from the bottom related?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
- id: kc.mth.o.trigonometry.sine_rule
  code: MTH-O-06.03.K01
  node_id: cur.mth.o.trigonometry.non_right_angled_triangles
  statement: Use the sine rule to find a missing side or angle in any triangle
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.125
  prerequisites:
  - kc_id: kc.mth.o.trigonometry.trig_angle
    strength: required
  misconception_ids:
  - mc.mth.o.calculator_radians
  - mc.mth.o.sine_rule_inverted
  - mc.mth.o.trig_rearrange_wrong
  - mc.mth.o.trig_ratio_wrong
  skill_ids:
  - mth-o-trigonometry
  glossary:
  - sine rule
  - sine
  - opposite
  - acute
  - obtuse
  key_points:
  - id: kp_pairs_opposite
    text:
      en: The sine rule links each side with the sine of its opposite angle, so a matching pair must be known.
    follow_up:
      en: What must be known before the sine rule can be used?
  - id: kp_ambiguous_case
    text:
      en: Finding an angle can give two possibilities, as a sine is the same for an angle and for 180 degrees minus that angle.
    follow_up:
      en: Why might a second angle be possible when you use the rule to find an angle?
  difficulty_prior: 0.7
  version: 0.1.1
  status: active
- id: kc.mth.o.trigonometry.cosine_rule
  code: MTH-O-06.03.K02
  node_id: cur.mth.o.trigonometry.non_right_angled_triangles
  statement: Use the cosine rule to find a missing side or angle in any triangle
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.125
  prerequisites:
  - kc_id: kc.mth.o.trigonometry.trig_angle
    strength: required
  misconception_ids:
  - mc.mth.o.calculator_radians
  - mc.mth.o.cosine_rule_order
  - mc.mth.o.cosine_rule_sign
  - mc.mth.o.cosine_rule_two_dropped
  - mc.mth.o.pythag_no_root
  skill_ids:
  - mth-o-trigonometry
  glossary:
  - cosine rule
  - cosine
  - included angle
  - opposite
  key_points:
  - id: kp_when_cosine
    text:
      en: The cosine rule is used when two sides and the angle between them are known, or when all three sides are known.
    follow_up:
      en: Which sets of known information call for the cosine rule?
  - id: kp_included_angle
    text:
      en: The angle in the rule is the one opposite the side being found, and the same rule rearranged finds an angle.
    follow_up:
      en: Which angle sits opposite the side on the left of the formula?
  difficulty_prior: 0.8
  version: 0.1.1
  status: active
- id: kc.mth.o.trigonometry.triangle_area_sine
  code: MTH-O-06.03.K03
  node_id: cur.mth.o.trigonometry.non_right_angled_triangles
  statement: Calculate the area of any triangle from two sides and the angle between them
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.mth.o.trigonometry.trig_side
    strength: required
  - kc_id: kc.mth.o.mensuration.area_perimeter
    strength: required
  misconception_ids:
  - mc.mth.o.calculator_radians
  - mc.mth.o.trig_ratio_wrong
  - mc.mth.o.formula_half_dropped
  skill_ids:
  - mth-o-trigonometry
  glossary:
  - included angle
  - sine
  - area of a triangle
  key_points:
  - id: kp_included_angle_area
    text:
      en: This area rule needs two sides together with the angle they enclose.
    follow_up:
      en: Which angle must be used in relation to the two sides?
  - id: kp_half_ab_sin
    text:
      en: The area is half the product of the two sides and the sine of that angle, a version of half base times height.
    follow_up:
      en: How does this formula connect to half base times height?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
- id: kc.mth.o.trigonometry.three_d
  code: MTH-O-06.04.K01
