- id: kc.mth.o.geometry.shape_properties
  code: MTH-O-04.01.K01
  node_id: cur.mth.o.geometry.geometrical_terms
  statement: Identify triangles, quadrilaterals and polygons from their properties
  kind: conceptual
  tools: []
  exam_weight: 0.069
  prerequisites:
  - kc_id: kc.mth.o.geometry.angle_facts
    strength: helpful
  misconception_ids:
  - mc.mth.o.adjacent_angles_complementary
  - mc.mth.o.kite_rhombus_confused
  - mc.mth.o.parallelogram_angles_all_equal
  - mc.mth.o.quadrilateral_sum_360_misused
  - mc.mth.o.square_not_rectangle
  - mc.mth.o.trapezium_two_pairs
  skill_ids:
  - mth-o-geometry
  glossary:
  - triangle
  - quadrilateral
  - polygon
  - parallelogram
  - rhombus
  - trapezium
  - kite
  - isosceles
  - equilateral
  - scalene
  - rectangle
  - diagonal
  - perpendicular
  - parallel
  key_points:
  - id: kp_defining_features
    text:
      en: A shape is named by its sides, angles and symmetry, such as equal sides or parallel pairs, rather than by how it looks.
    follow_up:
      en: What features would you check to tell two similar-looking quadrilaterals apart?
  - id: kp_square_rhombus
    text:
      en: A rhombus has four equal sides but not necessarily right angles, while a square has four equal sides and four right angles.
    follow_up:
      en: How does a rhombus differ from a square?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.constructions
  code: MTH-O-04.02.K01
  node_id: cur.mth.o.geometry.geometrical_constructions
  statement: Describe the order of steps to bisect a line or an angle and to draw a triangle from its sides
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.049
  prerequisites:
  - kc_id: kc.mth.o.geometry.shape_properties
    strength: required
  misconception_ids:
  - mc.mth.o.construction_measures_with_protractor
  - mc.mth.o.construction_radius_changed
  - mc.mth.o.construction_wrong_order
  - mc.mth.o.triangle_inequality_ignored
  skill_ids:
  - mth-o-geometry
  glossary:
  - construction
  - bisect
  - bisector
  - perpendicular bisector
  - angle bisector
  - arc
  - compasses
  - protractor
  key_points:
  - id: kp_equal_arcs
    text:
      en: Constructions use compass arcs of the same radius from each end of a line or arm of an angle to mark equal distances.
    follow_up:
      en: Why are arcs used with the compass kept at one setting?
  - id: kp_keep_marks
    text:
      en: Arcs and intersection marks are left on the drawing, and the final line joins the points where the arcs cross.
    follow_up:
      en: What do you draw last, and what should remain visible?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.map_scales
  code: MTH-O-04.03.K01
  node_id: cur.mth.o.geometry.scale_drawings
  statement: Use a map or drawing scale to convert between lengths on the drawing and real lengths
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.069
  prerequisites:
  - kc_id: kc.mth.o.number.direct_proportion
    strength: required
  misconception_ids:
  - mc.mth.o.scale_conversion_factor
  - mc.mth.o.scale_units_not_converted
  - mc.mth.o.scale_wrong_direction
  skill_ids:
  - mth-o-geometry
  glossary:
  - scale
  - scale drawing
  - ratio
  - map scale
  key_points:
  - id: kp_scale_meaning
    text:
      en: A scale such as 1 to 50 000 means one unit on the drawing stands for that many of the same unit in real life.
    follow_up:
      en: What does the second number in a scale ratio stand for?
  - id: kp_convert_units
    text:
      en: After multiplying or dividing by the scale, the answer is converted to a sensible unit such as kilometres.
    follow_up:
      en: Why might the length need converting after using the scale?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.bearings
  code: MTH-O-04.03.K02
  node_id: cur.mth.o.geometry.scale_drawings
  statement: Find bearings and back bearings measured clockwise from north
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.078
  prerequisites:
  - kc_id: kc.mth.o.geometry.angle_facts
    strength: required
  misconception_ids:
  - mc.mth.o.back_bearing_add_90
  - mc.mth.o.back_bearing_from_180
  - mc.mth.o.back_bearing_from_360
  - mc.mth.o.bearing_over_360
  skill_ids:
  - mth-o-geometry
  glossary:
  - bearing
  - back bearing
  - clockwise
  - three-figure bearing
  key_points:
  - id: kp_three_figures
    text:
      en: A bearing is an angle measured clockwise from north, written with three figures.
    follow_up:
      en: From which direction and in which turning direction is a bearing measured?
  - id: kp_back_bearing
    text:
      en: The back bearing differs from the forward bearing by 180 degrees, added or taken away to stay between 0 and 360.
    follow_up:
      en: How do you get the bearing of the return journey?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.similar_lengths
  code: MTH-O-04.04.K01
  node_id: cur.mth.o.geometry.similarity
  statement: Use the scale factor of similar shapes to find missing lengths
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.088
  prerequisites:
  - kc_id: kc.mth.o.number.ratio_share
    strength: required
  misconception_ids:
  - mc.mth.o.similar_additive
  - mc.mth.o.similar_area_factor_for_length
  - mc.mth.o.similar_factor_inverted
  skill_ids:
  - mth-o-geometry
  glossary:
  - similar
  - similarity
  - scale factor
  - corresponding
  - enlargement
  key_points:
  - id: kp_scale_factor
    text:
      en: The scale factor is found by dividing a length on one shape by the matching length on the other.
    follow_up:
      en: How do you find the scale factor between two similar shapes?
  - id: kp_matching_sides
    text:
      en: Only corresponding sides are compared, and the same scale factor applies to every pair of them.
    follow_up:
      en: Which sides of the two shapes can be paired up?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.similar_area_volume
  code: MTH-O-04.04.K02
  node_id: cur.mth.o.geometry.similarity
  statement: Use the square and the cube of the length scale factor for areas and volumes of similar shapes
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.078
  prerequisites:
  - kc_id: kc.mth.o.geometry.similar_lengths
    strength: required
  - kc_id: kc.mth.o.number.powers_and_roots
    strength: required
  misconception_ids:
  - mc.mth.o.similar_area_factor_for_volume
  - mc.mth.o.similar_factor_inverted
  - mc.mth.o.similar_length_factor_for_area
  - mc.mth.o.similar_area_factor_for_length
  skill_ids:
  - mth-o-geometry
  glossary:
  - similar
  - scale factor
  - length scale factor
  - area scale factor
  - volume scale factor
  - surface area
  - volume
  key_points:
  - id: kp_area_squared
    text:
      en: If lengths are in the ratio k, areas are in the ratio k squared.
    follow_up:
      en: When a shape is made bigger by a length factor k, how does its area change?
  - id: kp_volume_cubed
    text:
      en: Volumes are in the ratio k cubed, because three dimensions all scale.
    follow_up:
      en: Why does volume change by a different power from area?
  difficulty_prior: 0.7
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.symmetry
  code: MTH-O-04.05.K01
  node_id: cur.mth.o.geometry.symmetry
  statement: Find the number of lines of symmetry and the order of rotational symmetry of a shape
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.049
  prerequisites:
  - kc_id: kc.mth.o.geometry.shape_properties
    strength: required
  misconception_ids:
  - mc.mth.o.parallelogram_line_symmetry
  - mc.mth.o.regular_symmetry_half
  - mc.mth.o.rotation_order_zero
  - mc.mth.o.symmetry_lines_double_counted
  skill_ids:
  - mth-o-geometry
  glossary:
  - symmetry
  - line of symmetry
  - rotational symmetry
  - order of rotational symmetry
  - regular polygon
  - polygon
  - pentagon
  - hexagon
  - heptagon
  - octagon
  - nonagon
  - decagon
  - dodecagon
  - parallelogram
  - rhombus
  - trapezium
  - isosceles
  - equilateral
  - rectangle
  key_points:
  - id: kp_line_mirror
    text:
      en: A line of symmetry splits a shape into two halves that match exactly as a mirror image.
    follow_up:
      en: How can you test whether a line is a line of symmetry?
  - id: kp_rotational_order
    text:
      en: Rotational symmetry order is the number of times a shape fits its outline in one full turn.
    follow_up:
      en: What do you count to find the order of rotational symmetry?
  difficulty_prior: -0.9
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.angle_facts
  code: MTH-O-04.06.K01
  node_id: cur.mth.o.geometry.angles
  statement: Calculate angles at a point, on a straight line and where two straight lines cross
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.088
  prerequisites:
  - kc_id: kc.mth.o.number.order_of_operations
    strength: required
  misconception_ids:
  - mc.mth.o.line_angles_360
  - mc.mth.o.point_angles_180
  - mc.mth.o.vertically_opposite_supplementary
  - mc.mth.o.adjacent_angles_complementary
  - mc.mth.o.alternate_supplementary
  skill_ids:
  - mth-o-geometry
  glossary:
  - angle
  - right angle
  - straight line
  - vertically opposite
  - angles at a point
  - isosceles
  - isosceles triangle
  - reflex
  key_points:
  - id: kp_sum_totals
    text:
      en: Angles on a straight line add to 180 degrees, and angles around a point add to 360 degrees.
    follow_up:
      en: What total do angles around one point make, and how does a straight line differ?
  - id: kp_vertically_opposite
    text:
      en: When two straight lines cross, the angles facing each other are equal.
    follow_up:
      en: Which pairs of angles are equal where two lines intersect?
  difficulty_prior: -1.0
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.parallel_line_angles
  code: MTH-O-04.06.K02
  node_id: cur.mth.o.geometry.angles
  statement: Use alternate, corresponding and co-interior angles to find angles at parallel lines
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.088
  prerequisites:
  - kc_id: kc.mth.o.geometry.angle_facts
    strength: required
  misconception_ids:
  - mc.mth.o.adjacent_angles_complementary
  - mc.mth.o.alternate_supplementary
  - mc.mth.o.cointerior_equal
  - mc.mth.o.line_angles_360
  skill_ids:
  - mth-o-geometry
  glossary:
  - parallel
  - alternate
  - corresponding
  - co-interior
  - transversal
  key_points:
  - id: kp_alternate_corresponding
    text:
      en: Alternate angles are equal, corresponding angles are equal, and the Z and F shapes help to spot them.
    follow_up:
      en: Which letter shapes help to find equal angles between parallel lines?
  - id: kp_cointerior
    text:
      en: Co-interior angles lie between the lines on the same side of the cutting line and add to 180 degrees.
    follow_up:
      en: What do co-interior angles add up to, and where are they found?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.triangle_angles
  code: MTH-O-04.06.K03
  node_id: cur.mth.o.geometry.angles
  statement: Calculate angles in triangles, including isosceles triangles and exterior angles
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.088
  prerequisites:
  - kc_id: kc.mth.o.geometry.angle_facts
    strength: required
  misconception_ids:
  - mc.mth.o.angle_sum_one_angle_only
  - mc.mth.o.exterior_as_supplement
  - mc.mth.o.exterior_interior_confused
  - mc.mth.o.isosceles_not_halved
  - mc.mth.o.isosceles_wrong_pair
  - mc.mth.o.triangle_sum_360
  skill_ids:
  - mth-o-geometry
  glossary:
  - isosceles
  - isosceles triangle
  - equilateral
  - exterior angle
  - interior angle
  - triangle
  key_points:
  - id: kp_sum_180
    text:
      en: The three angles in any triangle add up to 180 degrees.
    follow_up:
      en: What total do you use to find an unknown angle in a triangle?
  - id: kp_exterior_isosceles
    text:
      en: An exterior angle equals the sum of the two opposite interior angles, and an isosceles triangle has two equal base angles.
    follow_up:
      en: How is an exterior angle related to the interior angles at the other two corners?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.polygon_angles
  code: MTH-O-04.06.K04
  node_id: cur.mth.o.geometry.angles
  statement: Calculate the interior and exterior angles of polygons
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.088
  prerequisites:
  - kc_id: kc.mth.o.geometry.triangle_angles
    strength: required
  misconception_ids:
  - mc.mth.o.exterior_for_interior
  - mc.mth.o.polygon_sum_n_180
  - mc.mth.o.regular_sum_not_divided
  skill_ids:
  - mth-o-geometry
  glossary:
  - polygon
  - regular polygon
  - interior angle
  - exterior angle
  - pentagon
  - hexagon
  - octagon
  - decagon
  key_points:
  - id: kp_exterior_360
    text:
      en: Exterior angles of any polygon add to 360 degrees, so a regular polygon's exterior angle is 360 over its number of sides.
    follow_up:
      en: What do all exterior angles of a polygon total?
  - id: kp_interior_exterior_pair
    text:
      en: An interior angle and its exterior angle lie on a straight line and so add to 180 degrees.
    follow_up:
      en: How are the interior and exterior angles at one corner connected?
  difficulty_prior: 0.1
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.circle_theorems_basic
  code: MTH-O-04.07.K01
  node_id: cur.mth.o.geometry.circle_theorems_i
  statement: Use the angle in a semicircle, the angle at the centre and the right angle between tangent and radius
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.088
  prerequisites:
  - kc_id: kc.mth.o.geometry.triangle_angles
    strength: required
  misconception_ids:
  - mc.mth.o.centre_angle_halved
  - mc.mth.o.semicircle_not_right
  - mc.mth.o.tangent_radius_not_right
  - mc.mth.o.isosceles_not_halved
  skill_ids:
  - mth-o-geometry
  glossary:
  - semicircle
  - diameter
  - tangent
  - radius
  - angle at the centre
  - circumference
  - circle theorem
  key_points:
  - id: kp_semicircle_right
    text:
      en: An angle drawn from the ends of a diameter to a point on the circle is a right angle.
    follow_up:
      en: What is the size of an angle standing on a diameter?
  - id: kp_centre_double
    text:
      en: The angle at the centre is twice the angle at the circumference standing on the same arc.
    follow_up:
      en: How do the angles at the centre and at the edge compare when they share an arc?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
- id: kc.mth.o.geometry.circle_theorems_cyclic
  code: MTH-O-04.08.K01
  node_id: cur.mth.o.geometry.circle_theorems_ii
  statement: Use opposite angles of a cyclic quadrilateral and angles in the same segment
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.078
  prerequisites:
  - kc_id: kc.mth.o.geometry.circle_theorems_basic
    strength: required
  misconception_ids:
  - mc.mth.o.cyclic_opposite_equal
  - mc.mth.o.cyclic_sum_360
  - mc.mth.o.same_segment_supplementary
  - mc.mth.o.adjacent_angles_complementary
  - mc.mth.o.centre_angle_halved
