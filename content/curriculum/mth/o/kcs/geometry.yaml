  - opposite angles
  - same segment
  - segment
  - circumference
  - circle theorem
  key_points:
  - id: kp_opposite_180
    text:
      en: Opposite angles of a cyclic quadrilateral add up to 180 degrees.
    follow_up:
      en: What can you say about two opposite corners of a four-sided shape inside a circle?
  - id: kp_same_segment
    text:
      en: Angles in the same segment standing on the same chord are equal.
    follow_up:
      en: What do you know about two angles drawn from the same chord to the same side of the circle?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
