- id: kc.mth.o.transformations_and_vectors.transform_points
  code: MTH-O-07.01.K01
  node_id: cur.mth.o.transformations_and_vectors.transformations
  statement: Find the image of a point after a translation, reflection, rotation or enlargement
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.316
  prerequisites:
  - kc_id: kc.mth.o.coordinate_geometry.points_on_lines
    strength: required
  - kc_id: kc.mth.o.geometry.symmetry
    strength: helpful
  misconception_ids:
  - mc.mth.o.enlargement_added
  - mc.mth.o.enlargement_centre_ignored
  - mc.mth.o.reflection_axis_confused
  - mc.mth.o.reflection_not_doubled
  - mc.mth.o.rotation_direction
  - mc.mth.o.rotation_half_turn
  - mc.mth.o.translation_components_swapped
  - mc.mth.o.translation_sign
  skill_ids:
  - mth-o-transformations-and-vectors
  glossary:
  - translation
  - reflection
  - rotation
  - enlargement
  - image
  - centre of enlargement
  - centre of rotation
  - scale factor
  - clockwise
  - anticlockwise
  - column vector
  key_points:
  - id: kp_describe_moves
    text:
      en: A translation shifts every point by one vector, a reflection mirrors in a line, and a rotation turns about a centre by an angle.
    follow_up:
      en: What information is needed to carry out a rotation?
  - id: kp_enlargement_centre
    text:
      en: An enlargement multiplies each distance from the centre by the scale factor, so image points lie along lines through the centre.
    follow_up:
      en: What does the scale factor do to a point's distance from the centre?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.mth.o.transformations_and_vectors.enlargement
  code: MTH-O-07.01.K02
  node_id: cur.mth.o.transformations_and_vectors.transformations
  statement: Calculate lengths, areas and scale factors for an enlargement
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.211
  prerequisites:
  - kc_id: kc.mth.o.transformations_and_vectors.transform_points
    strength: required
  - kc_id: kc.mth.o.geometry.similar_lengths
    strength: required
  misconception_ids:
  - mc.mth.o.enlargement_added
  - mc.mth.o.enlargement_centre_ignored
  - mc.mth.o.similar_area_factor_for_length
  - mc.mth.o.similar_area_factor_for_volume
  - mc.mth.o.similar_factor_inverted
  - mc.mth.o.similar_length_factor_for_area
  skill_ids:
  - mth-o-transformations-and-vectors
  glossary:
  - enlargement
  - scale factor
  - centre of enlargement
  - image
  - area scale factor
  key_points:
  - id: kp_scale_factor_lengths
    text:
      en: The scale factor is image length divided by object length, and a factor between 0 and 1 makes the shape smaller.
    follow_up:
      en: How do you get the scale factor from a pair of matching lengths?
  - id: kp_area_factor
    text:
      en: Areas change by the scale factor squared, though angles stay the same.
    follow_up:
      en: If the scale factor is 3, what factor applies to the area?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.transformations_and_vectors.vector_arithmetic
  code: MTH-O-07.02.K01
  node_id: cur.mth.o.transformations_and_vectors.vectors_in_two_dimensions
  statement: Calculate sums, differences and multiples of column vectors
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.263
  prerequisites:
  - kc_id: kc.mth.o.number.order_of_operations
    strength: required
  misconception_ids:
  - mc.mth.o.translation_components_swapped
  - mc.mth.o.vector_scalar_dropped
  - mc.mth.o.vector_subtract_sign
  skill_ids:
  - mth-o-transformations-and-vectors
  glossary:
  - vector
  - column vector
  - component
  - scalar
  - resultant
  key_points:
  - id: kp_add_components
    text:
      en: Vectors are added or subtracted by working with the top numbers and the bottom numbers separately.
    follow_up:
      en: How do you combine two column vectors?
  - id: kp_scalar_multiple
    text:
      en: Multiplying a vector by a number multiplies both of its components by that number.
    follow_up:
      en: What happens to each part of a column vector when it is multiplied by 3?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.transformations_and_vectors.vector_magnitude
  code: MTH-O-07.03.K01
  node_id: cur.mth.o.transformations_and_vectors.magnitude_of_a_vector
  statement: Calculate the magnitude of a column vector
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.211
  prerequisites:
  - kc_id: kc.mth.o.transformations_and_vectors.vector_arithmetic
    strength: required
  - kc_id: kc.mth.o.trigonometry.pythagoras
    strength: required
  misconception_ids:
  - mc.mth.o.magnitude_signed_sum
  - mc.mth.o.pythag_no_root
  - mc.mth.o.pythag_sides_added
  skill_ids:
  - mth-o-transformations-and-vectors
  glossary:
  - magnitude
  - vector
  - column vector
  - component
  - Pythagoras' theorem
  key_points:
  - id: kp_magnitude_meaning
    text:
      en: The magnitude of a vector is its length, found from the two components using Pythagoras' theorem.
    follow_up:
      en: What does the magnitude measure, and which theorem is behind the calculation?
  - id: kp_sign_ignored
    text:
      en: Signs of the components do not change the length, because they are squared.
    follow_up:
      en: Why does a negative component not make the magnitude negative?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
