- id: kc.mth.o.number.simple_interest
  code: MTH-O-01.16.K02
  node_id: cur.mth.o.number.money
  statement: Calculate simple interest and the total amount after simple interest
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.028
  prerequisites:
  - kc_id: kc.mth.o.number.percentage_change
    strength: required
  misconception_ids:
