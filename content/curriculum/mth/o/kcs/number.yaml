  - mc.mth.o.venn_double_count
  - mc.mth.o.venn_only_includes_overlap
  skill_ids:
  - mth-o-number
  glossary:
  - Venn diagram
  - set
  - union
  - intersection
  - complement
  - element
  - universal set
  key_points:
  - id: kp_regions
    text:
      en: The intersection is in both sets, the union is in at least one set, and the complement is outside the set.
    follow_up:
      en: What does the union include that the intersection does not?
  - id: kp_fill_overlap
    text:
      en: Filling in the overlap first avoids counting elements twice, and the total is checked against the universal set.
    follow_up:
      en: Which region is best filled first, and why?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.mth.o.number.powers_and_roots
