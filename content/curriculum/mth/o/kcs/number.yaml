  - mc.mth.o.sf_dp_confused
  - mc.mth.o.truncated_not_rounded
  skill_ids:
  - mth-o-number
  glossary:
  - round
  - rounding
  - significant figure
  - decimal place
  key_points:
  - id: kp_decimal_places
    text:
      en: Decimal places are counted after the decimal point, while significant figures are counted from the first non-zero digit.
    follow_up:
      en: Where does counting start for significant figures, as compared with decimal places?
  - id: kp_look_next_digit
    text:
      en: 'Look at the next digit: five or more rounds up, less than five leaves the digit alone, and only round at the end.'
    follow_up:
