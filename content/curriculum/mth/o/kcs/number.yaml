      en: A percentage increase or decrease is done with one multiplier, such as 1.2 for an increase of 20 percent.
    follow_up:
      en: How can an increase or decrease be done in a single multiplication?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.mth.o.number.reverse_percentage
  code: MTH-O-01.13.K02
  node_id: cur.mth.o.number.percentages
  statement: Find the original quantity before a percentage increase or decrease
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.041
  prerequisites:
  - kc_id: kc.mth.o.number.percentage_change
    strength: required
  misconception_ids:
  - mc.mth.o.percent_added_as_number
  - mc.mth.o.reverse_multiplied
  - mc.mth.o.reverse_percent_of_new
  skill_ids:
  - mth-o-number-applied
  glossary:
  - percentage
  - reverse percentage
  - multiplier
  - original amount
  - original price
  key_points:
  - id: kp_hundred_percent
    text:
      en: The new amount is a known percentage of the original, which is 100 percent, so divide to find 1 percent or use the multiplier.
    follow_up:
      en: What percentage of the original does the given final value represent?
  - id: kp_divide_not_subtract
    text:
      en: The original is found by dividing by the multiplier, not by adding or subtracting the percentage from the final amount.
    follow_up:
