  - mc.mth.o.simple_as_compound
  - mc.mth.o.percent_change_only
  skill_ids:
  - mth-o-number-applied
  glossary:
  - simple interest
  - interest
  - principal
  - interest rate
  - per annum
  key_points:
  - id: kp_same_each_year
    text:
      en: Simple interest is the same amount every year, found as principal times rate times time.
    follow_up:
      en: How does the interest in the second year compare with the first year?
  - id: kp_interest_vs_total
    text:
      en: The interest is only the extra money earned, and the total amount is the principal plus the interest.
    follow_up:
