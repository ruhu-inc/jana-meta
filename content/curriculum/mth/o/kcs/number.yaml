- id: kc.mth.o.number.prime_factors
  code: MTH-O-01.01.K01
  node_id: cur.mth.o.number.types_of_number
  statement: Use repeated division to write a whole number as a product of prime factors
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.046
  prerequisites:
  - kc_id: kc.mth.o.number.order_of_operations
    strength: required
  misconception_ids:
  - mc.mth.o.composite_factor_used
  - mc.mth.o.index_counts_all_primes
  - mc.mth.o.largest_factor_not_prime
  - mc.mth.o.prime_power_value_for_index
  skill_ids:
  - mth-o-number
  glossary:
  - prime
  - prime number
  - prime factor
  - factor
  - product of prime factors
  - index
  - indices
  key_points:
  - id: kp_prime_meaning
    text:
      en: A prime number has exactly two factors, itself and one, and prime factors are found by dividing by primes in turn.
    follow_up:
      en: What do you divide by at each step, and when do you stop?
  - id: kp_product_form
    text:
      en: The answer is written as a product of primes, using index notation for repeats, and multiplying it back gives the number.
    follow_up:
      en: How can you check that your list of prime factors is correct?
  difficulty_prior: -1.0
  version: 0.1.1
  status: active
- id: kc.mth.o.number.hcf_lcm
  code: MTH-O-01.01.K02
  node_id: cur.mth.o.number.types_of_number
  statement: Find the highest common factor and lowest common multiple of two whole numbers
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.055
  prerequisites:
  - kc_id: kc.mth.o.number.prime_factors
    strength: required
  misconception_ids:
  - mc.mth.o.composite_factor_used
  - mc.mth.o.hcf_lcm_swapped
  - mc.mth.o.hcf_not_highest
  - mc.mth.o.lcm_as_product
  - mc.mth.o.lcm_not_lowest
  skill_ids:
  - mth-o-number
  glossary:
  - highest common factor
  - lowest common multiple
  - factor
  - multiple
  - prime factor
  key_points:
  - id: kp_hcf_meaning
    text:
      en: The HCF is the largest number that divides into both numbers, and the LCM is the smallest number that both divide into.
    follow_up:
      en: What is the difference in meaning between the HCF and the LCM?
  - id: kp_prime_method
    text:
      en: Using prime factorisations, the HCF takes the primes common to both and the LCM takes every prime at its highest power.
    follow_up:
      en: Starting from prime factors, how do you build the HCF as compared with the LCM?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.mth.o.number.venn_counting
  code: MTH-O-01.02.K01
  node_id: cur.mth.o.number.sets
  statement: Use a two-set Venn diagram to count the elements in a union, an intersection or a complement
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.037
  prerequisites:
  - kc_id: kc.mth.o.number.order_of_operations
    strength: required
  misconception_ids:
