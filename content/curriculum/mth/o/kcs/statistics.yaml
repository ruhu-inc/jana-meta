- id: kc.mth.o.statistics.data_types
  code: MTH-O-09.01.K01
  node_id: cur.mth.o.statistics.classifying_statistical_data
  statement: Classify data as qualitative or quantitative, and as discrete or continuous
  kind: conceptual
  tools: []
  exam_weight: 0.065
  prerequisites:
  - kc_id: kc.mth.o.number.order_of_operations
    strength: helpful
  misconception_ids:
  - mc.mth.o.coded_numbers_quantitative
  - mc.mth.o.discrete_continuous_swapped
  - mc.mth.o.numbers_always_continuous
  skill_ids:
  - mth-o-statistics
  glossary:
  - qualitative
  - quantitative
  - discrete
  - continuous
  - data
  - categorical
  key_points:
  - id: kp_qual_quant
    text:
      en: Qualitative data is described in words or categories, while quantitative data is measured or counted as numbers.
    follow_up:
      en: What distinguishes data that is a category from data that is a number?
  - id: kp_discrete_continuous
    text:
      en: Discrete data takes separate values that can be counted, while continuous data can take any value in a range and is measured.
    follow_up:
      en: How would you decide whether a quantity is counted or measured?
  difficulty_prior: -1.0
  version: 0.1.1
  status: active
- id: kc.mth.o.statistics.read_tables
  code: MTH-O-09.02.K01
  node_id: cur.mth.o.statistics.interpreting_statistical_data
  statement: Read values from frequency and two-way tables and find missing entries
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.091
  prerequisites:
  - kc_id: kc.mth.o.statistics.data_types
    strength: required
  misconception_ids:
  - mc.mth.o.table_row_column_confused
  - mc.mth.o.table_total_ignored
  - mc.mth.o.compound_part_missing
  - mc.mth.o.table_entry_missed
  skill_ids:
  - mth-o-statistics
  glossary:
  - frequency
  - frequency table
  - two-way table
  - tally
  key_points:
  - id: kp_row_column
    text:
      en: A value in a table is found where its row and column meet, so both headings must be read.
    follow_up:
      en: What two headings do you use to locate a single entry in a two-way table?
  - id: kp_totals_missing
    text:
      en: Missing entries come from totals, since the parts in a row or column must add to the total given.
    follow_up:
      en: How can a missing number in a table be worked out?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.mth.o.statistics.averages_list
  code: MTH-O-09.03.K01
  node_id: cur.mth.o.statistics.averages_and_measures_of_spread
  statement: Calculate the mean, median, mode and range of a list of data
  kind: procedural
  tools:
  - stats_compute
  exam_weight: 0.156
  prerequisites:
  - kc_id: kc.mth.o.number.order_of_operations
    strength: required
  misconception_ids:
  - mc.mth.o.mean_wrong_count
  - mc.mth.o.median_not_ordered
  - mc.mth.o.mode_as_frequency
  - mc.mth.o.range_as_largest
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.median_position_as_value
  skill_ids:
  - mth-o-statistics
  glossary:
  - mean
  - median
  - mode
  - range
  - average
  - data
  key_points:
  - id: kp_three_averages
    text:
      en: The mean is the total divided by the count, the median the middle value once ordered, and the mode the most common.
    follow_up:
      en: Which of the averages needs the data in order first?
  - id: kp_range_spread
    text:
      en: The range is the largest minus the smallest value and shows how spread out the data is.
    follow_up:
      en: What does the range tell you about a set of data, and how is it found?
  difficulty_prior: -0.7
  version: 0.1.1
  status: active
- id: kc.mth.o.statistics.averages_frequency
  code: MTH-O-09.03.K02
  node_id: cur.mth.o.statistics.averages_and_measures_of_spread
  statement: Calculate the mean, median and mode from a frequency table
  kind: procedural
  tools:
  - stats_compute
  exam_weight: 0.143
  prerequisites:
  - kc_id: kc.mth.o.statistics.averages_list
    strength: required
  misconception_ids:
  - mc.mth.o.frequency_ignored
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.median_not_ordered
  - mc.mth.o.mode_as_frequency
  - mc.mth.o.mean_wrong_count
  skill_ids:
  - mth-o-statistics
  glossary:
  - mean
  - median
  - mode
  - frequency
  - frequency table
  - total frequency
  - average
  key_points:
  - id: kp_mean_fx
    text:
      en: The mean is the total of frequency times value divided by the total frequency.
    follow_up:
      en: How do the frequencies come into finding the mean?
  - id: kp_median_position
    text:
      en: The median is found by locating the middle position in the total frequency, and the mode is the value with the highest frequency.
    follow_up:
      en: How do you work out which value is the median from a frequency table?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.mth.o.statistics.grouped_mean
  code: MTH-O-09.03.K03
  node_id: cur.mth.o.statistics.averages_and_measures_of_spread
  statement: Estimate the mean of grouped data using the midpoints of the classes
  kind: procedural
  tools:
  - stats_compute
  exam_weight: 0.117
  prerequisites:
  - kc_id: kc.mth.o.statistics.averages_frequency
    strength: required
  misconception_ids:
  - mc.mth.o.frequency_mean_rows
  - mc.mth.o.grouped_upper_bound
  - mc.mth.o.class_width_wrong
  skill_ids:
  - mth-o-statistics
  glossary:
  - grouped data
  - class
  - class interval
  - midpoint
  - frequency
  - estimate
  - mean
  key_points:
  - id: kp_midpoint_stand_in
    text:
      en: Each class is represented by its midpoint, since the actual values inside it are not known.
    follow_up:
      en: What value stands in for each class when the data is grouped?
  - id: kp_estimate_only
    text:
      en: The result is an estimate because the midpoints are only assumed to be typical, not the real values.
    follow_up:
      en: Why is the answer called an estimate rather than the exact mean?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
- id: kc.mth.o.statistics.pie_charts
  code: MTH-O-09.04.K01
  node_id: cur.mth.o.statistics.statistical_charts_and_diagrams
  statement: Calculate the sector angles and frequencies of a pie chart
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.104
  prerequisites:
  - kc_id: kc.mth.o.number.direct_proportion
    strength: required
  - kc_id: kc.mth.o.statistics.read_tables
    strength: required
  misconception_ids:
  - mc.mth.o.pie_angle_inverted
  - mc.mth.o.pie_frequency_as_angle
  - mc.mth.o.pie_percent_for_degrees
  skill_ids:
  - mth-o-statistics
  glossary:
  - pie chart
  - sector
  - sector angle
  - frequency
  - proportion
  key_points:
  - id: kp_angle_proportion
    text:
      en: A sector angle is the fraction of the total for that category multiplied by 360 degrees.
    follow_up:
      en: How is the angle of a sector linked to the share of the data it shows?
  - id: kp_frequency_from_angle
    text:
      en: A frequency from an angle is the angle divided by 360, multiplied by the total frequency.
    follow_up:
      en: If a sector angle is known, how do you get the number it represents?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.statistics.scatter_correlation
  code: MTH-O-09.05.K01
  node_id: cur.mth.o.statistics.scatter_diagrams
  statement: Interpret correlation on a scatter diagram and use a line of best fit to estimate values
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.104
  prerequisites:
  - kc_id: kc.mth.o.statistics.read_tables
    strength: required
  - kc_id: kc.mth.o.coordinate_geometry.line_equation
    strength: helpful
  misconception_ids:
  - mc.mth.o.best_fit_read_wrong_axis
  - mc.mth.o.correlation_causation
  - mc.mth.o.correlation_negative_as_none
  - mc.mth.o.coordinates_swapped
  - mc.mth.o.gradient_inverted
  - mc.mth.o.correlation_direction_swapped
  skill_ids:
  - mth-o-statistics
  glossary:
  - scatter diagram
  - correlation
  - positive correlation
  - negative correlation
  - line of best fit
  - outlier
  - estimate
  key_points:
  - id: kp_correlation_type
    text:
      en: Positive correlation means both variables rise together, negative means one falls as the other rises, none means no pattern.
    follow_up:
      en: What does the direction of the points tell you about the relationship?
  - id: kp_best_fit_estimate
    text:
      en: A line of best fit runs close to the points with a balance either side, and is read to estimate values within the data.
    follow_up:
      en: How would you use a drawn line of best fit to predict a missing value?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.mth.o.statistics.cumulative_frequency
  code: MTH-O-09.06.K01
  node_id: cur.mth.o.statistics.cumulative_frequency_diagrams
  statement: Use cumulative frequency to estimate the median, quartiles and interquartile range
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.117
  prerequisites:
  - kc_id: kc.mth.o.statistics.averages_frequency
    strength: required
  misconception_ids:
  - mc.mth.o.iqr_as_quartile
  - mc.mth.o.median_class_midpoint
  - mc.mth.o.median_position_as_value
  - mc.mth.o.range_as_largest
  skill_ids:
  - mth-o-statistics
  glossary:
  - cumulative frequency
  - median
  - quartile
  - lower quartile
  - upper quartile
  - interquartile range
  - percentile
  - estimate
  key_points:
  - id: kp_running_total
    text:
      en: Cumulative frequency is a running total, plotted against the upper end of each class.
    follow_up:
      en: Which end of each class is used when plotting the cumulative frequency?
  - id: kp_quartile_positions
    text:
      en: The median is read at half the total frequency and the quartiles at a quarter and three quarters; the IQR is their difference.
    follow_up:
      en: At which heights on the vertical axis are the median and quartiles read?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
- id: kc.mth.o.statistics.histograms
  code: MTH-O-09.07.K01
  node_id: cur.mth.o.statistics.histograms
  statement: Calculate frequency densities and frequencies for a histogram with unequal class widths
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.104
  prerequisites:
  - kc_id: kc.mth.o.statistics.read_tables
    strength: required
  - kc_id: kc.mth.o.statistics.grouped_mean
    strength: helpful
  misconception_ids:
  - mc.mth.o.class_width_wrong
  - mc.mth.o.density_multiplied
  - mc.mth.o.histogram_height_as_frequency
  - mc.mth.o.pie_angle_inverted
  - mc.mth.o.frequency_density_inverted
  skill_ids:
  - mth-o-statistics
  glossary:
  - histogram
  - frequency density
  - frequency
  - class width
  - class
  key_points:
  - id: kp_area_frequency
    text:
      en: In a histogram with unequal classes the area of each bar represents the frequency, not the height.
    follow_up:
      en: What does the area of a bar show, as compared with its height?
  - id: kp_frequency_density
    text:
      en: Each bar's height shows frequency density, a class's frequency shared over its width.
    follow_up:
      en: How is the height of a bar worked out from the data?
  difficulty_prior: 0.7
  version: 0.1.1
  status: active
