- id: kc.mth.o.calculus.differentiate_powers
  code: MTH-O-10.01.K01
  node_id: cur.mth.o.calculus.differentiation
  statement: Find the derivative of a sum of powers of x and the gradient of a curve at a point
  kind: procedural
  tools:
  - math_differentiate
  exam_weight: 0.3
  prerequisites:
  - kc_id: kc.mth.o.algebra_and_graphs.index_laws_algebra
    strength: required
  misconception_ids:
  - mc.mth.o.derivative_constant_kept
  - mc.mth.o.derivative_power_not_brought_down
  - mc.mth.o.derivative_power_not_reduced
  - mc.mth.o.gradient_from_y
  skill_ids:
  - mth-o-calculus
  glossary:
  - differentiate
  - differentiation
  - derivative
  - gradient
  - gradient function
  - tangent
  key_points:
  - id: kp_power_rule
    text:
      en: To differentiate a power of x, multiply by the power and then reduce the power by one.
    follow_up:
      en: What two things happen to the index when you differentiate a term such as x to the power n?
  - id: kp_gradient_meaning
    text:
      en: The derivative gives the gradient of the curve, so putting in an x value gives the gradient at that point.
    follow_up:
      en: How do you get the steepness of a curve at one particular x value?
  difficulty_prior: 0.8
  version: 0.1.1
  status: active
- id: kc.mth.o.calculus.tangents_normals
  code: MTH-O-10.01.K02
  node_id: cur.mth.o.calculus.differentiation
  statement: Find the equations of the tangent and the normal to a curve at a given point
  kind: procedural
  tools:
  - math_differentiate
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.mth.o.calculus.differentiate_powers
    strength: required
  - kc_id: kc.mth.o.coordinate_geometry.perpendicular_lines
    strength: required
  misconception_ids:
  - mc.mth.o.derivative_power_not_brought_down
  - mc.mth.o.gradient_from_y
  - mc.mth.o.normal_gradient_as_tangent
  - mc.mth.o.c_as_y_coordinate
  - mc.mth.o.intercept_sign
  - mc.mth.o.perpendicular_reciprocal_only
  skill_ids:
  - mth-o-calculus
  glossary:
  - tangent
  - normal
  - gradient
  - derivative
  - differentiate
  - perpendicular
  key_points:
  - id: kp_tangent_gradient
    text:
      en: The tangent's gradient at a point equals the derivative worked out at that x value.
    follow_up:
      en: From what calculation does the gradient of the tangent come?
  - id: kp_normal_perpendicular
    text:
      en: The normal is perpendicular to the tangent at the same point, so its gradient is the negative reciprocal.
    follow_up:
      en: How is the normal's gradient related to the tangent's gradient?
  difficulty_prior: 1.2
  version: 0.1.1
  status: active
- id: kc.mth.o.calculus.stationary_points
  code: MTH-O-10.01.K03
  node_id: cur.mth.o.calculus.differentiation
  statement: Find the stationary points of a curve and determine whether each is a maximum or a minimum
  kind: procedural
  tools:
  - math_differentiate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.mth.o.calculus.differentiate_powers
    strength: required
  - kc_id: kc.mth.o.algebra_and_graphs.quadratic_equations
    strength: required
  misconception_ids:
  - mc.mth.o.derivative_constant_kept
  - mc.mth.o.max_min_confused
  - mc.mth.o.stationary_from_y_zero
  - mc.mth.o.gradient_from_y
  skill_ids:
  - mth-o-calculus
  glossary:
  - stationary point
  - turning point
  - maximum
  - minimum
  - derivative
  - second derivative
  - differentiate
  - gradient
  key_points:
  - id: kp_derivative_zero
    text:
      en: At a stationary point the gradient is zero, so the derivative is set equal to zero and solved.
    follow_up:
      en: What is the gradient of a curve at its highest or lowest point, and how do you use that?
  - id: kp_nature_test
    text:
      en: Whether the point is a maximum or minimum is decided by the sign of the second derivative or by the gradient on either side.
    follow_up:
      en: After finding a stationary point, how can you decide which type it is?
  difficulty_prior: 1.2
  version: 0.1.1
  status: active
- id: kc.mth.o.calculus.definite_integrals
  code: MTH-O-10.02.K01
  node_id: cur.mth.o.calculus.integration
  statement: Evaluate definite integrals of polynomials and find the area under a curve
  kind: procedural
  tools:
  - math_integrate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.mth.o.calculus.differentiate_powers
    strength: required
  misconception_ids:
  - mc.mth.o.integral_limits_reversed
  - mc.mth.o.integral_power_not_divided
  - mc.mth.o.integrate_by_differentiating
  skill_ids:
  - mth-o-calculus
  glossary:
  - integral
  - definite integral
  - integrate
  - integration
  - limit
  - area under a curve
  key_points:
  - id: kp_integrate_limits
    text:
      en: Integrate each term by raising the power by one and dividing by it, then use the upper limit and subtract the lower.
    follow_up:
      en: In what order are the limits used once the integral has been found?
  - id: kp_area_under_curve
    text:
      en: A definite integral gives the area between the curve and the x-axis, with area below the axis counting as negative.
    follow_up:
      en: What does the value of a definite integral represent on the graph?
  difficulty_prior: 1.0
  version: 0.1.1
  status: active
