- id: kc.mth.o.algebra_and_graphs.substitution
  code: MTH-O-02.01.K01
  node_id: cur.mth.o.algebra_and_graphs.introduction_to_algebra
  statement: Evaluate an expression or formula by substituting given values for its letters
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.052
  prerequisites:
  - kc_id: kc.mth.o.number.order_of_operations
    strength: required
  misconception_ids:
  - mc.mth.o.brackets_ignored
  - mc.mth.o.formula_half_dropped
  - mc.mth.o.multiply_before_power
  - mc.mth.o.negative_squared_negative
  - mc.mth.o.power_dropped
  - mc.mth.o.sign_lost_substitution
  - mc.mth.o.sum_as_product
  skill_ids:
  - mth-o-algebra-and-graphs
  glossary:
  - substitute
  - substitution
  - expression
  - formula
  - formulae
  - evaluate
  key_points:
  - id: kp_replace_letters
    text:
      en: Each letter is replaced by its given number, keeping the brackets, and then the expression is worked out.
    follow_up:
      en: What do you do with each letter before you start calculating?
  - id: kp_negatives_care
    text:
      en: When a negative number replaces a letter, it goes in brackets so that signs and powers are handled correctly.
    follow_up:
      en: Why can it matter how you write a negative value into a squared term?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.mth.o.algebra_and_graphs.expand_brackets
  code: MTH-O-02.02.K01
  node_id: cur.mth.o.algebra_and_graphs.algebraic_manipulation
  statement: Use the distributive law to expand single and double brackets and collect like terms
  kind: procedural
  tools:
  - math_check_equivalence
  - math_evaluate
  exam_weight: 0.062
  prerequisites:
  - kc_id: kc.mth.o.algebra_and_graphs.substitution
    strength: required
  misconception_ids:
  - mc.mth.o.expand_add_constants
  - mc.mth.o.expand_first_term_only
  - mc.mth.o.expand_missing_middle
  - mc.mth.o.expand_sign_slip
  skill_ids:
  - mth-o-algebra-and-graphs
  glossary:
  - expand
  - expansion
  - distributive law
  - like terms
  - expression
  - coefficient
  key_points:
  - id: kp_multiply_each
    text:
      en: Every term inside a bracket is multiplied by the term outside, and in a double bracket every term meets every term.
    follow_up:
      en: In a double bracket, how many separate products do you form, and between which terms?
  - id: kp_collect_like
    text:
      en: After expanding, only like terms, those with the same letters and powers, are added or subtracted.
    follow_up:
      en: After expanding, which terms may be combined, and which may not?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.algebra_and_graphs.factorise_common
  code: MTH-O-02.02.K02
  node_id: cur.mth.o.algebra_and_graphs.algebraic_manipulation
  statement: Use common factors and the difference of two squares to factorise expressions
  kind: procedural
  tools:
  - math_check_equivalence
  - math_evaluate
  exam_weight: 0.052
  prerequisites:
  - kc_id: kc.mth.o.algebra_and_graphs.expand_brackets
    strength: required
  misconception_ids:
  - mc.mth.o.dots_as_square
  - mc.mth.o.dots_not_rooted
  - mc.mth.o.factor_one_term_only
  - mc.mth.o.factorise_not_fully
  - mc.mth.o.expand_sign_slip
  skill_ids:
  - mth-o-algebra-and-graphs
  glossary:
  - factorise
  - factorised
  - factorisation
  - common factor
  - highest common factor
  - difference of two squares
  - expression
  key_points:
  - id: kp_factorise_reverse
    text:
      en: 'Factorising is expanding in reverse: take out the largest factor that divides every term and write the rest in a bracket.'
    follow_up:
      en: How could you check that a factorised answer is right?
  - id: kp_diff_squares
    text:
      en: A difference of two squares, a squared minus b squared, factorises into two brackets with the same terms and opposite signs.
    follow_up:
      en: What must be true of an expression with two terms before it can be split into two such brackets?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.mth.o.algebra_and_graphs.factorise_quadratic
