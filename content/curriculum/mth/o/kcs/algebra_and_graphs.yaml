  - numerator
  - denominator
  - common denominator
  - factorise
  - simplify
  - expression
  key_points:
  - id: kp_factorise_cancel
    text:
      en: Numerator and denominator are factorised first, and only whole common factors are cancelled, never separate terms.
    follow_up:
