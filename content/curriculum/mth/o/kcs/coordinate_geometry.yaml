- id: kc.mth.o.coordinate_geometry.points_on_lines
  code: MTH-O-03.01.K01
  node_id: cur.mth.o.coordinate_geometry.coordinates
  statement: Determine whether a point lies on a line, or find a missing coordinate, by substituting into its equation
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.103
  prerequisites:
  - kc_id: kc.mth.o.algebra_and_graphs.substitution
    strength: required
  misconception_ids:
  - mc.mth.o.coordinates_swapped
  - mc.mth.o.line_sign_slip
  - mc.mth.o.equation_divide_first
  - mc.mth.o.multiply_before_power
  - mc.mth.o.rearrange_inverse_sign
  skill_ids:
  - mth-o-coordinate-geometry
  glossary:
  - coordinate
  - x-coordinate
  - y-coordinate
  - substitute
  - equation
  key_points:
  - id: kp_substitute_coords
    text:
      en: A point lies on a line if its coordinates make the equation true when put in for x and y.
    follow_up:
      en: How can you test whether a given point is on a given line?
  - id: kp_missing_coordinate
    text:
      en: To find a missing coordinate, substitute the known one into the equation and solve for the other.
    follow_up:
      en: If one coordinate of a point on the line is unknown, how do you find it?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.mth.o.coordinate_geometry.axis_intercepts
  code: MTH-O-03.02.K01
  node_id: cur.mth.o.coordinate_geometry.drawing_linear_graphs
  statement: Find where a straight line crosses the x-axis and the y-axis
  kind: procedural
  tools:
  - math_solve
  - math_evaluate
  exam_weight: 0.103
  prerequisites:
  - kc_id: kc.mth.o.coordinate_geometry.points_on_lines
    strength: required
  - kc_id: kc.mth.o.algebra_and_graphs.linear_equations
    strength: required
  misconception_ids:
  - mc.mth.o.c_as_x_intercept
  - mc.mth.o.intercept_sign
  - mc.mth.o.intercepts_swapped
  - mc.mth.o.line_sign_slip
  - mc.mth.o.gradient_inverted
  skill_ids:
  - mth-o-coordinate-geometry
  glossary:
  - intercept
  - x-axis
  - y-axis
  - x-intercept
  - y-intercept
  - coordinate
  key_points:
  - id: kp_x_axis_zero
    text:
      en: On the x-axis the y value is zero, so setting y to zero in the equation gives where the line meets it.
    follow_up:
      en: What is true about the y value at every point on the x-axis?
  - id: kp_y_axis_zero
    text:
      en: On the y-axis the x value is zero, so setting x to zero gives the other crossing point.
    follow_up:
      en: How do you find where a line meets the y-axis from its equation?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.coordinate_geometry.gradient
  code: MTH-O-03.03.K01
  node_id: cur.mth.o.coordinate_geometry.gradient_of_linear_graphs
  statement: Calculate the gradient of a straight line from two points on it
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.154
  prerequisites:
  - kc_id: kc.mth.o.coordinate_geometry.points_on_lines
    strength: required
  misconception_ids:
  - mc.mth.o.coordinates_added_not_subtracted
  - mc.mth.o.gradient_inverted
  - mc.mth.o.gradient_order_mixed
  - mc.mth.o.graph_one_point
  skill_ids:
  - mth-o-coordinate-geometry
  glossary:
  - gradient
  - coordinate
  - horizontal
  - vertical
  key_points:
  - id: kp_rise_over_run
    text:
      en: Pick two points on the line; the rise between them (up the y-axis) over the run (along the x-axis) is the gradient.
    follow_up:
      en: From two points on a line, which change goes on top when you work out the gradient?
  - id: kp_negative
    text:
      en: A line that goes down from left to right has a negative gradient.
    follow_up:
      en: How can you tell by looking at a line that its gradient is negative?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.mth.o.coordinate_geometry.segment_length
  code: MTH-O-03.04.K01
  node_id: cur.mth.o.coordinate_geometry.length_and_midpoint
  statement: Calculate the length of a line segment from the coordinates of its ends
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.128
  prerequisites:
  - kc_id: kc.mth.o.trigonometry.pythagoras
    strength: required
  misconception_ids:
  - mc.mth.o.coordinates_added_not_subtracted
  - mc.mth.o.length_changes_added
  - mc.mth.o.pythag_add_for_leg
  - mc.mth.o.pythag_no_root
  - mc.mth.o.pythag_sides_added
  skill_ids:
  - mth-o-coordinate-geometry
  glossary:
  - line segment
  - Pythagoras' theorem
  - coordinate
  - square root
  key_points:
  - id: kp_right_triangle
    text:
      en: The horizontal and vertical differences between the ends form two sides of a right-angled triangle.
    follow_up:
      en: What shape can be drawn between two points to help find the distance between them?
  - id: kp_use_pythagoras
    text:
      en: The length is the square root of the sum of the squared differences in x and in y.
    follow_up:
      en: Once you have the two differences, what do you do to reach the length?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.mth.o.coordinate_geometry.midpoint
  code: MTH-O-03.04.K02
  node_id: cur.mth.o.coordinate_geometry.length_and_midpoint
  statement: Find the midpoint of a line segment from the coordinates of its ends
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.115
  prerequisites:
  - kc_id: kc.mth.o.coordinate_geometry.points_on_lines
    strength: required
  misconception_ids:
  - mc.mth.o.coordinates_swapped
  - mc.mth.o.midpoint_not_halved
  - mc.mth.o.midpoint_subtracted
  skill_ids:
  - mth-o-coordinate-geometry
  glossary:
  - midpoint
  - line segment
  - coordinate
  key_points:
  - id: kp_average_coords
    text:
      en: The midpoint has the average of the two x values and the average of the two y values.
    follow_up:
      en: How do you get each coordinate of the point halfway along a segment?
  - id: kp_halfway_meaning
    text:
      en: The midpoint is the same distance from each end, so it lies halfway along the segment.
    follow_up:
      en: Why does averaging the coordinates give the middle of the segment?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.mth.o.coordinate_geometry.line_equation
  code: MTH-O-03.05.K01
  node_id: cur.mth.o.coordinate_geometry.equations_of_linear_graphs
  statement: Find the equation y = mx + c of a line from its gradient and a point, or from two points
  kind: procedural
  tools:
  - math_evaluate
  - math_solve
  exam_weight: 0.167
  prerequisites:
  - kc_id: kc.mth.o.coordinate_geometry.gradient
    strength: required
  misconception_ids:
  - mc.mth.o.c_as_y_coordinate
  - mc.mth.o.gradient_inverted
  - mc.mth.o.intercept_sign
  - mc.mth.o.line_sign_slip
  skill_ids:
  - mth-o-coordinate-geometry
  glossary:
  - gradient
  - y-intercept
  - intercept
  - equation
  - coordinate
  key_points:
  - id: kp_gradient_first
    text:
      en: Find the gradient from the given information, using the rise over the run between two points if needed.
    follow_up:
      en: What must you know about the line before you can write its equation?
  - id: kp_find_c
    text:
      en: Put the coordinates of a point on the line into y = mx + c with the gradient to find c.
    follow_up:
      en: How do you find the value of c once you have the gradient?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.coordinate_geometry.parallel_lines
  code: MTH-O-03.06.K01
  node_id: cur.mth.o.coordinate_geometry.parallel_lines
  statement: Use equal gradients to find the equation of a line parallel to a given line
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.115
  prerequisites:
  - kc_id: kc.mth.o.coordinate_geometry.line_equation
    strength: required
  misconception_ids:
  - mc.mth.o.c_as_y_coordinate
  - mc.mth.o.parallel_perpendicular_confused
  - mc.mth.o.parallel_same_intercept
  - mc.mth.o.intercept_sign
  skill_ids:
  - mth-o-coordinate-geometry
  glossary:
  - parallel
  - gradient
  - y-intercept
  - equation
  key_points:
  - id: kp_same_gradient
    text:
      en: Parallel lines have equal gradients, so a line parallel to a given one keeps that gradient.
    follow_up:
      en: What do two parallel lines have in common?
  - id: kp_new_intercept
    text:
      en: The parallel line's constant c is found using the point it must pass through, since the old c no longer applies.
    follow_up:
      en: Why can the new line not simply keep the old line's c?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.coordinate_geometry.perpendicular_lines
  code: MTH-O-03.07.K01
  node_id: cur.mth.o.coordinate_geometry.perpendicular_lines
  statement: Find the gradient and equation of a line perpendicular to a given line
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.115
  prerequisites:
  - kc_id: kc.mth.o.coordinate_geometry.line_equation
    strength: required
  misconception_ids:
  - mc.mth.o.parallel_perpendicular_confused
  - mc.mth.o.perpendicular_negative_only
  - mc.mth.o.perpendicular_reciprocal_only
  skill_ids:
  - mth-o-coordinate-geometry
  glossary:
  - perpendicular
  - gradient
  - negative reciprocal
  - reciprocal
  - equation
  key_points:
  - id: kp_negative_reciprocal
    text:
      en: The gradient of a perpendicular line is the negative reciprocal of the original gradient.
    follow_up:
      en: How are the gradients of two lines at right angles linked?
  - id: kp_product_minus_one
    text:
      en: Two perpendicular gradients multiply to give minus one, which can be used to check an answer.
    follow_up:
      en: How can you check that your two gradients really are perpendicular?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
