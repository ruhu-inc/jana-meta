- id: kc.mth.o.probability.single_event
  code: MTH-O-08.01.K01
  node_id: cur.mth.o.probability.introduction_to_probability
  statement: Calculate the probability of a single event and of the event not happening
  kind: procedural
  tools:
  - stats_compute
  - math_evaluate
  exam_weight: 0.293
  prerequisites:
  - kc_id: kc.mth.o.number.fdp_conversion
    strength: required
  misconception_ids:
  - mc.mth.o.complement_not_taken
  - mc.mth.o.probability_as_odds
  - mc.mth.o.probability_equal_categories
  skill_ids:
  - mth-o-probability
  glossary:
  - probability
  - probabilities
  - outcome
  - event
  - equally likely
  key_points:
  - id: kp_favourable_over_total
    text:
      en: Probability is the number of favourable outcomes divided by the total number of equally likely outcomes.
    follow_up:
      en: What two counts form a probability?
  - id: kp_complement
    text:
      en: The probability of an event not happening is 1 minus the probability that it does.
    follow_up:
      en: How do you find the chance that something does not happen?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.mth.o.probability.expected_frequency
  code: MTH-O-08.02.K01
  node_id: cur.mth.o.probability.relative_and_expected_frequencies
  statement: Calculate relative frequencies and expected frequencies
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.22
  prerequisites:
  - kc_id: kc.mth.o.probability.single_event
    strength: required
  misconception_ids:
  - mc.mth.o.expected_divides
  - mc.mth.o.expected_uses_complement
  - mc.mth.o.relative_frequency_inverted
  - mc.mth.o.complement_not_taken
  - mc.mth.o.percent_scale_wrong
  - mc.mth.o.probability_as_odds
  skill_ids:
  - mth-o-probability
  glossary:
  - relative frequency
  - expected frequency
  - frequency
  - probability
  - probabilities
  - trial
  - outcome
  key_points:
  - id: kp_relative_frequency
    text:
      en: Relative frequency is the number of times a result happened divided by the number of trials.
    follow_up:
      en: How is a relative frequency calculated from an experiment?
  - id: kp_expected_product
    text:
      en: Expected frequency is probability multiplied by the number of trials, a prediction rather than a certain result.
    follow_up:
      en: How do you predict how many times something will happen in a set number of trials?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.mth.o.probability.independent_events
  code: MTH-O-08.03.K01
  node_id: cur.mth.o.probability.probability_of_combined_events
  statement: Calculate probabilities of combined independent events using tables or tree diagrams
  kind: procedural
  tools:
  - stats_compute
  - math_evaluate
  exam_weight: 0.268
  prerequisites:
  - kc_id: kc.mth.o.probability.single_event
    strength: required
  - kc_id: kc.mth.o.number.fraction_arithmetic
    strength: required
  misconception_ids:
  - mc.mth.o.and_as_add
  - mc.mth.o.at_least_one_added
  - mc.mth.o.complement_not_taken
  - mc.mth.o.complement_of_both
  skill_ids:
  - mth-o-probability
  glossary:
  - independent
  - independent event
  - probability
  - probabilities
  - outcome
  - tree diagram
  - sample space
  - event
  key_points:
  - id: kp_multiply_branches
    text:
      en: For independent events the probabilities along the branches are multiplied for the chance of both happening.
    follow_up:
      en: How are probabilities combined along a path of a tree diagram?
  - id: kp_add_outcomes
    text:
      en: When several different paths give the wanted result, their probabilities are added.
    follow_up:
      en: What do you do if the outcome you want can happen in more than one way?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.mth.o.probability.dependent_events
  code: MTH-O-08.03.K02
  node_id: cur.mth.o.probability.probability_of_combined_events
  statement: Calculate probabilities of two events when items are chosen without replacement
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.22
  prerequisites:
  - kc_id: kc.mth.o.probability.independent_events
    strength: required
  misconception_ids:
  - mc.mth.o.and_as_add
  - mc.mth.o.denominator_not_reduced
  - mc.mth.o.without_replacement_ignored
  skill_ids:
  - mth-o-probability
  glossary:
  - dependent
  - without replacement
  - probability
  - probabilities
  - tree diagram
  - outcome
  - event
  key_points:
  - id: kp_numbers_change
    text:
      en: Without replacement, the number of items left changes after each pick, so the second probability uses a smaller total.
    follow_up:
      en: What changes about the second pick when the first item is not put back?
  - id: kp_conditional_branches
    text:
      en: The second set of branches shows probabilities that depend on what was picked first.
    follow_up:
      en: Why can the second pair of branches differ depending on the first branch?
  difficulty_prior: 0.7
  version: 0.1.1
  status: active
