  - itm.phy.o.projectiles.0007
  - itm.phy.o.projectiles.0004
- type: summary
  text:
    en: Split the launch velocity into two parts. Gravity changes only the vertical part; the horizontal part stays constant. The time of flight comes from the vertical motion, and the range is the horizontal velocity times the time of flight.
