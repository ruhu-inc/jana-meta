blocks:
- type: prior_knowledge
  item_ids:
  - itm.phy.o.motion.0139
- type: idea
  text:
    en: 'A kicked ball moves in two directions at the same time. Split its launch velocity into a horizontal part, u cos θ, and a vertical part, u sin θ. Sideways, nothing pushes or pulls on the ball, so the horizontal part stays the same for the whole flight. Up and down, gravity acts: the vertical part shrinks by g every second until the top, then grows again on the way down. Treat the two directions one at a time. The vertical motion tells you how long the flight lasts. Multiply that time by the horizontal velocity and you have the range.'
- type: worked_example
  worked_example_id: wex.phy.o.projectiles.0001
- type: guided_step
  item_id: itm.phy.o.projectiles.0005
- type: quick_check
