  - itm.phy.o.projectiles.0001
- type: common_mistakes
  text:
    en: 'Do not let the horizontal velocity slow down in your head: with no air resistance it stays constant. And do not stop the clock at the top: the time of flight is the whole trip, up and back down.'
  misconception_ids:
  - mc.phy.o.horizontal_velocity_slows
  - mc.phy.o.flight_time_is_time_to_top
- type: exit_check
  item_ids:
