- id: kc.phy.o.measurement.si_prefixes
  code: PHY-O-01.01.K01
  node_id: cur.phy.o.motion_forces_and_energy.measurement
  statement: Convert quantities between units with prefixes such as milli, micro, kilo and mega
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.3
  prerequisites: []
  misconception_ids:
  - mc.phy.o.area_volume_factor_not_raised
  - mc.phy.o.prefix_confused_with_neighbour
  - mc.phy.o.prefix_multiply_divide_swapped
  - mc.phy.o.prefix_power_wrong
  skill_ids:
  - phy-o-measurement
  glossary:
  - prefix
  - milli
  - micro
  - kilo
  - mega
  - giga
  - nano
  - SI unit
  key_points:
  - id: kp_powers_of_ten
    text:
      en: 'Each prefix is a power of ten: milli is 10⁻³, micro is 10⁻⁶, kilo is 10³ and mega is 10⁶.'
    follow_up:
      en: What number does the prefix micro stand for, and how does it help you convert to the base unit?
  - id: kp_bigger_number
    text:
      en: Changing to a smaller unit gives a larger number, and changing to a larger unit gives a smaller number.
    follow_up:
      en: Is the number bigger or smaller when you write a length in millimetres instead of metres, and why?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.phy.o.measurement.scalars_and_vectors
  code: PHY-O-01.01.K02
  node_id: cur.phy.o.motion_forces_and_energy.measurement
  statement: Distinguish scalar quantities from vector quantities and classify common examples
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.2
  prerequisites: []
  misconception_ids:
  - mc.phy.o.energy_as_vector
  - mc.phy.o.mass_as_vector
  - mc.phy.o.speed_as_vector
  - mc.phy.o.vector_as_scalar
  skill_ids:
  - phy-o-measurement
  glossary:
  - scalar
  - vector
  - magnitude
  - displacement
  - velocity
  - acceleration
  - momentum
  - density
  - force
  - gravitational store
  key_points:
  - id: kp_definition
    text:
      en: A scalar has size only, while a vector has both size and direction.
    follow_up:
      en: What extra piece of information does a vector have compared with a scalar?
  - id: kp_classify
    text:
      en: Speed, mass, time and energy are scalars, while velocity, force, displacement and acceleration are vectors.
    follow_up:
      en: Why is velocity a vector but speed a scalar?
  difficulty_prior: -1.0
  version: 0.1.1
  status: active
- id: kc.phy.o.measurement.resultant_vectors
  code: PHY-O-01.01.K03
  node_id: cur.phy.o.motion_forces_and_energy.measurement
  statement: Calculate the resultant of two vectors that act along the same line or at right angles
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.phy.o.measurement.scalars_and_vectors
    strength: required
  misconception_ids:
  - mc.phy.o.angle_shared_in_proportion
  - mc.phy.o.angle_uses_wrong_ratio
  - mc.phy.o.largest_vector_only
  - mc.phy.o.opposite_vectors_added
  - mc.phy.o.perpendicular_subtracted
  - mc.phy.o.pythagoras_for_a_line
  - mc.phy.o.pythagoras_subtracted
  - mc.phy.o.resultant_adds_sizes
  - mc.phy.o.resultant_angle_inverted
  - mc.phy.o.vector_as_scalar
  skill_ids:
  - phy-o-measurement
  glossary:
  - resultant
  - vector
  - magnitude
  - right angles
  - Pythagoras
  - scale drawing
  key_points:
  - id: kp_same_line
    text:
      en: Vectors along one line add if they point the same way and subtract if opposite, giving the resultant.
    follow_up:
      en: A boat moves at 4 m/s in still water against a river flowing at 1 m/s. How do you combine them?
  - id: kp_right_angles
    text:
      en: Two vectors at right angles combine by Pythagoras for the size, with trigonometry giving the direction.
    follow_up:
      en: How do you find the size of the resultant of a 3 N force and a 4 N force at right angles?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.phy.o.measurement.measuring_techniques
  code: PHY-O-01.01.K04
  node_id: cur.phy.o.motion_forces_and_energy.measurement
  statement: Use rulers, micrometers and repeated timing to measure small lengths and short time intervals
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.phy.o.measurement.si_prefixes
    strength: helpful
  misconception_ids:
  - mc.phy.o.main_scale_only
  - mc.phy.o.mm_cm_confused
  - mc.phy.o.oscillation_counted_wrongly
  - mc.phy.o.repeat_multiplied
  - mc.phy.o.repeat_not_divided
  - mc.phy.o.thimble_read_as_fiftieths
  - mc.phy.o.thimble_read_as_tenths
  - mc.phy.o.zero_error_ignored
  - mc.phy.o.zero_error_wrong_way
  skill_ids:
  - phy-o-measurement
  glossary:
  - micrometer
  - vernier calipers
  - oscillation
  - pendulum
  - period
  - reaction time
  key_points:
  - id: kp_micrometer
    text:
      en: A micrometer reads small lengths, such as a wire's diameter, far more precisely than a ruler can.
    follow_up:
      en: Which instrument would you choose for the thickness of a wire, and why?
  - id: kp_repeat_timing
    text:
      en: Timing many repeats and dividing by their number reduces the error when measuring a short time interval.
    follow_up:
      en: How can you get an accurate period for a pendulum that swings too fast to time once?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
