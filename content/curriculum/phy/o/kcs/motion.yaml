- id: kc.phy.o.motion.distance_or_displacement
  code: PHY-O-01.02.K01
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Distinguish distance from displacement, and speed from velocity
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.08
  prerequisites:
  - kc_id: kc.phy.o.measurement.scalars_and_vectors
    strength: helpful
  confusable_with:
  - kc.phy.o.motion.average_speed
  misconception_ids:
  - mc.phy.o.displacement_for_distance
  - mc.phy.o.distance_for_displacement
  - mc.phy.o.every_later_leg_subtracted
  - mc.phy.o.first_part_only
  - mc.phy.o.return_leg_left_out
  skill_ids:
  - phy-o-motion
  glossary:
  - displacement
  - speed
  - velocity
  - scalar
  - vector
  key_points:
  - id: kp_distance_displacement
    text:
      en: Distance is the total path length and has no direction; displacement is the straight-line change in position with a direction.
    follow_up:
      en: A runner completes one full lap of a track. How do her distance and displacement compare?
  - id: kp_speed_velocity
    text:
      en: Speed is a scalar, while velocity is speed in a given direction, so a change of direction changes velocity.
    follow_up:
      en: A car goes round a roundabout at a steady 30 km/h. Is its velocity constant, and why?
  difficulty_prior: -1.0
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.average_speed
  code: PHY-O-01.02.K02
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Calculate average speed from the total distance and the total time
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.phy.o.motion.distance_or_displacement
    strength: helpful
  misconception_ids:
  - mc.phy.o.average_of_speeds
  - mc.phy.o.rest_time_left_out
  - mc.phy.o.time_over_distance
  skill_ids:
  - phy-o-motion
  glossary:
  - average speed
  - speed
  - total distance
  - total time
  key_points:
  - id: kp_total_over_total
    text:
      en: Average speed is the total distance divided by the total time, including any stops.
    follow_up:
      en: A journey has a rest stop in the middle. Which distance and which time go into the average speed?
  - id: kp_not_mean
    text:
      en: Average speed is not the mean of the speeds on each part unless the times are equal.
    follow_up:
      en: A car covers 30 km at 60 km/h then 30 km at 30 km/h. Why can you not just average 60 and 30?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.speed_unit_conversion
  code: PHY-O-01.02.K03
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Convert a speed between kilometres per hour and metres per second
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.06
  prerequisites:
  - kc_id: kc.phy.o.measurement.si_prefixes
    strength: helpful
  misconception_ids:
  - mc.phy.o.kmh_conversion_inverted
  - mc.phy.o.kmh_divide_by_36
  - mc.phy.o.kmh_minutes_for_hours
  skill_ids:
  - phy-o-motion
  glossary:
  - kilometres per hour
  - metres per second
  - speed
  key_points:
  - id: kp_both_units
    text:
      en: 'Converting a speed changes both units: kilometres to metres (×1000) and hours to seconds (÷3600).'
    follow_up:
      en: Why does the time unit matter as much as the distance unit when converting a speed?
  - id: kp_factor_3_6
    text:
      en: So a speed in m/s is the speed in km/h divided by 3.6, giving a smaller number.
    follow_up:
      en: What single number can you use to convert km/h to m/s, and in which direction?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.acceleration_from_change
  code: PHY-O-01.02.K04
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Calculate acceleration from a change in velocity and the time it takes
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.14
  prerequisites:
  - kc_id: kc.phy.o.motion.distance_or_displacement
    strength: required
  - kc_id: kc.phy.o.motion.average_speed
    strength: helpful
  confusable_with:
  - kc.phy.o.motion.average_speed
  misconception_ids:
  - mc.phy.o.change_multiplied_by_time
  - mc.phy.o.deceleration_positive
  - mc.phy.o.final_velocity_over_time
  - mc.phy.o.velocities_added_for_change
  skill_ids:
  - phy-o-motion
  glossary:
  - acceleration
  - velocity
  - change in velocity
  - deceleration
  - decelerate
  - accelerate
  key_points:
  - id: kp_change_over_time
    text:
      en: Acceleration is the change in velocity divided by the time the change takes.
    follow_up:
      en: Which two velocities do you need, and what do you do with them before you use the time?
  - id: kp_per_second
    text:
      en: Its unit, m/s², means the velocity gained (or lost) each second.
    follow_up:
      en: What does an acceleration of 2 m/s² tell you happens to the speed every second?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.distance_time_gradient
  code: PHY-O-01.02.K05
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Interpret the gradient of a distance-time graph as the speed
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.phy.o.motion.average_speed
    strength: required
  misconception_ids:
  - mc.phy.o.distance_change_without_time
  - mc.phy.o.gradient_axes_swapped
  - mc.phy.o.gradient_from_one_point
  skill_ids:
  - phy-o-motion
  glossary:
  - distance-time graph
  - gradient
  - speed
  - constant speed
  key_points:
  - id: kp_gradient_speed
    text:
      en: 'On a distance-time graph the slope gives the speed, as distance covered over the time taken.'
    follow_up:
      en: What does a steeper line on a distance-time graph tell you about the motion?
  - id: kp_shapes
    text:
      en: A sloping straight line means constant speed, a horizontal line means at rest, and a curve means the speed is changing.
    follow_up:
      en: What do a flat section and a curved section of a distance-time graph each show?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.velocity_time_gradient
  code: PHY-O-01.02.K06
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Find acceleration from the gradient of a velocity-time graph
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.phy.o.motion.acceleration_from_change
    strength: required
  confusable_with:
  - kc.phy.o.motion.velocity_time_area
  misconception_ids:
  - mc.phy.o.vt_gradient_from_one_point
  - mc.phy.o.vt_gradient_read_as_velocity
  - mc.phy.o.gradient_axes_swapped
  skill_ids:
  - phy-o-motion
  glossary:
  - velocity-time graph
  - gradient
  - acceleration
  - velocity
  - deceleration
  key_points:
  - id: kp_gradient_is_acceleration
    text:
      en: The gradient (slope) of a velocity-time graph is the acceleration.
    follow_up:
      en: Which feature of the line on a velocity-time graph tells you how quickly the velocity changes?
  - id: kp_two_points
    text:
      en: Read two points off the line; the velocity gained between them over the time between them is the gradient.
    follow_up:
      en: What do you work out from two points on the line to find that gradient?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.velocity_time_area
  code: PHY-O-01.02.K07
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Find the distance travelled from the area under a velocity-time graph
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.phy.o.motion.average_speed
    strength: required
  confusable_with:
  - kc.phy.o.motion.velocity_time_gradient
  misconception_ids:
  - mc.phy.o.starting_velocity_ignored_in_area
  - mc.phy.o.triangle_area_without_half
  - mc.phy.o.velocity_change_used_for_area
  - mc.phy.o.vt_area_divided
  skill_ids:
  - phy-o-motion
  glossary:
  - velocity-time graph
  - area under
  - distance travelled
  - velocity
  - displacement
  key_points:
  - id: kp_area_distance
    text:
      en: The area between a velocity-time graph and the time axis equals the distance travelled.
    follow_up:
      en: Which part of a velocity-time graph do you measure to get the distance travelled?
  - id: kp_split_shapes
    text:
      en: Split the area under the line into rectangles and triangles, and add the parts for the total distance.
    follow_up:
      en: How do you find the area under a line that rises and then levels off?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.choose_equation
  code: PHY-O-01.02.K08
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Select the equation of uniform acceleration that links the known and unknown quantities
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.phy.o.motion.acceleration_from_change
    strength: required
  misconception_ids:
  - mc.phy.o.equation_missing_known
  - mc.phy.o.equation_with_unknown_time
  - mc.phy.o.equation_without_the_unknown
  skill_ids:
  - phy-o-motion
  glossary:
  - uniform acceleration
  - acceleration
  - initial velocity
  - final velocity
  - displacement
  - equation of motion
  - velocity
  key_points:
  - id: kp_list_knowns
    text:
      en: List the known quantities and the unknown, then pick the equation that contains exactly those and no other unknown.
    follow_up:
      en: How do you decide which equation of motion to use for a problem?
  - id: kp_missing_quantity
    text:
      en: Each equation links four of the five quantities s, u, v, a and t, so pick the one missing the quantity you neither know nor need.
    follow_up:
      en: A problem gives u, a and s and asks for v. Which quantity does the equation not need?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.solve_with_equation
  code: PHY-O-01.02.K09
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Solve for an unknown quantity with an equation of uniform acceleration
  kind: procedural
  tools:
  - math_solve
  - math_evaluate
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.phy.o.motion.choose_equation
    strength: required
  misconception_ids:
  - mc.phy.o.half_left_out
  - mc.phy.o.initial_velocity_term_dropped
  - mc.phy.o.rearrange_sign_error
  - mc.phy.o.square_not_rooted
  - mc.phy.o.squares_dropped
  skill_ids:
  - phy-o-motion
  glossary:
  - uniform acceleration
  - acceleration
  - initial velocity
  - final velocity
  - displacement
  - equation of motion
  - velocity
  - deceleration
  key_points:
  - id: kp_rearrange_units
    text:
      en: 'Rearrange for the unknown, then substitute values in SI units: metres, m/s, m/s² and seconds.'
    follow_up:
      en: What should you check about each given value before substituting it into the equation?
  - id: kp_hidden_values
    text:
      en: 'Wording hides values: starting from rest means u = 0, and coming to a stop means v = 0.'
    follow_up:
      en: What initial speed do you use for a car that starts from rest?
  difficulty_prior: 0.5
  version: 0.1.1
  status: active
- id: kc.phy.o.motion.free_fall
  code: PHY-O-01.02.K10
  node_id: cur.phy.o.motion_forces_and_energy.motion
  statement: Apply the equations of uniform acceleration to motion under gravity
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.08
  prerequisites:
  - kc_id: kc.phy.o.motion.solve_with_equation
    strength: required
  misconception_ids:
  - mc.phy.o.fall_formulas_mixed
  - mc.phy.o.g_divided_by_time
  - mc.phy.o.gravity_sign_flipped
  - mc.phy.o.half_left_out
  - mc.phy.o.half_used_for_velocity
  - mc.phy.o.speed_times_g_for_time
  - mc.phy.o.steeper_launch_goes_further
  - mc.phy.o.top_speed_not_zero
  - mc.phy.o.whole_flight_time
  skill_ids:
  - phy-o-motion
  glossary:
  - free fall
  - acceleration due to gravity
  - gravity
  - uniform acceleration
  - acceleration
  - velocity
  - air resistance
  - initial velocity
  - maximum height
  key_points:
  - id: kp_g_any_mass
    text:
      en: Without air resistance every falling object accelerates downwards at about 10 m/s², whatever its mass.
    follow_up:
      en: What acceleration does a freely falling object have, and does its mass matter?
  - id: kp_up_and_down
    text:
      en: A ball thrown upwards slows to zero at the top then speeds up again, with the same acceleration throughout.
    follow_up:
      en: What is the ball's velocity at its highest point and what is its acceleration there?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
