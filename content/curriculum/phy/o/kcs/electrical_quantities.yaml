- id: kc.phy.o.electrical_quantities.electric_charge
  code: PHY-O-04.02.K01
  node_id: cur.phy.o.electricity_and_magnetism.electrical_quantities
  statement: Explain charging by friction as a transfer of electrons and the forces between like and unlike charges
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.148
  prerequisites: []
  misconception_ids:
  - mc.phy.o.charge_created_by_rubbing
  - mc.phy.o.electron_count_divided_by_e
  - mc.phy.o.electron_gain_sign_reversed
  - mc.phy.o.like_charges_attract
  - mc.phy.o.protons_move_in_charging
  - mc.phy.o.rubbed_pair_same_charge
  - mc.phy.o.prefix_multiply_divide_swapped
  skill_ids:
  - phy-o-electrical-quantities
  glossary:
  - charge
  - electric charge
  - electron
  - friction
  - insulator
  - conductor
  - positive charge
  - negative charge
  - attract
  - repel
  - electrostatic
  - charged
  - uncharged
  - attraction
  - repulsion
  key_points:
  - id: kp_electron_transfer
    text:
      en: Rubbing transfers electrons from one object to the other; the object that gains electrons becomes negative.
    follow_up:
      en: When a rod is charged by rubbing, which particles move, and what charge does each object end up with?
  - id: kp_like_unlike
    text:
      en: Like charges repel and unlike charges attract.
    follow_up:
      en: What does a positively charged rod do to a negatively charged ball, and what does it do to a positive one?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.phy.o.electrical_quantities.current_and_charge
  code: PHY-O-04.02.K02
  node_id: cur.phy.o.electricity_and_magnetism.electrical_quantities
  statement: Use charge = current × time to find the charge, current or time
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.197
  prerequisites:
  - kc_id: kc.phy.o.electrical_quantities.electric_charge
    strength: required
  misconception_ids:
  - mc.phy.o.charge_current_divided_by_time
  - mc.phy.o.milliamps_used_as_amps
  - mc.phy.o.minutes_used_as_seconds
  - mc.phy.o.q_it_multiplied
  - mc.phy.o.q_it_upside_down
  skill_ids:
  - phy-o-electrical-quantities
  glossary:
  - current
  - charge
  - coulomb
  - ampere
  - amp
  - milliamp
  - electron
  - circuit
  - ammeter
  key_points:
  - id: kp_charge_product
    text:
      en: Charge equals current multiplied by time, so a current of 1 A carries 1 C of charge each second.
    follow_up:
      en: How is the charge that flows through a lamp linked to the current and the time it flows?
  - id: kp_time_seconds
    text:
      en: The time must be in seconds, so minutes are converted first when using Q = It.
    follow_up:
      en: A current runs for 3 minutes. What must you do with the time before finding the charge?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.electrical_quantities.potential_difference
  code: PHY-O-04.02.K03
  node_id: cur.phy.o.electricity_and_magnetism.electrical_quantities
  statement: Relate e.m.f. and potential difference to the energy transferred per unit charge
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.164
  prerequisites:
  - kc_id: kc.phy.o.electrical_quantities.current_and_charge
    strength: required
  - kc_id: kc.phy.o.energy.stores_and_transfers
    strength: helpful
  misconception_ids:
  - mc.phy.o.charge_used_up_in_lamp
  - mc.phy.o.emf_is_a_force
  - mc.phy.o.energy_time_left_out
  - mc.phy.o.kilo_prefix_ignored
  - mc.phy.o.minutes_used_as_seconds
  - mc.phy.o.pd_flows_through_component
  - mc.phy.o.w_qv_divided
  - mc.phy.o.w_qv_multiplied
  - mc.phy.o.w_qv_upside_down
  skill_ids:
  - phy-o-electrical-quantities
  glossary:
  - potential difference
  - e.m.f.
  - electromotive force
  - volt
  - voltage
  - charge
  - coulomb
  - energy transferred
  - joule
  - cell
  - circuit
  key_points:
  - id: kp_energy_per_charge
    text:
      en: The p.d. across a component is the energy transferred to it by each coulomb of charge passing through.
    follow_up:
      en: What does a voltmeter reading of 6 V across a lamp tell you about each coulomb of charge?
  - id: kp_emf
    text:
      en: The e.m.f. of a source is the energy it gives to each coulomb of charge as it drives it round the circuit.
    follow_up:
      en: In energy terms, what separates a cell's e.m.f. from the p.d. across a lamp?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.electrical_quantities.resistance
  code: PHY-O-04.02.K04
  node_id: cur.phy.o.electricity_and_magnetism.electrical_quantities
  statement: Calculate resistance, current or potential difference with R = V / I
  kind: procedural
  tools:
  - math_evaluate
  - phys_circuit
  exam_weight: 0.213
  prerequisites:
  - kc_id: kc.phy.o.electrical_quantities.current_and_charge
    strength: required
  - kc_id: kc.phy.o.electrical_quantities.potential_difference
    strength: helpful
  misconception_ids:
  - mc.phy.o.kilo_prefix_ignored
  - mc.phy.o.milliamps_used_as_amps
  - mc.phy.o.ohm_law_divided
  - mc.phy.o.ohm_law_multiplied
  - mc.phy.o.ohm_law_upside_down
  skill_ids:
  - phy-o-electrical-quantities
  glossary:
  - resistance
  - resistor
  - potential difference
  - current
  - ohm
  - volt
  - amp
  - milliamp
  - voltage
  - circuit
  key_points:
  - id: kp_v_over_i
    text:
      en: Resistance is the p.d. across a component divided by the current through it (R = V/I).
    follow_up:
      en: Which quantity goes on top when you work out a resistance from a p.d. and a current?
  - id: kp_si_units
    text:
      en: Use volts and amps, not milliamps, to get the resistance in ohms.
    follow_up:
      en: What must you do to a current given in milliamps before you use it?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.electrical_quantities.resistance_of_wires
  code: PHY-O-04.02.K05
  node_id: cur.phy.o.electricity_and_magnetism.electrical_quantities
  statement: Predict how the resistance of a wire changes with its length and cross-sectional area
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.131
  prerequisites:
  - kc_id: kc.phy.o.electrical_quantities.resistance
    strength: required
  misconception_ids:
  - mc.phy.o.diameter_used_as_area
  - mc.phy.o.extra_length_only
  - mc.phy.o.longer_wire_less_resistance
  - mc.phy.o.resistance_set_by_material_only
  - mc.phy.o.thicker_wire_more_resistance
  skill_ids:
  - phy-o-electrical-quantities
  glossary:
  - resistance
  - cross-sectional area
  - ohm
  - resistor
  - conductor
  key_points:
  - id: kp_length
    text:
      en: Resistance is directly proportional to length, so a wire twice as long has twice the resistance.
    follow_up:
      en: What happens to the resistance if the same wire is made three times as long?
  - id: kp_area
    text:
      en: Resistance is inversely proportional to cross-sectional area, so a thicker wire has less resistance.
    follow_up:
      en: How would you change a wire's thickness to lower its resistance, and why does that work?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
- id: kc.phy.o.electrical_quantities.current_voltage_graphs
  code: PHY-O-04.02.K06
  node_id: cur.phy.o.electricity_and_magnetism.electrical_quantities
  statement: Interpret current-voltage graphs for a fixed resistor, a filament lamp and a diode
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.148
  prerequisites:
  - kc_id: kc.phy.o.electrical_quantities.resistance
    strength: required
  misconception_ids:
  - mc.phy.o.diode_conducts_both_ways
  - mc.phy.o.iv_gradient_is_resistance
  - mc.phy.o.lamp_resistance_constant
  - mc.phy.o.lamp_resistance_falls_when_hot
  - mc.phy.o.milliamps_used_as_amps
  - mc.phy.o.resistance_from_chord_slope
  skill_ids:
  - phy-o-electrical-quantities
  glossary:
  - current
  - voltage
  - potential difference
  - resistor
  - filament lamp
  - diode
  - current-voltage graph
  - resistance
  - gradient
  - ohmic
  key_points:
  - id: kp_resistor_line
    text:
      en: For a fixed resistor the graph is a straight line through the origin, because current is proportional to voltage.
    follow_up:
      en: What shape of current-voltage graph tells you that a component has constant resistance?
  - id: kp_lamp_curve
    text:
      en: A filament lamp's graph curves because its filament gets hotter and its resistance rises.
    follow_up:
      en: Why does the current through a filament lamp rise by less and less as the voltage increases?
  - id: kp_diode_graph
    text:
      en: A diode's graph shows almost no current one way and a rapid rise the other way once a small voltage is passed.
    follow_up:
      en: What does a diode's graph look like for each direction of voltage?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
