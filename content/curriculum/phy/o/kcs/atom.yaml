  - proton
  - neutron
  - electron
  - nucleon
  - proton number
  - nucleon number
  - nuclide
  - nuclide notation
  - neutral atom
  - element
  key_points:
  - id: kp_protons_electrons
    text:
      en: The proton number is the number of protons, and in a neutral atom it equals the number of electrons.
    follow_up:
      en: In a neutral atom, how is the electron count linked to the lower number in the nuclide symbol?
  - id: kp_neutrons
    text:
      en: The number of neutrons is the nucleon number minus the proton number.
    follow_up:
      en: Which two numbers in the nuclide notation do you combine to get the neutrons, and how?
