- id: kc.phy.o.heat_transfer.conduction
  code: PHY-O-02.03.K01
  node_id: cur.phy.o.thermal_physics.transfer_of_thermal_energy
  statement: Explain conduction through solids and compare good and poor thermal conductors
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.333
  prerequisites:
  - kc_id: kc.phy.o.particles.states_of_matter
    strength: required
  misconception_ids:
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.conduction_particles_travel
  - mc.phy.o.insulator_produces_heat
  - mc.phy.o.metal_conduction_vibration_only
  - mc.phy.o.metal_feels_colder_because_colder
  - mc.phy.o.particles_grow_when_heated
  skill_ids:
  - phy-o-heat-transfer
  glossary:
  - conduction
  - conductor
  - thermal conductor
  - insulator
  - thermal
  - free electrons
  - atomic vibrations
  - vibration
  - conduct
  - inversely proportional
  - rate of conduction
  key_points:
  - id: kp_particle_passing
    text:
      en: In solids, vibrating particles pass energy to their neighbours, and free electrons in metals carry it faster.
    follow_up:
      en: How does energy travel along a metal rod that is heated at one end?
  - id: kp_good_poor
    text:
      en: Metals conduct well because of free electrons, while non-metals, liquids and gases are poor conductors.
    follow_up:
      en: Why does a metal spoon feel colder to the touch than a wooden one at the same temperature?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.phy.o.heat_transfer.convection
  code: PHY-O-02.03.K02
  node_id: cur.phy.o.thermal_physics.transfer_of_thermal_energy
  statement: Explain convection currents in liquids and gases using changes in density
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.333
  prerequisites:
  - kc_id: kc.phy.o.heat_transfer.conduction
    strength: helpful
  - kc_id: kc.phy.o.density.floating_and_sinking
    strength: required
  misconception_ids:
  - mc.phy.o.convection_in_solids
  - mc.phy.o.density_unchanged_on_heating
  - mc.phy.o.expansion_order_reversed
  - mc.phy.o.heat_itself_rises
  - mc.phy.o.heated_fluid_denser
  - mc.phy.o.heating_creates_particles
  - mc.phy.o.particles_grow_when_heated
  - mc.phy.o.particles_have_bulk_properties
  - mc.phy.o.sea_warms_faster_than_land
  skill_ids:
  - phy-o-heat-transfer
  glossary:
  - convection
  - convection current
  - density
  - expand
  - expansion
  - fluid
  key_points:
  - id: kp_density_change
    text:
      en: A heated fluid expands and becomes less dense, so it rises while cooler, denser fluid sinks to replace it.
    follow_up:
      en: What happens to the density of water at the bottom of a heated beaker, and what follows?
  - id: kp_fluids_only
    text:
      en: This circulation is a convection current, and it needs particles free to move, so it cannot happen in solids.
    follow_up:
      en: Why can convection not take place in a solid?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.heat_transfer.radiation
  code: PHY-O-02.03.K03
  node_id: cur.phy.o.thermal_physics.transfer_of_thermal_energy
  statement: Relate the emission and absorption of infrared radiation to a surface's colour, texture and temperature
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.333
  prerequisites:
  - kc_id: kc.phy.o.heat_transfer.conduction
    strength: helpful
  misconception_ids:
  - mc.phy.o.cold_objects_do_not_radiate
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.colour_irrelevant_for_infrared
  - mc.phy.o.conduction_particles_travel
  - mc.phy.o.good_absorber_poor_emitter
  - mc.phy.o.heat_itself_rises
  - mc.phy.o.insulator_produces_heat
  - mc.phy.o.radiation_needs_medium
  - mc.phy.o.shiny_surfaces_better_radiators
  - mc.phy.o.vacuum_stops_radiation
  skill_ids:
  - phy-o-heat-transfer
  glossary:
  - infrared radiation
  - infrared
  - radiation
  - emission
  - emit
  - absorption
  - absorb
  - emitter
  - absorber
  - matt
  key_points:
  - id: kp_surface
    text:
      en: Dark, matt surfaces are the best absorbers and emitters of infrared radiation, and light, shiny ones are the worst.
    follow_up:
      en: Which kind of surface makes a good radiator and which a good lining for a flask?
  - id: kp_hotter
    text:
      en: The hotter an object is, the more infrared radiation it emits.
    follow_up:
      en: How does the infrared given out by a hot object compare with that from a cooler one?
  - id: kp_vacuum
    text:
      en: Infrared radiation needs no medium, so it can cross a vacuum.
    follow_up:
      en: How does the Sun's energy reach Earth when space has no particles to carry it?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
