- id: kc.phy.o.practical_electricity.fuses_and_safety
  code: PHY-O-04.04.K03
  node_id: cur.phy.o.electricity_and_magnetism.practical_electricity
  statement: Select a suitable fuse rating and explain the roles of the live, neutral and earth wires
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  - phys_circuit
  exam_weight: 0.303
  prerequisites:
  - kc_id: kc.phy.o.practical_electricity.electrical_power
    strength: required
  misconception_ids:
  - mc.phy.o.breaker_must_be_replaced
  - mc.phy.o.double_insulated_needs_earth
  - mc.phy.o.earth_wire_carries_working_current
  - mc.phy.o.electric_power_current_inverted
  - mc.phy.o.electric_power_current_multiplied
  - mc.phy.o.electric_power_kw_not_converted
  - mc.phy.o.fuse_in_neutral_wire
  - mc.phy.o.fuse_largest_always_safest
  - mc.phy.o.fuse_protects_person_from_shock
  - mc.phy.o.fuse_rating_below_current
  - mc.phy.o.fuse_rating_sets_current
  - mc.phy.o.neutral_and_earth_same
  - mc.phy.o.neutral_wire_is_live
  skill_ids:
  - phy-o-practical-electricity
  glossary:
  - fuse
  - fuse rating
  - live wire
  - neutral wire
  - earth wire
  - circuit breaker
  - double insulation
  - earthing
  - insulation
  - residual current device
  - current
  key_points:
  - id: kp_fuse_rating
    text:
      en: Choose a fuse rated just above the normal current of the appliance, found from I = P/V.
    follow_up:
      en: How do you decide the fuse rating for a 920 W appliance on a 230 V supply?
  - id: kp_live_neutral
    text:
      en: The live wire brings the current in at high voltage and the neutral wire completes the circuit; the fuse goes in the live wire.
    follow_up:
      en: Which of the live and neutral wires should carry the fuse, and why?
  - id: kp_earth
    text:
      en: The earth wire gives a low-resistance path for a fault current, so the fuse blows and the metal case stays safe.
    follow_up:
      en: What does the earth wire do if the live wire touches the metal case of an appliance?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
