- id: kc.phy.o.practical_electricity.electrical_power
  code: PHY-O-04.04.K01
  node_id: cur.phy.o.electricity_and_magnetism.practical_electricity
  statement: Calculate electrical power with P = IV and P = I²R
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  - phys_circuit
  exam_weight: 0.364
  prerequisites:
  - kc_id: kc.phy.o.electrical_quantities.resistance
    strength: required
  - kc_id: kc.phy.o.energy.power
    strength: helpful
  misconception_ids:
  - mc.phy.o.electric_power_current_inverted
  - mc.phy.o.electric_power_current_multiplied
  - mc.phy.o.electric_power_current_not_squared
  - mc.phy.o.electric_power_kw_not_converted
  - mc.phy.o.electric_power_r_multiplied
  - mc.phy.o.electric_power_square_as_double
  - mc.phy.o.electric_power_v_over_i
  - mc.phy.o.electric_power_voltage_not_squared
  - mc.phy.o.electric_power_wrong_quantity_squared
  skill_ids:
  - phy-o-practical-electricity
  glossary:
  - electrical power
  - power
  - watt
  - current
  - potential difference
  - resistance
  - resistor
  - voltage
  - power transferred
  key_points:
  - id: kp_p_iv
    text:
      en: Electrical power is the current multiplied by the voltage, P = IV, in watts.
    follow_up:
      en: Which two measurements give the power of an appliance?
  - id: kp_p_i2r
    text:
      en: Combining P = IV with V = IR gives P = I²R, useful when current and resistance are known.
    follow_up:
      en: You know the current and resistance of a heater but not its voltage. How can you find its power?
  difficulty_prior: 0.1
  version: 0.1.1
  status: active
