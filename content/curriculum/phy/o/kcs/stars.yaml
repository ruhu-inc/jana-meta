- id: kc.phy.o.stars.light_years
  code: PHY-O-06.02.K01
  node_id: cur.phy.o.space_physics.stars_and_the_universe
  statement: Convert distances between light-years and metres using the speed of light
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.357
  prerequisites:
  - kc_id: kc.phy.o.measurement.si_prefixes
    strength: helpful
  misconception_ids:
  - mc.phy.o.distant_light_seen_now
  - mc.phy.o.light_time_inverted
  - mc.phy.o.light_time_km_not_converted
  - mc.phy.o.light_time_seconds_as_minutes
  - mc.phy.o.light_year_conversion_inverted
  - mc.phy.o.light_year_is_speed
  - mc.phy.o.light_year_is_time
