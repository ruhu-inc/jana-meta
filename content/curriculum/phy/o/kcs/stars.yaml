  - mc.phy.o.year_seconds_factor_missed
  skill_ids:
  - phy-o-stars
  glossary:
  - light-year
  - speed of light
  - star
  - galaxy
  key_points:
  - id: kp_distance_unit
    text:
      en: 'A light-year is a unit of distance: how far light travels in one year.'
    follow_up:
      en: Is a light-year a measure of time or of distance, and what does it represent?
  - id: kp_conversion
    text:
      en: One light-year is the speed of light × the number of seconds in a year, about 9.5 × 10¹⁵ m.
    follow_up:
      en: How would you work out the number of metres in one light-year from the speed of light?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
