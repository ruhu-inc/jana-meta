- id: kc.phy.o.stars.expanding_universe
  code: PHY-O-06.02.K03
  node_id: cur.phy.o.space_physics.stars_and_the_universe
  statement: Use redshift and recession speed = Hubble constant × distance to describe the expanding Universe
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.286
  prerequisites:
  - kc_id: kc.phy.o.stars.light_years
    strength: required
  misconception_ids:
  - mc.phy.o.big_bang_centre_in_space
  - mc.phy.o.cmb_is_starlight
  - mc.phy.o.distant_light_seen_now
  - mc.phy.o.galaxies_recede_at_same_speed
  - mc.phy.o.hubble_age_not_converted
  - mc.phy.o.hubble_relation_inverted
  - mc.phy.o.hubble_speed_units_not_converted
  - mc.phy.o.nearer_galaxies_recede_faster
  - mc.phy.o.redshift_means_galaxy_red
  - mc.phy.o.redshift_to_shorter_wavelength
  - mc.phy.o.universe_unchanging
  skill_ids:
  - phy-o-stars
  glossary:
  - redshift
  - recession speed
  - Hubble constant
  - Hubble's law
  - galaxy
  - galaxies
  - expanding Universe
  - Universe
  - Big Bang
  - light-year
  - cosmic microwave background radiation
  - cosmic microwave background
  - radio telescope
  - microwave
  key_points:
  - id: kp_redshift
    text:
      en: Far galaxies show redshift, their light stretched to longer wavelengths, so they must be receding.
    follow_up:
      en: What does a shift of a galaxy's light towards longer wavelengths tell you about its motion?
  - id: kp_hubble
    text:
      en: Recession speed = Hubble constant × distance, so farther galaxies move away faster, which suggests the Universe is expanding.
    follow_up:
      en: How is a galaxy's recession speed related to its distance, and what does this suggest about the Universe?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
