- id: kc.phy.o.thermal_properties.thermal_expansion
  code: PHY-O-02.02.K01
  node_id: cur.phy.o.thermal_physics.thermal_properties_and_temperature
  statement: Explain the thermal expansion of solids, liquids and gases and its everyday uses and problems
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.195
  prerequisites:
  - kc_id: kc.phy.o.particles.states_of_matter
    strength: required
  misconception_ids:
  - mc.phy.o.bimetal_bends_towards_greater_expansion
  - mc.phy.o.density_unchanged_on_heating
  - mc.phy.o.expansion_order_reversed
  - mc.phy.o.heating_creates_particles
  - mc.phy.o.particles_grow_when_heated
  skill_ids:
  - phy-o-thermal-properties
  glossary:
  - thermal expansion
  - expand
  - expansion
  - contract
  - contraction
  - expansion gap
  - bimetallic strip
  - thermostat
  - thermometer
  key_points:
  - id: kp_particles
    text:
      en: Heating makes particles vibrate or move more and take up more space, so substances expand; gases expand most and solids least.
    follow_up:
      en: Why does a heated solid get bigger, and which state of matter expands the most?
  - id: kp_effects
    text:
      en: Expansion is used in thermostats and thermometers, but must be allowed for in bridges and railway lines.
    follow_up:
      en: Why are small gaps left between sections of a railway track?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.thermal_properties.specific_heat_capacity
  code: PHY-O-02.02.K02
  node_id: cur.phy.o.thermal_physics.thermal_properties_and_temperature
  statement: Use energy = mass × specific heat capacity × temperature change to find any one quantity
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.317
  prerequisites:
  - kc_id: kc.phy.o.energy.stores_and_transfers
    strength: required
  - kc_id: kc.phy.o.particles.temperature_scales
    strength: helpful
  misconception_ids:
  - mc.phy.o.heater_minutes_not_seconds
  - mc.phy.o.kelvin_change_offset_added
  - mc.phy.o.shc_final_temperature_used
  - mc.phy.o.shc_rearranged_wrongly
  - mc.phy.o.shc_rise_given_as_final
  - mc.phy.o.thermal_grams_as_kg
  skill_ids:
  - phy-o-thermal-properties
  glossary:
  - specific heat capacity
  - temperature change
  - temperature rise
  - thermal energy
  - joule
  - kilojoule
  - thermal store
  key_points:
  - id: kp_definition
    text:
      en: Specific heat capacity is the energy needed to raise the temperature of 1 kg of a substance by 1 °C.
    follow_up:
      en: What does a specific heat capacity of 4200 J/(kg °C) tell you about one kilogram of water?
  - id: kp_formula
    text:
      en: The energy transferred equals mass × specific heat capacity × temperature change.
    follow_up:
      en: Which three quantities multiply together to give the energy needed to warm something up?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.thermal_properties.latent_heat
  code: PHY-O-02.02.K03
  node_id: cur.phy.o.thermal_physics.thermal_properties_and_temperature
  statement: Calculate the energy needed to melt or boil a substance using its specific latent heat
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.268
  prerequisites:
  - kc_id: kc.phy.o.particles.states_of_matter
    strength: required
  - kc_id: kc.phy.o.thermal_properties.specific_heat_capacity
    strength: helpful
  misconception_ids:
  - mc.phy.o.heater_minutes_not_seconds
  - mc.phy.o.latent_divided_by_mass
  - mc.phy.o.latent_stage_omitted
  - mc.phy.o.latent_wrong_kind
  - mc.phy.o.thermal_grams_as_kg
  skill_ids:
  - phy-o-thermal-properties
  glossary:
  - specific latent heat
  - latent heat
  - melting
  - boiling
  - melt
  - boil
  - change of state
  - fusion
  - vaporisation
  - kilojoule
  key_points:
  - id: kp_no_temp_change
    text:
      en: While a substance melts or boils, the energy supplied breaks bonds between particles instead of raising the temperature.
    follow_up:
      en: A kettle is boiling steadily. Where does the extra energy go, if not into the temperature?
  - id: kp_latent_formula
    text:
      en: The energy for a change of state is mass × specific latent heat, with different values for melting and for boiling.
    follow_up:
      en: Which two quantities do you multiply to get the energy needed for melting or boiling?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.thermal_properties.changes_of_state
  code: PHY-O-02.02.K04
  node_id: cur.phy.o.thermal_physics.thermal_properties_and_temperature
  statement: Interpret heating and cooling curves and distinguish evaporation from boiling
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.22
  prerequisites:
  - kc_id: kc.phy.o.thermal_properties.latent_heat
    strength: required
  misconception_ids:
  - mc.phy.o.boiling_point_rises_with_heating
  - mc.phy.o.cold_transferred_as_substance
  - mc.phy.o.evaporation_only_at_boiling_point
  - mc.phy.o.evaporation_removes_slow_particles
  - mc.phy.o.heater_minutes_not_seconds
  - mc.phy.o.no_energy_when_temperature_constant
  - mc.phy.o.particles_have_bulk_properties
  - mc.phy.o.solid_particles_motionless
  - mc.phy.o.state_change_energy_direction_reversed
  - mc.phy.o.temperature_rises_during_melting
  - mc.phy.o.wind_cools_by_being_cold
  skill_ids:
  - phy-o-thermal-properties
  glossary:
  - evaporation
  - evaporate
  - evaporating
  - boiling
  - boiling point
  - melting point
  - condensation
  - solidification
  - change of state
  - heating curve
  - cooling curve
  - latent heat
  - specific latent heat
  - vapour
  - melting
  key_points:
  - id: kp_curves
    text:
      en: On a heating curve the temperature stays flat while the substance melts or boils, and rises between those stages.
    follow_up:
      en: What happens to the temperature during melting or boiling?
  - id: kp_evaporation_boiling
    text:
      en: Evaporation happens at any temperature from the surface only, while boiling happens at one temperature throughout the liquid.
    follow_up:
      en: Name two differences between evaporation and boiling.
  difficulty_prior: 0.1
  version: 0.1.1
  status: active
