  key_points:
  - id: kp_gravity_orbit
    text:
      en: The Sun's gravity pulls each planet inwards, giving the force that keeps it in a near-circular orbit.
    follow_up:
      en: What force keeps the Earth moving round the Sun instead of travelling in a straight line?
  - id: kp_closer_faster
    text:
      en: Planets nearer the Sun feel stronger gravity, orbit faster and have shorter years than distant ones.
