  - period
  key_points:
  - id: kp_circumference
    text:
      en: Orbital speed is the distance around the orbit, 2πr, divided by the orbital period.
    follow_up:
      en: What distance does a planet travel in one orbit, and which time goes with it?
  - id: kp_si_units
    text:
      en: Radius and period must be in metres and seconds to give a speed in m/s.
    follow_up:
      en: A period is given in days and a radius in km. What must you do before finding the speed in m/s?
  difficulty_prior: 0.2
