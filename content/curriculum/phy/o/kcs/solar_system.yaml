- id: kc.phy.o.solar_system.earth_and_moon
  code: PHY-O-06.01.K01
  node_id: cur.phy.o.space_physics.earth_and_the_solar_system
  statement: Explain day and night, the year, the seasons and the Moon's phases from the motions of the Earth and Moon
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.357
  prerequisites: []
  misconception_ids:
  - mc.phy.o.earth_spin_orbit_confused
  - mc.phy.o.moon_earth_periods_confused
  - mc.phy.o.moon_makes_own_light
  - mc.phy.o.moon_orbits_earth_daily
  - mc.phy.o.moon_phases_earth_shadow
  - mc.phy.o.seasons_same_both_hemispheres
  - mc.phy.o.sun_distance_causes_seasons
  - mc.phy.o.sun_orbits_earth_daily
  skill_ids:
  - phy-o-solar-system
  glossary:
  - orbit
  - axis
  - tilt
  - hemisphere
  - season
  - phases
  - phase
  - rotation
  - rotate
  - Moon's phases
  - sunlit
  key_points:
  - id: kp_day_night
    text:
      en: Day and night happen because Earth spins on its axis once every 24 hours, turning each place towards then away from the Sun.
    follow_up:
      en: What movement of the Earth causes day and night, and how long does it take?
  - id: kp_seasons
    text:
      en: The seasons happen because Earth's axis is tilted, so each hemisphere gets more direct, longer sunlight when tilted to the Sun.
    follow_up:
      en: Why is it summer in the north when the south has winter?
  - id: kp_phases
    text:
      en: The Moon's phases change because, as it orbits Earth each month, we see different amounts of its sunlit half.
    follow_up:
      en: Why does the shape of the lit part of the Moon change over a month?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.phy.o.solar_system.orbital_speed
  code: PHY-O-06.01.K02
