- id: kc.phy.o.mass_weight.weight_from_mass
  code: PHY-O-01.03.K01
  node_id: cur.phy.o.motion_forces_and_energy.mass_and_weight
  statement: Calculate weight from mass and gravitational field strength, and mass from weight
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.6
  prerequisites:
  - kc_id: kc.phy.o.measurement.si_prefixes
    strength: helpful
  misconception_ids:
  - mc.phy.o.planet_g_mismatched
  - mc.phy.o.planet_g_ratio_inverted
  - mc.phy.o.weight_given_as_mass_number
  - mc.phy.o.weight_grams_not_converted
  - mc.phy.o.weight_mass_divided_by_g
  - mc.phy.o.weight_same_on_every_planet
  skill_ids:
  - phy-o-mass-weight
  glossary:
  - weight
  - mass
  - gravitational field strength
  - newton meter
  - newton
  - kilogram
  - gravity
  key_points:
  - id: kp_w_mg
    text:
      en: Weight equals mass multiplied by gravitational field strength, W = mg, with g about 10 N/kg on Earth.
    follow_up:
      en: How do you get the weight of an object from its mass?
  - id: kp_mass_from_weight
    text:
      en: To find mass from weight, divide by g, with weight in newtons and mass in kilograms.
    follow_up:
      en: A scale shows 50 N for an object. What do you divide by to find its mass in kg?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.phy.o.mass_weight.mass_or_weight
  code: PHY-O-01.03.K02
  node_id: cur.phy.o.motion_forces_and_energy.mass_and_weight
  statement: Distinguish mass from weight and predict how each changes on another planet or moon
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.4
  prerequisites:
  - kc_id: kc.phy.o.mass_weight.weight_from_mass
    strength: required
  misconception_ids:
  - mc.phy.o.balance_types_confused
  - mc.phy.o.mass_changes_with_g
  - mc.phy.o.mass_weight_roles_swapped
  - mc.phy.o.mass_weight_units_swapped
  - mc.phy.o.no_mass_in_space
  - mc.phy.o.planet_g_mismatched
  - mc.phy.o.planet_g_ratio_inverted
  - mc.phy.o.weight_given_as_mass_number
  - mc.phy.o.weight_mass_divided_by_g
  - mc.phy.o.weight_same_on_every_planet
  skill_ids:
  - phy-o-mass-weight
  glossary:
  - weight
  - mass
  - gravitational field strength
  - gravity
  - newton meter
  - newton
  - kilogram
  - planet
  key_points:
  - id: kp_mass_fixed
    text:
      en: Mass is the amount of matter in an object, and it does not change from place to place.
    follow_up:
      en: What happens to a person's mass when they stand on the Moon?
  - id: kp_weight_varies
    text:
      en: Weight is a gravitational force, so it changes with g and is smaller on the Moon than on Earth.
    follow_up:
      en: Why would the same person weigh less on the Moon, and which quantity makes the difference?
