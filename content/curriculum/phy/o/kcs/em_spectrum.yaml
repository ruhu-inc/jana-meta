- id: kc.phy.o.em_spectrum.order_and_properties
  code: PHY-O-03.03.K01
  node_id: cur.phy.o.waves.electromagnetic_spectrum
  statement: Recall the order of the electromagnetic spectrum and the properties all its waves share
  kind: factual
  tools:
  - math_evaluate
  exam_weight: 0.345
  prerequisites:
  - kc_id: kc.phy.o.wave_properties.transverse_and_longitudinal
    strength: required
  misconception_ids:
  - mc.phy.o.em_end_regions_mixed
  - mc.phy.o.em_needs_medium
  - mc.phy.o.em_order_reversed
  - mc.phy.o.em_same_wavelength
  - mc.phy.o.em_speed_differs
  - mc.phy.o.frequency_wavelength_rise_together
  - mc.phy.o.infrared_ultraviolet_swapped
  - mc.phy.o.light_called_longitudinal
  - mc.phy.o.nonionising_called_ionising
  - mc.phy.o.wave_carries_medium
  skill_ids:
  - phy-o-em-spectrum
  glossary:
  - electromagnetic spectrum
  - electromagnetic wave
  - electromagnetic
  - radio wave
  - microwave
  - infrared
  - visible light
  - ultraviolet
  - X-ray
  - gamma ray
  - wavelength
  - frequency
  - spectrum
  - vacuum
  - transverse
  key_points:
  - id: kp_order
    text:
      en: 'In order of decreasing wavelength: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.'
    follow_up:
      en: Starting from radio waves, what comes next as the frequency increases?
  - id: kp_shared
    text:
      en: All electromagnetic waves are transverse, carry energy, and travel at 3.0 × 10⁸ m/s in a vacuum.
    follow_up:
      en: What do all electromagnetic waves have in common in how they travel through empty space?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.phy.o.em_spectrum.em_wave_calculations
  code: PHY-O-03.03.K02
  node_id: cur.phy.o.waves.electromagnetic_spectrum
  statement: Use the speed of light with wave speed = frequency × wavelength for electromagnetic waves
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.345
  prerequisites:
  - kc_id: kc.phy.o.em_spectrum.order_and_properties
    strength: required
  - kc_id: kc.phy.o.wave_properties.wave_equation
    strength: required
  misconception_ids:
  - mc.phy.o.em_speed_differs
  - mc.phy.o.em_uses_sound_speed
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_equation_multiplied
  - mc.phy.o.wave_prefix_ignored
  skill_ids:
  - phy-o-em-spectrum
  glossary:
  - electromagnetic wave
  - electromagnetic
  - speed of light
  - wavelength
  - frequency
  - wave speed
  - hertz
  - gigahertz
  - megahertz
  - microwave
  - radio wave
  - satellite
  key_points:
  - id: kp_light_speed
    text:
      en: In a vacuum every electromagnetic wave travels at the speed of light, 3.0 × 10⁸ m/s.
    follow_up:
      en: What value of speed do you use for any electromagnetic wave when finding its frequency or wavelength?
  - id: kp_inverse
    text:
      en: Since the speed is fixed, a wave of higher frequency has a shorter wavelength.
    follow_up:
      en: If the frequency of an electromagnetic wave doubles, what happens to its wavelength?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.em_spectrum.uses_and_hazards
  code: PHY-O-03.03.K03
  node_id: cur.phy.o.waves.electromagnetic_spectrum
  statement: Relate each region of the electromagnetic spectrum to its uses and its hazards
  kind: factual
  tools:
  - math_evaluate
  exam_weight: 0.31
  prerequisites:
  - kc_id: kc.phy.o.em_spectrum.order_and_properties
