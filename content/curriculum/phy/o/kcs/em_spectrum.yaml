  - mc.phy.o.em_order_reversed
  - mc.phy.o.hazard_increases_with_wavelength
  - mc.phy.o.infrared_ultraviolet_swapped
  - mc.phy.o.long_wave_uses_mixed
  - mc.phy.o.nonionising_called_ionising
  - mc.phy.o.penetration_order_confused
  - mc.phy.o.xray_gamma_uses_swapped
  skill_ids:
  - phy-o-em-spectrum
  glossary:
  - electromagnetic spectrum
  - electromagnetic radiation
  - electromagnetic
  - radio wave
  - microwave
  - infrared
  - visible light
  - ultraviolet
  - X-ray
  - gamma ray
  - ionising
  - ionise
  - radiation
  - wavelength
  - frequency
  - satellite
  - radar
  - sterilise
  - sterilising
  key_points:
  - id: kp_ionising
    text:
      en: Ultraviolet, X-rays and gamma rays carry the most energy and are ionising, so they can damage living cells.
    follow_up:
      en: Which regions of the spectrum are most dangerous to living cells, and why?
  - id: kp_use_from_property
    text:
      en: Each use depends on a property of the waves, such as X-rays passing through soft tissue but not through bone.
    follow_up:
      en: What property of X-rays makes them useful for imaging the inside of the body?
