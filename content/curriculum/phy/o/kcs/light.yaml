- id: kc.phy.o.light.plane_mirrors
  code: PHY-O-03.02.K01
  node_id: cur.phy.o.waves.light
  statement: Apply the law of reflection and describe the image formed by a plane mirror
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.18
  prerequisites:
  - kc_id: kc.phy.o.wave_properties.wave_behaviour
    strength: helpful
  misconception_ids:
  - mc.phy.o.mirror_angle_from_surface
  - mc.phy.o.mirror_image_does_not_move
  - mc.phy.o.mirror_image_on_surface
  - mc.phy.o.mirror_image_real
  - mc.phy.o.mirror_image_shrinks_with_distance
  - mc.phy.o.mirror_image_upside_down
  - mc.phy.o.mirror_move_direction_reversed
  - mc.phy.o.mirror_rays_angle_vs_reflection
  skill_ids:
  - phy-o-light
  glossary:
  - plane mirror
  - law of reflection
  - angle of incidence
  - angle of reflection
  - normal
  - incident ray
  - reflected ray
  - virtual image
  - image
  - reflection
  key_points:
  - id: kp_law_reflection
    text:
      en: The angle of incidence equals the angle of reflection, both measured from the normal.
    follow_up:
      en: How is the angle at which a ray leaves a mirror related to its angle of arrival, and from which line are they measured?
  - id: kp_image
    text:
      en: A plane mirror's image is virtual, upright, the same size, and as far behind the mirror as the object is in front.
    follow_up:
      en: Describe the nature, size and position of your image in a flat mirror.
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.phy.o.light.refraction
  code: PHY-O-03.02.K02
  node_id: cur.phy.o.waves.light
  statement: Calculate a refractive index or an angle of refraction with refractive index = sin i / sin r
  kind: procedural
  tools:
  - math_evaluate
  - phys_optics
  exam_weight: 0.24
  prerequisites:
  - kc_id: kc.phy.o.light.plane_mirrors
    strength: helpful
  - kc_id: kc.phy.o.wave_properties.wave_behaviour
    strength: helpful
  misconception_ids:
  - mc.phy.o.light_colour_changes_in_glass
  - mc.phy.o.light_index_ratio_inverted
  - mc.phy.o.light_speed_times_index
  - mc.phy.o.refraction_along_normal_bends
  - mc.phy.o.refraction_angles_from_surface
  - mc.phy.o.refraction_bends_wrong_way
  - mc.phy.o.refraction_no_bending_at_angle
  - mc.phy.o.snell_angles_not_sines
  - mc.phy.o.snell_inverse_sine_missed
  - mc.phy.o.snell_ratio_inverted
  skill_ids:
  - phy-o-light
  glossary:
  - refraction
  - refractive index
  - angle of incidence
  - angle of refraction
  - normal
  - ray
  - boundary
  - medium
  - denser
  - refract
  - sine
  key_points:
  - id: kp_n_formula
    text:
      en: Refractive index n = sin i / sin r, with both angles measured from the normal.
    follow_up:
      en: Which two angles go into the refractive index, and from which line are they measured?
  - id: kp_bending
    text:
      en: Light entering a denser material such as glass bends towards the normal, and bends away from it on leaving.
    follow_up:
      en: Which way does a ray bend, relative to the normal, when it passes from air into glass?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.light.speed_in_medium
  code: PHY-O-03.02.K03
  node_id: cur.phy.o.waves.light
  statement: Relate the refractive index of a material to the speed of light in it
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.16
  prerequisites:
  - kc_id: kc.phy.o.light.refraction
    strength: required
  misconception_ids:
  - mc.phy.o.light_colour_changes_in_glass
  - mc.phy.o.light_index_ratio_inverted
  - mc.phy.o.light_speed_same_in_material
  - mc.phy.o.light_speed_times_index
  - mc.phy.o.light_speed_units_mixed
  - mc.phy.o.refraction_angles_from_surface
  skill_ids:
  - phy-o-light
  glossary:
  - refractive index
  - speed of light
  - medium
  - vacuum
  - refraction
  - denser
  key_points:
  - id: kp_n_speeds
    text:
      en: Refractive index equals the speed of light in a vacuum divided by its speed in the material.
    follow_up:
      en: You know how fast light travels in a vacuum and in glass. How do you get glass's refractive index?
  - id: kp_slower
    text:
      en: Light is slower in any material than in a vacuum, so a larger refractive index means slower light.
    follow_up:
      en: What does a higher refractive index tell you about how fast light moves in that material?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.light.total_internal_reflection
  code: PHY-O-03.02.K04
  node_id: cur.phy.o.waves.light
  statement: Find the critical angle from the refractive index and predict when total internal reflection happens
  kind: procedural
  tools:
  - math_evaluate
  - phys_optics
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.phy.o.light.refraction
    strength: required
  misconception_ids:
  - mc.phy.o.critical_angle_same_for_all
  - mc.phy.o.critical_sine_not_inverted
  - mc.phy.o.refraction_angles_from_surface
  - mc.phy.o.refraction_bends_wrong_way
  - mc.phy.o.refraction_no_bending_at_angle
  - mc.phy.o.snell_angles_not_sines
  - mc.phy.o.snell_inverse_sine_missed
  - mc.phy.o.tir_angle_below_critical
  - mc.phy.o.tir_from_air_into_glass
  - mc.phy.o.tir_some_light_escapes
  - mc.phy.o.refraction_along_normal_bends
  skill_ids:
  - phy-o-light
  glossary:
  - total internal reflection
  - critical angle
  - refractive index
  - normal
  - boundary
  - optical fibre
  - denser
  - totally internally reflected
  - refraction
  - sine
  key_points:
  - id: kp_conditions
    text:
      en: Total internal reflection happens when light in a denser medium meets the boundary at more than the critical angle.
    follow_up:
      en: Under what two conditions does all the light stay inside a glass block?
  - id: kp_critical_angle
    text:
      en: At the critical angle the refracted ray runs along the boundary, and sin c = 1/n, so a higher n gives a smaller c.
    follow_up:
      en: What is the refracted ray doing at the critical angle, and how is c found from n?
  difficulty_prior: 0.5
  version: 0.1.1
  status: active
- id: kc.phy.o.light.converging_lens
  code: PHY-O-03.02.K05
  node_id: cur.phy.o.waves.light
  statement: Determine the position, size and nature of the image formed by a thin converging lens
  kind: procedural
  tools:
  - math_evaluate
  - phys_optics
  exam_weight: 0.22
  prerequisites:
  - kc_id: kc.phy.o.light.refraction
    strength: required
  misconception_ids:
  - mc.phy.o.lens_centre_ray_bends
  - mc.phy.o.lens_distances_subtracted
  - mc.phy.o.lens_image_same_size
  - mc.phy.o.lens_magnification_inverted
  - mc.phy.o.lens_orientation_rule_swapped
  - mc.phy.o.lens_reciprocal_not_inverted
  - mc.phy.o.lens_reciprocals_added
  - mc.phy.o.lens_size_rule_reversed
  - mc.phy.o.lens_virtual_real_swapped
  skill_ids:
  - phy-o-light
  glossary:
  - converging lens
  - focal length
  - principal focus
  - focal point
  - image
  - real image
  - virtual image
  - magnified
  - diminished
  - inverted
  - upright
  - principal axis
  - lens
  key_points:
  - id: kp_construction_rays
    text:
      en: A ray parallel to the axis refracts through the principal focus, and a ray through the lens centre goes straight on.
    follow_up:
      en: Which two construction rays can you draw from the top of an object, and what happens to each at the lens?
  - id: kp_image_nature
    text:
      en: Beyond 2F the image is real, inverted and smaller, but with the object inside F it is virtual, upright and magnified.
    follow_up:
      en: How does the image change as the object moves from far away to closer than the focal length?
  difficulty_prior: 0.5
  version: 0.1.1
  status: active
