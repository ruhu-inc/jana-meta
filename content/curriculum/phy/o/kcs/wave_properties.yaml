- id: kc.phy.o.wave_properties.describing_waves
  code: PHY-O-03.01.K01
  node_id: cur.phy.o.waves.general_properties_of_waves
  statement: Identify amplitude, wavelength, frequency and period, and calculate the period from the frequency
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.phy.o.measurement.si_prefixes
    strength: helpful
  misconception_ids:
  - mc.phy.o.amplitude_peak_to_trough
  - mc.phy.o.amplitude_wavelength_swapped
  - mc.phy.o.cycle_count_as_frequency
  - mc.phy.o.period_frequency_confused
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.wavelength_crest_to_trough
  - mc.phy.o.wavelength_whole_diagram
  - mc.phy.o.whole_time_as_period
  - mc.phy.o.repeat_multiplied
  skill_ids:
  - phy-o-wave-properties
  glossary:
  - amplitude
  - wavelength
  - frequency
  - period
  - crest
  - trough
  - hertz
  - oscillation
  - displacement
  - displacement-time graph
  - rest position
  - cycle
  key_points:
  - id: kp_amplitude_wavelength
    text:
      en: Amplitude is the greatest displacement from the rest position; wavelength is the gap between matching points on adjacent waves.
    follow_up:
      en: What do amplitude and wavelength each measure on a drawing of a wave?
  - id: kp_frequency_period
    text:
      en: 'Frequency is the number of waves per second, in hertz, and the period is the time for one wave: T = 1/f.'
    follow_up:
      en: How are the period and the frequency of a wave related?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.phy.o.wave_properties.wave_equation
  code: PHY-O-03.01.K02
  node_id: cur.phy.o.waves.general_properties_of_waves
  statement: Use wave speed = frequency × wavelength to find any one of the three
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.325
  prerequisites:
  - kc_id: kc.phy.o.wave_properties.describing_waves
    strength: required
  - kc_id: kc.phy.o.motion.average_speed
    strength: helpful
  misconception_ids:
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wave_equation_multiplied
  - mc.phy.o.wave_prefix_ignored
  - mc.phy.o.wave_speed_divided
  skill_ids:
  - phy-o-wave-properties
  glossary:
  - wave speed
  - frequency
  - wavelength
  - hertz
  - kilohertz
  - wave equation
  - crest
  - trough
  - period
  key_points:
  - id: kp_v_f_lambda
    text:
      en: Wave speed equals frequency times wavelength.
    follow_up:
      en: Which two properties of a wave do you multiply to get its speed?
  - id: kp_fixed_speed
    text:
      en: If the speed stays the same, doubling the frequency halves the wavelength.
    follow_up:
      en: A wave's speed is fixed by the medium. What happens to its wavelength when its frequency goes up?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.phy.o.wave_properties.transverse_and_longitudinal
  code: PHY-O-03.01.K03
  node_id: cur.phy.o.waves.general_properties_of_waves
  statement: Distinguish transverse from longitudinal waves and give examples of each
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.phy.o.wave_properties.describing_waves
    strength: required
  misconception_ids:
  - mc.phy.o.compression_rarefaction_as_wavelength
  - mc.phy.o.compression_rarefaction_swapped
  - mc.phy.o.compressions_counted_not_gaps
  - mc.phy.o.em_needs_medium
  - mc.phy.o.light_called_longitudinal
  - mc.phy.o.longitudinal_means_long
  - mc.phy.o.medium_stays_still
  - mc.phy.o.only_transverse_has_wavelength
  - mc.phy.o.ripples_called_longitudinal
  - mc.phy.o.sound_called_transverse
  - mc.phy.o.vibration_direction_swapped
  - mc.phy.o.wave_carries_medium
  - mc.phy.o.wavelength_whole_diagram
  skill_ids:
  - phy-o-wave-properties
  glossary:
  - transverse
  - longitudinal
  - transverse wave
  - longitudinal wave
  - compression
  - rarefaction
  - oscillation
  - vibration
  - electromagnetic wave
  - seismic wave
  - P-wave
  - S-wave
  key_points:
  - id: kp_transverse
    text:
      en: In a transverse wave the vibrations are at right angles to the direction of travel, as in light and water waves.
    follow_up:
      en: How does the direction of vibration compare with the direction of travel in a transverse wave?
  - id: kp_longitudinal
    text:
      en: In a longitudinal wave the vibrations are parallel to the direction of travel, as in sound, with compressions and rarefactions.
    follow_up:
      en: How do the particles move in a sound wave compared with the direction the wave travels?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.phy.o.wave_properties.wave_behaviour
  code: PHY-O-03.01.K04
  node_id: cur.phy.o.waves.general_properties_of_waves
  statement: Describe how waves reflect, refract and diffract, and what happens to their speed and wavelength
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.225
  prerequisites:
  - kc_id: kc.phy.o.wave_properties.wave_equation
    strength: required
  misconception_ids:
  - mc.phy.o.bends_at_normal_incidence
  - mc.phy.o.depth_speed_reversed
  - mc.phy.o.diffraction_changes_wavelength
  - mc.phy.o.diffraction_independent_of_gap
  - mc.phy.o.diffraction_wider_gap_more
  - mc.phy.o.frequency_changes_on_refraction
  - mc.phy.o.reflection_angle_doubled
  - mc.phy.o.reflection_angle_from_surface
  - mc.phy.o.reflection_changes_wavelength
  - mc.phy.o.reflection_deviation_given
  - mc.phy.o.refraction_no_direction_change
  - mc.phy.o.refraction_speed_unchanged
  - mc.phy.o.slower_bends_away_from_normal
  - mc.phy.o.wave_effects_confused
  - mc.phy.o.wave_equation_inverted
  - mc.phy.o.wavelength_inverse_to_speed
  - mc.phy.o.wavelength_unchanged_on_refraction
  - mc.phy.o.wave_equation_multiplied
  skill_ids:
  - phy-o-wave-properties
  glossary:
  - reflection
  - refraction
  - diffraction
  - reflect
  - refract
  - diffract
  - wavelength
  - wave speed
  - ripple tank
  - wavefront
  - boundary
  key_points:
  - id: kp_reflection
    text:
      en: Reflection bounces a wave back with the same speed and wavelength, and the angle of incidence equals the angle of reflection.
    follow_up:
      en: What happens to the speed and wavelength of a wave when it reflects?
  - id: kp_refraction
    text:
      en: Refraction changes a wave's speed and wavelength as it enters a new medium, while its frequency stays the same.
    follow_up:
      en: What happens to a wave's speed, wavelength and frequency when water waves enter shallower water?
  - id: kp_diffraction
    text:
      en: Waves spread as they pass a gap or an edge, most strongly when the gap is close to the wavelength.
    follow_up:
      en: What happens to a wave passing through a gap, and when is the effect strongest?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
