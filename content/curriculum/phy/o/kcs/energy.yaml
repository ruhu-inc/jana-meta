- id: kc.phy.o.energy.stores_and_transfers
  code: PHY-O-01.07.K01
  node_id: cur.phy.o.motion_forces_and_energy.energy_work_and_power
  statement: Identify energy stores and transfers and apply conservation of energy to simple systems
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.12
  prerequisites: []
  misconception_ids:
  - mc.phy.o.energy_created
  - mc.phy.o.energy_force_confused
  - mc.phy.o.energy_used_up
  - mc.phy.o.stationary_has_no_energy
  - mc.phy.o.stores_before_after_swapped
  - mc.phy.o.transfer_named_as_store
  skill_ids:
  - phy-o-energy
  glossary:
  - energy store
  - kinetic store
  - thermal store
  - chemical store
  - gravitational store
  - elastic store
  - nuclear store
  - conservation of energy
  - filament lamp
  - generator
  - kinetic energy
  - power station
  - turbine
  key_points:
  - id: kp_conserved
    text:
      en: Energy is never created or destroyed, only transferred from one store to another.
    follow_up:
      en: When a ball rolls to a stop on rough ground, where has its kinetic energy gone?
  - id: kp_wasted
    text:
      en: Energy not transferred usefully ends up spread out in the surroundings, usually as heat.
    follow_up:
      en: A motor lifts a load. Where does the input energy that is not stored in the load end up?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.phy.o.energy.kinetic_energy
  code: PHY-O-01.07.K02
  node_id: cur.phy.o.motion_forces_and_energy.energy_work_and_power
  statement: Calculate kinetic energy from mass and speed, and speed from kinetic energy
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.145
  prerequisites:
  - kc_id: kc.phy.o.energy.stores_and_transfers
    strength: required
  - kc_id: kc.phy.o.motion.average_speed
    strength: helpful
  misconception_ids:
  - mc.phy.o.ke_change_from_speed_difference
  - mc.phy.o.ke_final_not_change
  - mc.phy.o.ke_half_omitted
  - mc.phy.o.ke_kmh_not_converted
  - mc.phy.o.ke_mass_in_grams
  - mc.phy.o.ke_proportional_to_speed
  - mc.phy.o.ke_rearrange_half_wrong
  - mc.phy.o.ke_speed_not_rooted
  - mc.phy.o.ke_speed_not_squared
  - mc.phy.o.square_taken_as_double
  skill_ids:
  - phy-o-energy
  glossary:
  - kinetic energy
  - kinetic store
  - mass
  - speed
  - joule
  - velocity
  key_points:
  - id: kp_mass_speed
    text:
      en: 'Moving objects carry kinetic energy set by mass and speed, using Ek = ½mv².'
    follow_up:
      en: Which two quantities decide how much kinetic energy a moving object has?
  - id: kp_speed_squared
    text:
      en: Because the speed is squared, doubling the speed makes the kinetic energy four times greater.
    follow_up:
      en: If a car's speed doubles, what happens to its kinetic energy?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.phy.o.energy.potential_energy
  code: PHY-O-01.07.K03
  node_id: cur.phy.o.motion_forces_and_energy.energy_work_and_power
  statement: Calculate the change in gravitational potential energy when an object is raised or lowered
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.133
  prerequisites:
  - kc_id: kc.phy.o.energy.stores_and_transfers
    strength: required
  - kc_id: kc.phy.o.mass_weight.weight_from_mass
    strength: required
  misconception_ids:
  - mc.phy.o.energy_formula_inverted
  - mc.phy.o.energy_kilo_prefix_ignored
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.gpe_half_from_ke
  - mc.phy.o.gpe_height_in_cm
  - mc.phy.o.gpe_height_not_change
  - mc.phy.o.gpe_heights_added
  - mc.phy.o.gpe_weight_times_g
  skill_ids:
  - phy-o-energy
  glossary:
  - gravitational potential energy
  - potential energy
  - gravitational store
  - gravitational field strength
  - mass
  - joule
  - weight
  key_points:
  - id: kp_mgh
    text:
      en: The gain in gravitational potential energy is mass × g × height raised.
    follow_up:
      en: Which quantities do you multiply to find the energy gained when something is lifted?
  - id: kp_vertical_height
    text:
      en: Only the vertical change in height counts, not the length of the path taken to get there.
    follow_up:
      en: A box is pushed up a long slope to a height of 2 m. Which distance goes into the calculation?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.energy.energy_conversion
  code: PHY-O-01.07.K04
  node_id: cur.phy.o.motion_forces_and_energy.energy_work_and_power
  statement: Use conservation of energy to link potential and kinetic energy for falling, swinging and sliding objects
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.133
  prerequisites:
  - kc_id: kc.phy.o.energy.kinetic_energy
    strength: required
  - kc_id: kc.phy.o.energy.potential_energy
    strength: required
  misconception_ids:
  - mc.phy.o.conversion_mass_not_cancelled
  - mc.phy.o.conversion_two_dropped
  - mc.phy.o.energy_lost_added
  - mc.phy.o.energy_lost_is_one_store
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.gpe_half_from_ke
  - mc.phy.o.gpe_height_in_cm
  - mc.phy.o.gpe_height_not_change
  - mc.phy.o.ke_half_omitted
  - mc.phy.o.ke_speed_not_rooted
  - mc.phy.o.ke_speed_not_squared
  skill_ids:
  - phy-o-energy
  glossary:
  - conservation of energy
  - kinetic energy
  - potential energy
  - gravitational potential energy
  - kinetic store
  - gravitational store
  - thermal store
  - pendulum
  - friction
  - air resistance
  key_points:
  - id: kp_pe_to_ke
    text:
      en: As an object falls, its potential energy decreases while its kinetic energy increases by the same amount.
    follow_up:
      en: As a ball falls, what happens to its gravitational potential energy and to its kinetic energy?
  - id: kp_equate
    text:
      en: With no energy wasted, the loss in potential energy equals the gain in kinetic energy, so mgh = ½mv².
    follow_up:
      en: How can you find the speed at the bottom of a drop without using forces or time?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
- id: kc.phy.o.energy.work_done
  code: PHY-O-01.07.K05
  node_id: cur.phy.o.motion_forces_and_energy.energy_work_and_power
  statement: Calculate work done as force × distance moved in the direction of the force
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.133
  prerequisites:
  - kc_id: kc.phy.o.energy.stores_and_transfers
    strength: required
  - kc_id: kc.phy.o.forces.resultant_force
    strength: helpful
  misconception_ids:
  - mc.phy.o.energy_force_confused
  - mc.phy.o.energy_formula_inverted
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.energy_kilo_prefix_ignored
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.work_distance_not_along_force
  - mc.phy.o.work_done_without_movement
  - mc.phy.o.work_force_over_distance
  - mc.phy.o.work_force_times_time
  - mc.phy.o.work_total_path_used
  skill_ids:
  - phy-o-energy
  glossary:
  - work done
  - force
  - joule
  - newton
  - direction of the force
  - energy transferred
  key_points:
  - id: kp_force_distance
    text:
      en: Work done equals force multiplied by the distance moved in the direction of the force.
    follow_up:
      en: Which two quantities give the work done, and how must the distance be measured?
  - id: kp_work_is_energy
    text:
      en: Work done is energy transferred, measured in joules, so doing work on an object changes its energy.
    follow_up:
      en: What does the work done by a force tell you about energy, and what is its unit?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.energy.power
  code: PHY-O-01.07.K06
  node_id: cur.phy.o.motion_forces_and_energy.energy_work_and_power
  statement: Calculate power as the energy transferred or the work done per unit time
  kind: procedural
  tools:
  - math_evaluate
  - units_convert
  exam_weight: 0.133
  prerequisites:
  - kc_id: kc.phy.o.energy.work_done
    strength: required
  misconception_ids:
  - mc.phy.o.energy_force_confused
  - mc.phy.o.energy_formula_inverted
  - mc.phy.o.energy_formula_operation_swapped
  - mc.phy.o.energy_kilo_prefix_ignored
  - mc.phy.o.energy_mass_for_weight
  - mc.phy.o.power_energy_times_time
  - mc.phy.o.power_is_energy
  - mc.phy.o.power_minutes_not_converted
  - mc.phy.o.power_same_if_same_work
  - mc.phy.o.work_force_over_distance
  skill_ids:
  - phy-o-energy
  glossary:
  - power
  - watt
  - kilowatt
  - energy transferred
  - work done
  - joule
  key_points:
  - id: kp_rate
    text:
      en: 'Power is the rate of transferring energy: the energy transferred divided by the time taken.'
    follow_up:
