- id: kc.phy.o.radioactivity.types_of_radiation
  code: PHY-O-05.02.K01
  node_id: cur.phy.o.nuclear_physics.radioactivity
  statement: Compare alpha, beta and gamma radiation by their nature, penetration, ionising effect and deflection
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.226
  prerequisites:
  - kc_id: kc.phy.o.atom.atomic_structure
    strength: required
  misconception_ids:
  - mc.phy.o.alpha_deflected_more
  - mc.phy.o.alpha_is_helium_atom
  - mc.phy.o.background_added
  - mc.phy.o.background_ignored
  - mc.phy.o.beta_from_electron_shell
  - mc.phy.o.beta_positive
  - mc.phy.o.beta_stopped_by_paper
  - mc.phy.o.gamma_deflected
  - mc.phy.o.gamma_is_particle
  - mc.phy.o.gamma_stopped_completely
  - mc.phy.o.ionising_follows_penetration
  - mc.phy.o.penetration_order_wrong
  - mc.phy.o.radiation_natures_swapped
  skill_ids:
  - phy-o-radioactivity
  glossary:
  - alpha
  - beta
  - gamma
  - alpha particle
  - beta particle
  - gamma ray
  - gamma radiation
  - radiation
  - ionise
  - ionising
  - ionisation
  - penetrate
  - penetrating
  - penetration
  - deflection
  - deflected
  - nucleus
  - electromagnetic
  - helium nucleus
  - radioactive
  key_points:
  - id: kp_nature
    text:
      en: Alpha particles are helium nuclei, beta particles are fast electrons, and gamma rays are electromagnetic waves.
    follow_up:
      en: What is each of the three types of radiation actually made of?
  - id: kp_penetration_ionising
    text:
      en: 'The more ionising a radiation is, the less it penetrates: alpha stops in paper, beta in thin aluminium, gamma in thick lead.'
    follow_up:
      en: How is a radiation's ionising power related to how far it penetrates?
  - id: kp_deflection
    text:
      en: Alpha and beta are charged oppositely so they bend opposite ways in a field, while uncharged gamma is not deflected.
    follow_up:
      en: Why is gamma not deflected by a magnetic or electric field when alpha and beta are?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.radioactivity.decay_equations
  code: PHY-O-05.02.K02
  node_id: cur.phy.o.nuclear_physics.radioactivity
  statement: Find the new proton and nucleon numbers after alpha or beta decay
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.208
  prerequisites:
  - kc_id: kc.phy.o.radioactivity.types_of_radiation
    strength: required
  - kc_id: kc.phy.o.atom.isotopes
    strength: helpful
  misconception_ids:
  - mc.phy.o.alpha_numbers_swapped
  - mc.phy.o.alpha_removes_four_neutrons
  - mc.phy.o.beta_adds_to_nucleon_number
  - mc.phy.o.beta_changes_nothing
  - mc.phy.o.beta_changes_nucleon_number
  - mc.phy.o.beta_lowers_proton_number
  - mc.phy.o.beta_treated_as_alpha
  - mc.phy.o.decay_changes_one_number_only
  - mc.phy.o.decay_numbers_added
  - mc.phy.o.gamma_changes_numbers
  - mc.phy.o.neutrons_equal_nucleon_number
  - mc.phy.o.protons_neutrons_assumed_equal
  skill_ids:
  - phy-o-radioactivity
  glossary:
  - decay
  - alpha
  - beta
  - alpha particle
  - beta particle
  - nucleus
  - nuclei
  - proton number
  - nucleon number
  - neutron
  - proton
  - emit
  - emitting
  - nuclide
  - decay equation
  - radioactive
  - uranium
  key_points:
  - id: kp_alpha
    text:
      en: Alpha decay lowers the nucleon number by 4 and the proton number by 2.
    follow_up:
      en: By how much do the two numbers describing a nucleus change when it emits an alpha particle?
  - id: kp_beta
    text:
      en: Beta decay leaves the nucleon number unchanged and raises the proton number by 1, as a neutron becomes a proton.
    follow_up:
      en: What happens to the two numbers of a nucleus when it emits a beta particle, and what changes inside it?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.radioactivity.half_life
  code: PHY-O-05.02.K03
  node_id: cur.phy.o.nuclear_physics.radioactivity
  statement: Use half-life to find the activity left, the fraction remaining or the time taken
  kind: procedural
  tools:
  - math_solve
  - math_evaluate
  exam_weight: 0.245
  prerequisites:
  - kc_id: kc.phy.o.radioactivity.types_of_radiation
    strength: required
  misconception_ids:
  - mc.phy.o.background_halved_too
  - mc.phy.o.background_not_added_back
  - mc.phy.o.decay_not_random
  - mc.phy.o.decay_rate_changed_by_conditions
  - mc.phy.o.decay_treated_as_linear
  - mc.phy.o.decayed_for_remaining
  - mc.phy.o.half_life_half_of_time
  - mc.phy.o.half_life_halved_once
  - mc.phy.o.half_life_linear
  - mc.phy.o.half_lives_counted_wrongly
  - mc.phy.o.half_lives_equal_ratio
  skill_ids:
  - phy-o-radioactivity
  glossary:
  - half-life
  - activity
  - decay
  - count rate
  - becquerel
  - radioactive
  - nuclei
  - undecayed
  - isotope
  key_points:
  - id: kp_definition
    text:
      en: Half-life is the time for the activity of a sample, or the number of undecayed nuclei, to fall to half.
    follow_up:
      en: What exactly is halved after one half-life?
  - id: kp_repeated_halving
    text:
      en: After each half-life the amount left halves again, so count how many half-lives fit into the time.
    follow_up:
      en: How do you work out the fraction of a sample left after a given time?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
