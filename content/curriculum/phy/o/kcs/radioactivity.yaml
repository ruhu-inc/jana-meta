  - radioactive source
  - half-life
  - alpha
  - beta
  - gamma
  - tracer
  - sterilise
  - irradiate
  - radiation
  - ionising
  - penetrate
  - contamination
  key_points:
  - id: kp_radiation_choice
    text:
      en: 'The radiation chosen must suit the job: it must penetrate enough to reach the detector, but no more than needed.'
    follow_up:
      en: Why is an alpha source no use for checking the thickness of steel?
  - id: kp_half_life_choice
    text:
      en: 'The half-life must suit the use: short for a medical tracer that should vanish soon, long for a source used for years.'
    follow_up:
      en: Why does a medical tracer need a short half-life, while a thickness gauge needs a long one?
  - id: kp_safety
    text:
      en: Reduce exposure by keeping the source in a lead-lined box, handling it with tongs, keeping a distance and limiting the time.
    follow_up:
      en: What precautions cut the dose a person receives when handling a radioactive source?
