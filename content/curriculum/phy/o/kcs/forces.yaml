- id: kc.phy.o.forces.resultant_force
  code: PHY-O-01.05.K01
  node_id: cur.phy.o.motion_forces_and_energy.forces
  statement: Find the resultant of forces acting along a line and relate it to whether the motion changes
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.167
  prerequisites:
  - kc_id: kc.phy.o.measurement.resultant_vectors
    strength: required
  misconception_ids:
  - mc.phy.o.balanced_means_at_rest
  - mc.phy.o.force_of_motion_used_up
  - mc.phy.o.largest_vector_only
  - mc.phy.o.moving_needs_resultant_force
  - mc.phy.o.opposite_vectors_added
  - mc.phy.o.resultant_along_motion
  - mc.phy.o.resultant_gives_steady_speed
  - mc.phy.o.resultant_one_force_left_out
  - mc.phy.o.steady_speed_no_forces
  skill_ids:
  - phy-o-forces
  glossary:
  - resultant force
  - resultant
  - force
  - balanced
  - unbalanced
  - newton
  - acceleration
  - velocity
  - steady velocity
  - driving force
  key_points:
  - id: kp_add_subtract
    text:
      en: Forces along a line add if they point the same way and subtract if they are opposite, giving the resultant.
    follow_up:
      en: Two forces act on a box along one line in opposite directions. How do you find their combined effect?
  - id: kp_zero_or_not
    text:
      en: A zero resultant means constant velocity or rest, while a non-zero resultant changes the object's motion.
    follow_up:
      en: What does a resultant force of zero tell you about a moving object's speed and direction?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.phy.o.forces.force_mass_acceleration
  code: PHY-O-01.05.K02
  node_id: cur.phy.o.motion_forces_and_energy.forces
  statement: Use resultant force = mass × acceleration to find force, mass or acceleration
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.194
  prerequisites:
  - kc_id: kc.phy.o.forces.resultant_force
    strength: required
  - kc_id: kc.phy.o.motion.acceleration_from_change
    strength: helpful
  misconception_ids:
  - mc.phy.o.fma_applied_force_not_resultant
  - mc.phy.o.fma_grams_not_converted
  - mc.phy.o.fma_mixed_with_weight
  - mc.phy.o.fma_multiplied_not_divided
  - mc.phy.o.fma_ratio_inverted
  - mc.phy.o.opposite_vectors_added
  - mc.phy.o.rearrange_sign_error
  skill_ids:
  - phy-o-forces
  glossary:
  - resultant force
  - resultant
  - force
  - mass
  - acceleration
  - newton
  - accelerate
  - velocity
  - steady velocity
  key_points:
  - id: kp_resultant_used
    text:
      en: The force in F = ma is the resultant force, in N, with mass in kg and acceleration in m/s².
    follow_up:
      en: A 10 N push meets 4 N of friction. Which force do you use to find the acceleration?
  - id: kp_mass_inverse
    text:
      en: For the same resultant force, a larger mass gives a smaller acceleration.
    follow_up:
      en: What happens to the acceleration if you push a heavier trolley with the same resultant force?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.phy.o.forces.friction_and_terminal_velocity
  code: PHY-O-01.05.K03
  node_id: cur.phy.o.motion_forces_and_energy.forces
  statement: Explain how friction and air resistance change motion, including how a falling object reaches terminal velocity
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.139
  prerequisites:
  - kc_id: kc.phy.o.forces.force_mass_acceleration
    strength: required
  - kc_id: kc.phy.o.mass_weight.weight_from_mass
    strength: helpful
  misconception_ids:
  - mc.phy.o.drag_alone_as_resultant
  - mc.phy.o.drag_independent_of_speed
  - mc.phy.o.falling_drag_ignored
  - mc.phy.o.fma_applied_force_not_resultant
  - mc.phy.o.friction_always_unwanted
  - mc.phy.o.mass_in_kg_used_as_force
  - mc.phy.o.moving_needs_resultant_force
  - mc.phy.o.parachute_sends_upwards
  - mc.phy.o.terminal_velocity_fixed
  - mc.phy.o.terminal_velocity_no_forces
  - mc.phy.o.force_of_motion_used_up
  - mc.phy.o.opposite_vectors_added
  - mc.phy.o.resultant_along_motion
  - mc.phy.o.steady_speed_no_forces
  skill_ids:
  - phy-o-forces
  glossary:
  - friction
  - air resistance
  - drag
  - terminal velocity
  - resultant force
  - weight
  - accelerate
  - acceleration
  - decelerate
  - deceleration
  - resultant
  key_points:
  - id: kp_drag_opposes
    text:
      en: Friction and air resistance act against the motion, and air resistance gets bigger as speed increases.
    follow_up:
      en: Which way do drag forces act, and how do they change as an object speeds up?
  - id: kp_terminal
    text:
      en: At terminal velocity air resistance equals the weight, so the resultant force is zero and the speed stays constant.
    follow_up:
      en: Once a skydiver is at terminal velocity, how do the forces on her compare and what is her speed doing?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.forces.springs
  code: PHY-O-01.05.K04
  node_id: cur.phy.o.motion_forces_and_energy.forces
  statement: Use force = spring constant × extension for a spring within its limit of proportionality
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.139
  prerequisites:
  - kc_id: kc.phy.o.mass_weight.weight_from_mass
    strength: helpful
  misconception_ids:
  - mc.phy.o.mass_in_kg_used_as_force
  - mc.phy.o.spring_cm_not_converted
  - mc.phy.o.spring_extension_given_as_length
  - mc.phy.o.spring_length_for_extension
  - mc.phy.o.spring_proportional_beyond_limit
  - mc.phy.o.spring_ratio_inverted
  - mc.phy.o.fma_multiplied_not_divided
  skill_ids:
  - phy-o-forces
  glossary:
  - spring constant
  - extension
  - limit of proportionality
  - force
  - spring
  - elastic
  - Hooke's law
  - newton
  key_points:
  - id: kp_proportional
    text:
      en: Extension is proportional to the force applied, F = kx, as long as the spring is within its limit of proportionality.
    follow_up:
      en: How does the extension change if you double the load on a spring that is within its limit?
  - id: kp_spring_constant
    text:
      en: The spring constant k is the force needed per metre of extension, in N/m, so a stiffer spring has a larger k.
    follow_up:
      en: What does a spring constant of 50 N/m tell you about the force needed to stretch the spring?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.forces.circular_motion
  code: PHY-O-01.05.K05
  node_id: cur.phy.o.motion_forces_and_energy.forces
  statement: Explain why motion in a circle at constant speed needs a resultant force towards the centre
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.083
  prerequisites:
  - kc_id: kc.phy.o.forces.force_mass_acceleration
    strength: required
  - kc_id: kc.phy.o.measurement.scalars_and_vectors
    strength: helpful
  misconception_ids:
  - mc.phy.o.centripetal_trend_reversed
  - mc.phy.o.circular_force_outwards
  - mc.phy.o.circular_no_force_needed
  - mc.phy.o.orbit_radius_not_circumference
  - mc.phy.o.orbit_total_time_as_period
  - mc.phy.o.released_flies_outwards
  - mc.phy.o.resultant_along_motion
  - mc.phy.o.time_over_distance
  skill_ids:
  - phy-o-forces
  glossary:
  - circular motion
  - centripetal force
  - resultant force
  - orbit
  - velocity
  - constant speed
  - acceleration
  key_points:
  - id: kp_velocity_changes
    text:
      en: In circular motion the direction keeps changing, so the velocity changes and the object is accelerating even at constant speed.
    follow_up:
      en: A satellite orbits at steady speed. Why is it still accelerating?
  - id: kp_towards_centre
    text:
      en: The resultant force on an object moving in a circle points towards the centre, at right angles to its velocity.
    follow_up:
      en: Where does the resultant force point for an object moving round a circle?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.phy.o.forces.moments
  code: PHY-O-01.05.K06
  node_id: cur.phy.o.motion_forces_and_energy.forces
  statement: Calculate the moment of a force and apply the principle of moments to an object in balance
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.181
  prerequisites:
  - kc_id: kc.phy.o.forces.resultant_force
    strength: helpful
  misconception_ids:
  - mc.phy.o.balance_equal_distances
  - mc.phy.o.balance_equal_forces
  - mc.phy.o.mass_in_kg_used_as_force
  - mc.phy.o.moment_cm_not_converted
  - mc.phy.o.moment_distance_from_end
  - mc.phy.o.moment_force_over_distance
  - mc.phy.o.moment_left_as_answer
  - mc.phy.o.moment_one_force_left_out
  - mc.phy.o.moment_ratio_inverted
  skill_ids:
  - phy-o-forces
  glossary:
  - moment
  - principle of moments
  - pivot
  - perpendicular distance
  - clockwise
  - anticlockwise
  - balance
  - newton metre
  - force
  - lever
  key_points:
  - id: kp_moment
    text:
      en: The moment of a force is the force multiplied by the perpendicular distance from the pivot to the line of action.
    follow_up:
      en: What is the distance in a moment measured between?
  - id: kp_balance
    text:
      en: For a balanced object, the total clockwise moment equals the total anticlockwise moment about the pivot.
    follow_up:
      en: What must be true of the moments on a see-saw that is balanced?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.phy.o.forces.centre_of_gravity
  code: PHY-O-01.05.K07
  node_id: cur.phy.o.motion_forces_and_energy.forces
  statement: Relate the stability of an object to the height of its centre of gravity and the width of its base
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.097
  prerequisites:
  - kc_id: kc.phy.o.forces.moments
    strength: required
  misconception_ids:
  - mc.phy.o.base_width_irrelevant
  - mc.phy.o.cog_always_at_middle
  - mc.phy.o.cog_inside_material
  - mc.phy.o.stability_from_weight_only
  - mc.phy.o.tipping_full_base_width
  - mc.phy.o.tipping_object_height_used
  - mc.phy.o.tipping_ratio_inverted
  - mc.phy.o.topples_whenever_tilted
  skill_ids:
  - phy-o-forces
  glossary:
  - centre of gravity
  - stability
  - stable
  - unstable
  - pivot
  - moment
  key_points:
  - id: kp_low_wide
    text:
      en: An object is more stable when its centre of gravity is low and its base is wide.
    follow_up:
      en: How would you redesign a tall, narrow object to make it harder to topple?
  - id: kp_topple
    text:
      en: An object topples when the vertical line down from its centre of gravity falls outside its base.
    follow_up:
      en: As an object is tilted, at what point does it begin to topple over?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
