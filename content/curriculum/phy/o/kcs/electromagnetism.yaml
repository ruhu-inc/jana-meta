- id: kc.phy.o.electromagnetism.motor_effect
  code: PHY-O-04.05.K02
  node_id: cur.phy.o.electricity_and_magnetism.electromagnetic_effects
  statement: Predict the direction of the force on a current-carrying wire in a magnetic field and explain a d.c. motor
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.196
  prerequisites:
  - kc_id: kc.phy.o.electromagnetism.fields_of_currents
    strength: required
  misconception_ids:
  - mc.phy.o.commutator_role_confused
  - mc.phy.o.field_lines_s_to_n
  - mc.phy.o.fleming_right_hand_used
  - mc.phy.o.force_along_current
  - mc.phy.o.force_along_field
  - mc.phy.o.motor_factor_reversed
  - mc.phy.o.nonmagnetic_materials_attracted
  - mc.phy.o.parallel_wire_feels_force
  - mc.phy.o.reversing_both_reverses_force
  skill_ids:
  - phy-o-electromagnetism
  glossary:
  - motor effect
  - magnetic field
  - current
  - current-carrying
  - d.c. motor
  - commutator
  - coil
  - split-ring commutator
  - brushes
  - Fleming's left-hand rule
  - magnet
  - magnetic
  - armature
  key_points:
  - id: kp_force_perpendicular
    text:
      en: The force on the wire is at right angles to both the field and the current, and reversing either one reverses the force.
    follow_up:
      en: How could you make the force on a wire in a magnetic field point the opposite way?
  - id: kp_coil_turns
    text:
      en: The two sides of a motor coil carry current in opposite directions, so they are pushed opposite ways and the coil turns.
    follow_up:
      en: Why does the coil of a motor rotate instead of just moving sideways?
  - id: kp_commutator
    text:
      en: The split-ring commutator reverses the current every half turn so the coil keeps turning the same way.
    follow_up:
      en: What would happen to the coil if its current never reversed as it passed the vertical position?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
