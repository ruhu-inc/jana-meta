  - magnetic field line
  - right-hand grip rule
  key_points:
  - id: kp_field_shapes
    text:
      en: A straight wire has circular field lines around it, and a solenoid has a field like a bar magnet's.
    follow_up:
      en: What pattern would iron filings make around a straight current-carrying wire, and around a solenoid?
  - id: kp_stronger_magnet
    text:
      en: An electromagnet is made stronger by more current, more turns of wire, or a soft iron core.
    follow_up:
      en: Name the changes you could make to an electromagnet to increase its pull.
