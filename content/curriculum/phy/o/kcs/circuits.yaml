  - mc.phy.o.parallel_branch_current_added
  - mc.phy.o.parallel_current_same_each_branch
  - mc.phy.o.parallel_current_split_equally
  - mc.phy.o.parallel_more_current_higher_resistance
  - mc.phy.o.parallel_one_branch_only
  - mc.phy.o.parallel_pd_shared_out
  - mc.phy.o.parallel_reciprocal_not_inverted
  - mc.phy.o.parallel_resistance_averaged
  - mc.phy.o.parallel_resistances_added
  skill_ids:
