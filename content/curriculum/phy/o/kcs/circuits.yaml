- id: kc.phy.o.circuits.series_circuits
  code: PHY-O-04.03.K01
  node_id: cur.phy.o.electricity_and_magnetism.electric_circuits
  statement: Find the current, the potential differences and the total resistance in a series circuit
  kind: procedural
