  - phys_circuit
  exam_weight: 0.24
  prerequisites:
  - kc_id: kc.phy.o.electrical_quantities.resistance
    strength: required
  misconception_ids:
  - mc.phy.o.circuit_current_r_over_v
  - mc.phy.o.series_current_from_one_resistor
  - mc.phy.o.series_current_used_up
  - mc.phy.o.series_pd_added_to_supply
  - mc.phy.o.series_pd_inverse_to_resistance
  - mc.phy.o.series_pd_same_everywhere
  - mc.phy.o.series_pd_shared_equally
