  - mc.phy.o.ldr_resistance_rises_with_light
  - mc.phy.o.series_pd_inverse_to_resistance
  - mc.phy.o.series_pd_shared_equally
  - mc.phy.o.thermistor_resistance_rises_with_heat
  skill_ids:
  - phy-o-circuits
  glossary:
  - potential divider
  - resistor
  - resistance
  - thermistor
  - light-dependent resistor
  - potential difference
  - output voltage
  - input voltage
  - variable resistor
  - voltage
  - circuit
  key_points:
  - id: kp_share_voltage
    text:
      en: In a potential divider the supply voltage is shared between the two resistors in proportion to their resistances.
    follow_up:
      en: Of two resistors in series, which one gets the bigger share of the supply voltage?
  - id: kp_sensor_share
    text:
