- id: kc.phy.o.circuits.potential_dividers
  code: PHY-O-04.03.K04
  node_id: cur.phy.o.electricity_and_magnetism.electric_circuits
  statement: Calculate the output of a potential divider and predict the effect of a thermistor or a light-dependent resistor
  kind: procedural
  tools:
  - math_evaluate
  - phys_circuit
  exam_weight: 0.18
  prerequisites:
  - kc_id: kc.phy.o.circuits.series_circuits
    strength: required
  misconception_ids:
  - mc.phy.o.divider_output_fixed_by_supply
  - mc.phy.o.divider_ratio_of_resistors
