  - series circuit
  - resistor
  - resistance
  - current
  - potential difference
  - component
  - cell
  - ammeter
  - voltmeter
  - voltage
  - total resistance
  key_points:
  - id: kp_same_current
    text:
      en: The current is the same at every point in a series circuit.
    follow_up:
      en: Would an ammeter read a different current anywhere in a series circuit? Why?
  - id: kp_pd_shared
    text:
      en: 'The supply p.d. is shared between the components: their p.d.s add up to the supply p.d.'
    follow_up:
      en: How are the p.d.s across the separate components related to the battery's p.d.?
