  - resistance
  - current
  - potential difference
  - branch
  - junction
  - combined resistance
  - component
  - voltage
  - heating element
  - series
  key_points:
  - id: kp_full_pd
    text:
      en: Each parallel branch has the full supply p.d. across it.
    follow_up:
      en: What p.d. is across each branch when they are connected in parallel to the battery?
  - id: kp_currents_add
    text:
      en: The branch currents add up to the current from the supply.
    follow_up:
      en: How does the current leaving the battery compare with the currents in the branches?
  - id: kp_resistance_falls
    text:
      en: Adding another branch lowers the total resistance, so more current flows.
    follow_up:
      en: What happens to the total resistance when you connect one more resistor in parallel, and why?
