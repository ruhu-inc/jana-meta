- id: kc.phy.o.projectiles.resolve
  code: PHY-O-01.09.K01
  node_id: cur.phy.o.motion_forces_and_energy.projectiles
  statement: Find the horizontal component and the vertical component of a launch velocity
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.05
  prerequisites:
  - kc_id: kc.phy.o.measurement.scalars_and_vectors
    strength: required
  - kc_id: kc.phy.o.motion.distance_or_displacement
    strength: helpful
  misconception_ids:
  - mc.phy.o.components_swapped
  skill_ids:
  - phy-o-projectiles
  glossary:
  - projectile
  - component
  - components
  - horizontal
  - vertical
  - launch velocity
  - launch angle
  - resolve
  - velocity
  key_points:
  - id: kp_components
    text:
      en: A launch velocity splits into a horizontal part, v cos θ, and a vertical part, v sin θ, with θ above the horizontal.
    follow_up:
      en: Which trigonometric functions of the launch angle give the horizontal and the vertical parts?
  - id: kp_triangle
    text:
      en: The two components and the launch velocity form a right-angled triangle, with the launch velocity as the hypotenuse.
    follow_up:
      en: Where does the original velocity sit in the triangle that contains its two components?
  difficulty_prior: 0.2
  version: 0.1.0
  status: active
- id: kc.phy.o.projectiles.components_change
  code: PHY-O-01.09.K02
  node_id: cur.phy.o.motion_forces_and_energy.projectiles
  statement: Explain why the horizontal velocity of a projectile stays constant while gravity changes its vertical velocity
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.04
  prerequisites:
  - kc_id: kc.phy.o.projectiles.resolve
    strength: required
  - kc_id: kc.phy.o.motion.free_fall
    strength: required
  - kc_id: kc.phy.o.motion.acceleration_from_change
    strength: helpful
  misconception_ids:
  - mc.phy.o.horizontal_velocity_slows
  skill_ids:
  - phy-o-projectiles
  glossary:
  - projectile
  - horizontal
  - vertical
  - velocity
  - gravity
  - constant
  - air resistance
  - acceleration
  key_points:
  - id: kp_horizontal_constant
    text:
      en: With no horizontal force acting, the horizontal velocity of a projectile stays constant.
    follow_up:
      en: What force acts sideways on a projectile, and what does that mean for its horizontal speed?
  - id: kp_vertical_changes
    text:
      en: Gravity acts downwards, so the vertical velocity changes by about 10 m/s every second.
    follow_up:
      en: How does the vertical velocity of a ball change each second as it flies?
  difficulty_prior: 0.3
  version: 0.1.0
  status: active
- id: kc.phy.o.projectiles.trajectory_graphs
  code: PHY-O-01.09.K03
  node_id: cur.phy.o.motion_forces_and_energy.projectiles
  statement: Sketch the trajectory of a projectile and the displacement-time and velocity-time graphs for each component
  kind: conceptual
  tools:
  - math_evaluate
  exam_weight: 0.04
  prerequisites:
  - kc_id: kc.phy.o.projectiles.components_change
    strength: required
  - kc_id: kc.phy.o.motion.distance_time_gradient
    strength: helpful
  - kc_id: kc.phy.o.motion.velocity_time_gradient
    strength: helpful
  misconception_ids:
  - mc.phy.o.horizontal_velocity_slows
  skill_ids:
  - phy-o-projectiles
  glossary:
  - projectile
  - trajectory
  - parabola
  - displacement-time graph
  - velocity-time graph
  - component
  - horizontal
  - vertical
  - displacement
  - velocity
  key_points:
  - id: kp_parabola
    text:
      en: The path curves because the horizontal motion is steady while the vertical motion is accelerated.
    follow_up:
      en: What combination of motions gives a projectile its curved path?
  - id: kp_vt_graphs
    text:
      en: The horizontal velocity-time graph is flat, while the vertical one is a sloping straight line with gradient -g.
    follow_up:
      en: What shape do the velocity-time graphs take for the horizontal and the vertical components?
  difficulty_prior: 0.4
  version: 0.1.0
  status: active
- id: kc.phy.o.projectiles.time_of_flight
  code: PHY-O-01.09.K04
  node_id: cur.phy.o.motion_forces_and_energy.projectiles
  statement: Find the time of flight of a projectile from the vertical motion
  kind: procedural
  tools:
  - math_evaluate
  - phys_projectile
  exam_weight: 0.05
  prerequisites:
  - kc_id: kc.phy.o.projectiles.resolve
    strength: required
  - kc_id: kc.phy.o.motion.free_fall
    strength: required
  misconception_ids:
  - mc.phy.o.flight_time_is_time_to_top
  skill_ids:
  - phy-o-projectiles
  glossary:
  - projectile
  - time of flight
  - vertical component
  - vertical
  - launch
  - gravity
  key_points:
  - id: kp_vertical_only
    text:
      en: The time of flight depends only on the vertical motion, as the horizontal motion does not affect how long it stays up.
    follow_up:
      en: Which component of the motion decides how long a projectile stays in the air?
  - id: kp_symmetric
    text:
      en: From level ground the climb and the fall take equal times, so the total is twice the time to reach the top.
    follow_up:
      en: How does the time to rise to the top compare with the time to fall back to the launch height?
  difficulty_prior: 0.5
  version: 0.1.0
  status: active
- id: kc.phy.o.projectiles.max_height
  code: PHY-O-01.09.K05
  node_id: cur.phy.o.motion_forces_and_energy.projectiles
  statement: Find the maximum height a projectile reaches and the time it takes to get there
  kind: procedural
  tools:
  - math_evaluate
  - phys_projectile
  exam_weight: 0.05
  prerequisites:
  - kc_id: kc.phy.o.projectiles.resolve
    strength: required
  - kc_id: kc.phy.o.motion.free_fall
    strength: required
  misconception_ids:
  - mc.phy.o.range_taken_as_height
  skill_ids:
  - phy-o-projectiles
  glossary:
  - projectile
  - maximum height
  - vertical component
  - vertical
  - gravity
  key_points:
  - id: kp_zero_at_top
    text:
      en: At the highest point the vertical velocity is zero, so v = 0 is used in the vertical equations.
    follow_up:
      en: What is the vertical velocity of a projectile at the top of its flight?
  - id: kp_vertical_inputs
    text:
      en: The maximum height and time to the top come from the vertical component of the launch velocity and g only.
    follow_up:
      en: Which part of the launch velocity goes into the equation for the maximum height?
  difficulty_prior: 0.5
  version: 0.1.0
  status: active
- id: kc.phy.o.projectiles.range
  code: PHY-O-01.09.K06
  node_id: cur.phy.o.motion_forces_and_energy.projectiles
  statement: Calculate the range of a projectile launched from level ground and relate it to the launch angle
  kind: procedural
  tools:
  - math_evaluate
  - phys_projectile
  exam_weight: 0.06
  prerequisites:
  - kc_id: kc.phy.o.projectiles.time_of_flight
    strength: required
  - kc_id: kc.phy.o.projectiles.resolve
    strength: required
  - kc_id: kc.phy.o.projectiles.components_change
    strength: helpful
  confusable_with:
  - kc.phy.o.projectiles.max_height
  misconception_ids:
  - mc.phy.o.horizontal_velocity_slows
  - mc.phy.o.range_taken_as_height
  - mc.phy.o.steeper_launch_goes_further
  skill_ids:
  - phy-o-projectiles
  glossary:
  - projectile
  - range
  - launch angle
  - time of flight
  - level ground
  - horizontal
  - velocity
  key_points:
  - id: kp_horizontal_times_time
    text:
      en: The range is the horizontal velocity multiplied by the time of flight.
    follow_up:
      en: Which two quantities give how far along the ground a projectile lands?
  - id: kp_45
    text:
      en: On level ground the range is greatest at a launch angle of 45°, and falls for steeper or flatter angles.
    follow_up:
      en: Which launch angle gives the longest range on level ground, and what happens either side of it?
  difficulty_prior: 0.7
  version: 0.1.0
  status: active
