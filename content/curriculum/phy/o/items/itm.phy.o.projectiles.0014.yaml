id: itm.phy.o.projectiles.0014
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.projectiles.max_height
stem: A ball is thrown upward at an angle from level ground. Ignore air resistance.
parts:
- id: a
  prompt: Which part of its launch velocity decides how high the ball goes?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: The vertical component
      correct: true
    - id: B
      text: The horizontal component
      correct: false
      feedback: The horizontal motion carries the ball along. It has no effect on the height.
    - id: C
      text: The two components equally
      correct: false
      feedback: Only the vertical velocity falls to zero at the top, so only it sets the height.
    - id: D
      text: 'Neither: only the mass of the ball'
      correct: false
      feedback: With no air resistance the mass does not change the motion.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The ball stops rising at the highest point of its path.
  - rung: 2
    name: concept
    text:
      en: At the top, the vertical velocity has fallen to zero.
  - rung: 3
    name: first_step
    text:
      en: Ask which velocity gravity is reducing on the way up.
  - rung: 4
    name: worked_step
    text:
      en: Gravity reduces the vertical velocity only, so the height depends on where it started.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: the vertical component.'
solution:
  steps:
  - n: 1
    latex: 0 = u_y^2 - 2 g h
    reason: At the top the vertical velocity is zero
  - n: 2
    latex: h = \frac{u_y^2}{2g}
    reason: The height depends on the vertical component only
