id: itm.phy.o.projectiles.0011
version: 0.1.0
type: mcq
subject: phy
level: o
kc_ids:
- kc.phy.o.projectiles.resolve
stem: A projectile is launched at speed u at an angle θ above the horizontal.
parts:
- id: a
  prompt: Which expression gives the horizontal component of its launch velocity?
  marks: 1
  answer:
    kind: mcq
    diagnostic: false
    shuffle: false
    options:
    - id: A
      text: u sin θ
      correct: false
      misconception_id: mc.phy.o.components_swapped
      feedback: That is the vertical component. The side next to the angle is the horizontal one.
    - id: B
      text: u cos θ
      correct: true
    - id: C
      text: u tan θ
      correct: false
      feedback: Tangent compares the two components. It does not give either of them.
    - id: D
      text: u
      correct: false
      feedback: u is the whole speed along the launch direction, not its share along the ground.
  show_working: false
  hints:
  - rung: 1
    name: orient
    text:
      en: The launch velocity splits into a horizontal part and a vertical part.
  - rung: 2
    name: concept
    text:
      en: The velocity is the hypotenuse of a right-angled triangle, with θ measured from the horizontal.
  - rung: 3
    name: first_step
    text:
      en: Find the side of the triangle next to θ.
  - rung: 4
    name: worked_step
    text:
      en: The adjacent side uses cosine.
  - rung: 5
    name: full_step
    text:
      en: 'The answer is: u cos θ.'
  misconception_ids:
  - mc.phy.o.components_swapped
solution:
  steps:
  - n: 1
    latex: v_x = u \cos\theta
    reason: The horizontal side is adjacent to the angle above the horizontal
