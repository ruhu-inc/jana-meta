id: itm.phy.o.projectiles.0004
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.projectiles.max_height
stem: A ball leaves the ground at 20 m/s at 60° above the horizontal. Take g = 10 m/s^2 and ignore air resistance.
parts:
- id: a
  prompt: Find the maximum height the ball reaches.
  marks: 3
  answer:
    kind: numeric
    value: '15'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_proj_0004_hgt
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: At the top of the flight the ball stops going up for an instant.
  - rung: 2
    name: concept
    text:
      en: Only the vertical component matters for the height. At the top the vertical velocity is zero.
  - rung: 3
    name: first_step
    text:
      en: Find u_y = 20 sin 60° first.
  - rung: 4
    name: worked_step
    text:
      en: u_y = 17.3 m/s. Use v² = u² − 2gh with v = 0, so h = u_y² ÷ (2g).
  - rung: 5
    name: full_step
    text:
      en: h = 300 ÷ (2 × 10) = 15 m.
  misconception_ids:
  - mc.phy.o.range_taken_as_height
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: u_y = u \sin\theta
    reason: The vertical component of the launch velocity
  - n: 2
    latex: u_y = 20 \sin 60^\circ = 17.3\ \text{m/s}
    reason: Substitute
    check_id: chk_build_phy_proj_0004_uy
  - n: 3
    latex: 0 = u_y^2 - 2gh
    reason: At the top the vertical velocity is zero
  - n: 4
    latex: h = \frac{u_y^2}{2g} = \frac{300}{20}
    reason: Rearrange and substitute
    check_id: chk_build_phy_proj_0004_uy2
  - n: 5
    latex: h = 15\ \text{m}
    reason: Evaluate
    check_id: chk_build_phy_proj_0004_sim
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 150
exam_style:
  paper_style: structured
  total_marks: 3
  calculator: true
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-fable-5-1
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_phy_proj_0004_uy:
    args:
      expression: 20*sin(60)
      sf: 3
      angle_unit: degrees
    tool: math_evaluate
  chk_build_phy_proj_0004_uy2:
    args:
      expression: (20*sin(60))^2
      sf: 3
      angle_unit: degrees
    tool: math_evaluate
  chk_build_phy_proj_0004_hgt:
    args:
      expression: (20*sin(60))^2/(2*10)
      sf: 2
      angle_unit: degrees
    tool: math_evaluate
  chk_build_phy_proj_0004_sim:
    args:
      motion: angled
      speed: 20
      angle: 60
      constants:
      - symbol: g
        source: pack
    tool: phys_projectile
