id: itm.phy.o.projectiles.0010
version: 0.1.0
type: numeric
subject: phy
level: o
kc_ids:
- kc.phy.o.projectiles.max_height
stem: A ball is thrown from the ground at 20 m/s at 45° above the horizontal. Take g = 10 m/s^2 and ignore air resistance.
parts:
- id: a
  prompt: How long does the ball take to reach its highest point?
  marks: 2
  answer:
    kind: numeric
    value: '1.41'
    unit: s
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_proj_0010_t
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: At the highest point the ball is not moving up or down for an instant.
  - rung: 2
    name: concept
    text:
      en: The vertical velocity falls from u_y to zero at a rate of g.
  - rung: 3
    name: first_step
    text:
      en: First find u_y = 20 sin 45°.
  - rung: 4
    name: worked_step
    text:
      en: u_y = 14.1 m/s. Divide it by g to get the time to the top.
  - rung: 5
    name: full_step
    text:
      en: t = 14.1 ÷ 10 = 1.41 s.
- id: b
  prompt: What is the maximum height it reaches?
  marks: 2
  answer:
    kind: numeric
    value: '10'
    unit: m
    unit_policy: equivalent
    tolerance:
      mode: relative
      value: 0.005
    check_id: chk_build_phy_proj_0010_hgt
  show_working: true
  hints:
  - rung: 1
    name: orient
    text:
      en: The height comes from the vertical motion alone.
  - rung: 2
    name: concept
    text:
      en: Use v² = u² − 2gh with v = 0 at the top.
  - rung: 3
    name: first_step
    text:
      en: Square the vertical component u_y.
  - rung: 4
    name: worked_step
    text:
      en: u_y² = 200, so divide by 2g.
  - rung: 5
    name: full_step
    text:
      en: h = 200 ÷ 20 = 10 m.
  misconception_ids:
  - mc.phy.o.range_taken_as_height
conventions_override:
- key: phy.g
  value: '10'
solution:
  steps:
  - n: 1
    latex: u_y = u \sin\theta
    reason: The vertical component of the launch velocity
  - n: 2
    latex: u_y = 20 \sin 45^\circ = 14.1\ \text{m/s}
    reason: Substitute
    check_id: chk_build_phy_proj_0010_uy
  - n: 3
    latex: t = \frac{u_y}{g} = \frac{14.1}{10} = 1.41\ \text{s}
    reason: The vertical velocity reaches zero at the top
    check_id: chk_build_phy_proj_0010_t
  - n: 4
    latex: h = \frac{u_y^2}{2g} = \frac{200}{20}
    reason: From v² = u² − 2gh with v = 0
    check_id: chk_build_phy_proj_0010_uy2
  - n: 5
    latex: h = 10\ \text{m}
    reason: Evaluate
    check_id: chk_build_phy_proj_0010_sim
difficulty:
  prior: 0.4
  band: core
estimated_seconds: 150
exam_style:
  paper_style: structured
  total_marks: 4
  calculator: true
context_tags:
- none
provenance:
  origin: original
  licence: LicenseRef-Own
  drafted_with_ai: true
  ai_model: claude-fable-5-1
  sources: []
review:
  status: published
  reviewers: []
checks:
  chk_build_phy_proj_0010_uy:
    args:
      expression: 20*sin(45)
      sf: 3
      angle_unit: degrees
    tool: math_evaluate
  chk_build_phy_proj_0010_t:
    args:
      expression: 20*sin(45)/10
      sf: 3
      angle_unit: degrees
    tool: math_evaluate
  chk_build_phy_proj_0010_uy2:
    args:
      expression: (20*sin(45))^2
      sf: 3
      angle_unit: degrees
    tool: math_evaluate
  chk_build_phy_proj_0010_hgt:
    args:
      expression: (20*sin(45))^2/(2*10)
      sf: 2
      angle_unit: degrees
    tool: math_evaluate
  chk_build_phy_proj_0010_sim:
    args:
      motion: angled
      speed: 20
      angle: 45
      constants:
      - symbol: g
        source: pack
    tool: phys_projectile
