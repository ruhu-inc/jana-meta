problem: A ball is kicked from level ground at 20 m/s at 30° above the horizontal. Take g = 10 m/s^2 and ignore air resistance. How far away does it land?
steps:
- n: 1
  latex: u_x = 20 \cos 30^\circ = 17.3\ \text{m/s}
  reason: The horizontal component, which stays constant
  check_id: chk_build_phy_proj_w0001_ux
- n: 2
  latex: u_y = 20 \sin 30^\circ = 10\ \text{m/s}
  reason: The vertical component, which gravity changes
  check_id: chk_build_phy_proj_w0001_uy
- n: 3
  latex: T = \frac{2 u_y}{g} = \frac{2 \times 10}{10} = 2.0\ \text{s}
  reason: Up takes u_y ÷ g; down takes the same again
  check_id: chk_build_phy_proj_w0001_sim
- n: 4
  latex: R = u_x T = 17.3 \times 2.0 = 34.6\ \text{m}
  reason: Range is horizontal velocity times time of flight
  check_id: chk_build_phy_proj_w0001_rng
final_answer:
  latex: 34.6\ \text{m}
  check_id: chk_build_phy_proj_w0001_rng
fading_order:
- 4
- 3
- 2
- 1
