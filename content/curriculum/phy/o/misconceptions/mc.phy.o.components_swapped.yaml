  text:
    en: Draw the launch velocity as the slanted side of a right-angled triangle. The side next to the angle is the horizontal part, u cos θ; the side opposite the angle is the vertical part, u sin θ. A ball kicked at a small angle goes mostly sideways, so its horizontal part must be the bigger one.
