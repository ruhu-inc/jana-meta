- id: kc.acc.o.irrecoverable_debts.write_off
  code: ACC-O-10.K01
  node_id: cur.acc.o.irrecoverable_debts
  statement: Record the write-off of an irrecoverable debt and the recovery of one
  kind: procedural
  tools:
  - acc_double_entry
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.double_entry.record_credit_transactions
    strength: required
  misconception_ids:
  - mc.acc.o.id_recovery_as_sale
  - mc.acc.o.id_recovery_skips_reinstatement
  - mc.acc.o.id_writeoff_as_sales_return
  - mc.acc.o.id_writeoff_to_allowance
  - mc.acc.o.de_debit_credit_swapped
  skill_ids:
  - acc-o-irrecoverable-debts
  glossary:
  - irrecoverable debt
  - irrecoverable
  - allowance for irrecoverable debts
  - allowance
  - trade receivables
  - trade receivable
  - net trade receivables
  - write-off
  - written off
  - debt recovered
  - statement of financial position
  - income statement
  - debtor
  key_points:
  - id: kp_write_off_entry
    text:
      en: Writing off a debt debits irrecoverable debts expense and credits the customer's account, as the money will not be received.
    follow_up:
      en: Which account is credited so the customer no longer owes the amount?
  - id: kp_recovery
    text:
      en: A debt recovered after being written off is first reinstated, then the cash is entered as received from that customer.
    follow_up:
      en: What must be done in the customer's account before the money is recorded?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.acc.o.irrecoverable_debts.allowance_amount
  code: ACC-O-10.K02
  node_id: cur.acc.o.irrecoverable_debts
  statement: Calculate the allowance for irrecoverable debts as a percentage of receivables
  kind: procedural
  tools:
  - acc_statements
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.irrecoverable_debts.write_off
    strength: helpful
  misconception_ids:
  - mc.acc.o.id_allowance_before_writeoff
  - mc.acc.o.id_change_as_allowance
  - mc.acc.o.id_net_as_allowance
  skill_ids:
  - acc-o-irrecoverable-debts
  glossary:
  - irrecoverable debt
  - irrecoverable
  - allowance for irrecoverable debts
  - allowance
  - trade receivables
  - trade receivable
  - net trade receivables
  - write-off
  - written off
  - debt recovered
  - statement of financial position
  - income statement
  - debtor
  key_points:
  - id: kp_estimate
    text:
      en: An allowance is an estimate of debts that may not be paid, set as a percentage of receivables.
    follow_up:
      en: Why is this an estimate rather than a known loss?
  - id: kp_after_write_offs
    text:
      en: The percentage is applied to receivables after any actual debts have been written off.
    follow_up:
      en: When in the year-end process is the percentage applied?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.acc.o.irrecoverable_debts.allowance_change
  code: ACC-O-10.K03
  node_id: cur.acc.o.irrecoverable_debts
  statement: Calculate the increase or decrease in the allowance charged to profit
  kind: procedural
  tools:
  - acc_statements
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.irrecoverable_debts.allowance_amount
    strength: required
  misconception_ids:
  - mc.acc.o.id_allowance_before_writeoff
  - mc.acc.o.id_change_direction_reversed
  - mc.acc.o.id_full_allowance_charged
  - mc.acc.o.id_old_allowance_added
  skill_ids:
  - acc-o-irrecoverable-debts
  glossary:
  - irrecoverable debt
  - irrecoverable
  - allowance for irrecoverable debts
  - allowance
  - trade receivables
  - trade receivable
  - net trade receivables
  - write-off
  - written off
  - debt recovered
  - statement of financial position
  - income statement
  - debtor
  key_points:
  - id: kp_only_change
    text:
      en: Only the change in the allowance is charged to profit, not the full new figure.
    follow_up:
      en: Which figure is recorded in the income statement each year?
  - id: kp_increase_decrease
    text:
      en: An increase in the allowance is an expense, and a decrease is a gain added to profit.
    follow_up:
      en: What does the result of a lower allowance than last year do to profit?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
- id: kc.acc.o.irrecoverable_debts.net_receivables
  code: ACC-O-10.K04
  node_id: cur.acc.o.irrecoverable_debts
  statement: Calculate net trade receivables shown in the statement of financial position
  kind: procedural
  tools:
  - acc_statements
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.irrecoverable_debts.allowance_amount
    strength: required
  misconception_ids:
  - mc.acc.o.id_allowance_not_deducted
  - mc.acc.o.id_old_allowance_used
  - mc.acc.o.id_writeoff_not_deducted
  skill_ids:
  - acc-o-irrecoverable-debts
  glossary:
  - irrecoverable debt
  - irrecoverable
  - allowance for irrecoverable debts
  - allowance
  - trade receivables
  - trade receivable
  - net trade receivables
  - write-off
  - written off
  - debt recovered
  - statement of financial position
  - income statement
  - debtor
  key_points:
  - id: kp_deduct_allowance
    text:
      en: Net trade receivables are the total owed by customers less the allowance for irrecoverable debts.
    follow_up:
      en: What is subtracted from the receivables total in the statement?
  - id: kp_prudent_value
    text:
      en: This shows the amount that the business expects to collect, in line with prudence.
    follow_up:
      en: What does the figure after the deduction represent for the reader?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
