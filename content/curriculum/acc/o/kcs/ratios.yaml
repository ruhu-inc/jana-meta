  - efficiency
  key_points:
  - id: kp_gm_pm
    text:
      en: Gross margin is gross profit over revenue, and profit margin is profit for the year over revenue, both shown as percentages.
    follow_up:
      en: What is the figure underneath in both of these percentages?
  - id: kp_margin_meaning
    text:
      en: A margin shows how much of each unit of sales is kept as profit before and after running expenses.
    follow_up:
      en: What does a gross margin of 30% say about each dollar of sales?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
