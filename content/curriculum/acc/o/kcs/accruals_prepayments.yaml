  key_points:
  - id: kp_expense_used
    text:
      en: The expense for the year is the cost that belongs to that year, whether or not it has been paid.
    follow_up:
      en: Why can the amount paid in the year differ from the cost of the year?
  - id: kp_add_owing
    text:
      en: When part of an expense is still owing, it is added to the amount paid to find the year's expense.
    follow_up:
      en: What do you do with an unpaid amount when working out the cost of the year?
