    text:
      en: An accrued expense is something owed, so it is a current liability in the statement of financial position.
    follow_up:
      en: Does the business owe or is it owed an amount when an expense is unpaid?
  - id: kp_prepay_asset
    text:
      en: A prepaid expense is a benefit paid for but not yet used, so it is a current asset.
