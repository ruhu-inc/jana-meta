  key_points:
  - id: kp_list_price
    text:
      en: Trade discount is a reduction from the list price given to a buyer, and it is not recorded as an account.
    follow_up:
      en: Is the discount ever entered in the ledger as an expense or income?
  - id: kp_net_entry
    text:
      en: The entry for the sale or purchase is the list price less the trade discount.
    follow_up:
      en: What amount is shown on the invoice as the amount for the goods?
