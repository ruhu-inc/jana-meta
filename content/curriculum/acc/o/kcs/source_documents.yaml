- id: kc.acc.o.source_documents.identify_source_document
  code: ACC-O-02.K01
  node_id: cur.acc.o.source_documents
  statement: Identify the source document that records a given transaction
  kind: factual
  tools: []
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.accounting_equation.purpose_and_users
    strength: helpful
  misconception_ids:
  - mc.acc.o.sd_counterfoil_vs_paying_in
  - mc.acc.o.sd_invoice_credit_note_confused
  - mc.acc.o.sd_receipt_invoice_confused
  skill_ids:
  - acc-o-source-documents
