  - sales returns journal
  - purchases returns journal
  - general journal
  - journal
  - cash book
  - petty cash book
  - day book
  - trade discount
  - cash discount
  - discount allowed
  - discount received
  - list price
  - ledger
  - credit sale
  - credit purchase
  key_points:
  - id: kp_document_proof
    text:
      en: A source document is the first written evidence that a transaction took place.
    follow_up:
      en: What gives the business proof that a transaction really happened?
  - id: kp_matching
    text:
      en: Each document matches a type of transaction, such as an invoice for a credit sale and a credit note for a return.
    follow_up:
      en: Which document would be raised if a customer sent goods back?
  difficulty_prior: -1.2
  version: 0.1.1
  status: active
- id: kc.acc.o.source_documents.select_book_of_prime_entry
  code: ACC-O-02.K02
