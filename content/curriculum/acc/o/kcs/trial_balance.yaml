  - error of commission
  - error of principle
  - compensating error
  - complete reversal
  - error of original entry
  - journal
  - journal entry
  - correcting entry
  - undercast
  - overcast
  - discount received
  - discount allowed
  - carriage inwards
  - purchases returns
  - sales returns
  - transposition
  key_points:
  - id: kp_both_sides_same
    text:
      en: Some errors leave the totals equal, for example omission, a wrong account, a compensating error or reversal of entries.
    follow_up:
      en: What kind of mistake affects both sides by the same amount?
  - id: kp_why_hidden
    text:
      en: The trial balance only tests that debits equal credits, not that entries are complete or in the right account.
    follow_up:
      en: What can the trial balance not prove about the records?
