- id: kc.acc.o.trial_balance.prepare_trial_balance
  code: ACC-O-04.K02
  node_id: cur.acc.o.trial_balance
  statement: Calculate the totals of a trial balance and the difference when it fails
  kind: procedural
  tools:
  - acc_double_entry
  - math_evaluate
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.trial_balance.classify_tb_balances
    strength: required
  - kc_id: kc.acc.o.double_entry.balance_account
    strength: required
  misconception_ids:
  - mc.acc.o.tb_discount_confused
  - mc.acc.o.tb_drawings_credit
  - mc.acc.o.tb_returns_with_main
  skill_ids:
  - acc-o-trial-balance
  glossary:
  - trial balance
  - debit
  - credit
  - debit column
  - credit column
  - ledger
  - suspense account
  - suspense
  - error of omission
  - error of commission
  - error of principle
  - compensating error
  - complete reversal
  - error of original entry
  - journal
  - journal entry
  - correcting entry
  - undercast
  - overcast
  - discount received
  - discount allowed
  - carriage inwards
  - purchases returns
  - sales returns
  - transposition
  key_points:
  - id: kp_totals_agree
    text:
      en: The debit and credit totals of a trial balance should be equal if each entry was made as a debit and credit.
    follow_up:
      en: Why should both columns total the same if all entries were done twice?
  - id: kp_difference
    text:
      en: A difference between the totals shows that an error has been made, and its size is the first clue to the cause.
    follow_up:
      en: What does an unequal total signal about the records?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.acc.o.trial_balance.errors_not_revealed
  code: ACC-O-04.K03
  node_id: cur.acc.o.trial_balance
  statement: Identify the type of an error that leaves the trial balance totals in agreement
  kind: conceptual
  tools:
  - acc_double_entry
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.trial_balance.prepare_trial_balance
    strength: required
  misconception_ids:
  - mc.acc.o.err_commission_principle_confused
  - mc.acc.o.err_original_vs_omission
  - mc.acc.o.err_reversal_vs_original
  - mc.acc.o.err_thinks_tb_reveals
  - mc.acc.o.err_type_names_confused
  skill_ids:
  - acc-o-trial-balance
  glossary:
  - trial balance
  - debit
  - credit
  - debit column
  - credit column
  - ledger
  - suspense account
  - suspense
