  key_points:
  - id: kp_capital_lasting
    text:
      en: Capital expenditure buys or improves a non-current asset that will be used for more than one year.
    follow_up:
      en: How long does a business expect to benefit from an item bought as an asset?
  - id: kp_revenue_running
    text:
      en: Revenue expenditure is the day-to-day cost of running the business and maintaining assets, and it is charged to profit.
    follow_up:
      en: Where does the cost of repairing a machine appear in the accounts?
