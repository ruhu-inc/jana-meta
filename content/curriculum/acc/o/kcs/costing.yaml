- id: kc.acc.o.costing.cost_classification
  code: ACC-O-16.K01
  node_id: cur.acc.o.costing
  statement: Classify a cost as fixed or variable, and as direct or indirect
  kind: conceptual
  tools: []
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.accounting_equation.purpose_and_users
    strength: helpful
  misconception_ids:
  - mc.acc.o.cost_direct_indirect_confused
  - mc.acc.o.cost_fixed_not_cost
  - mc.acc.o.cost_fixed_variable_by_size
  skill_ids:
  - acc-o-costing
  glossary:
  - fixed cost
  - variable cost
  - direct cost
  - indirect cost
  - contribution
  - contribution per unit
  - break-even point
  - break-even
  - margin of safety
  - target profit
  - revenue
  - unit cost
  key_points:
  - id: kp_fixed_variable
    text:
      en: A fixed cost stays the same whatever the output, while a variable cost changes with the number of units made.
    follow_up:
      en: If output doubles, which kind of cost would you expect to stay unchanged?
  - id: kp_direct_indirect
    text:
      en: A direct cost can be traced to a unit of product, while an indirect cost is shared and cannot be traced to one unit.
    follow_up:
      en: How do you tell the cost of materials in a product from the cost of renting the factory?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.acc.o.costing.contribution
  code: ACC-O-16.K02
  node_id: cur.acc.o.costing
  statement: Calculate contribution per unit and total contribution
  kind: procedural
  tools:
  - acc_break_even
  - math_evaluate
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.costing.cost_classification
    strength: required
  misconception_ids:
  - mc.acc.o.cost_contribution_as_profit
  - mc.acc.o.cost_fixed_in_contribution
  - mc.acc.o.cost_vc_added
  skill_ids:
  - acc-o-costing
  glossary:
  - fixed cost
  - variable cost
  - direct cost
  - indirect cost
  - contribution
  - contribution per unit
  - break-even point
  - break-even
  - margin of safety
  - target profit
  - revenue
  - unit cost
  key_points:
  - id: kp_unit_contribution
    text:
      en: Contribution per unit is the selling price less the variable cost per unit.
    follow_up:
      en: Which costs are taken away from the selling price to find it?
  - id: kp_total_contribution
    text:
      en: Total contribution is contribution per unit times units sold, and it pays for fixed costs before any profit.
    follow_up:
      en: What is the money left after variable costs used to cover first?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.acc.o.costing.break_even
  code: ACC-O-16.K03
  node_id: cur.acc.o.costing
  statement: Calculate the break-even point in units and in revenue
  kind: procedural
  tools:
  - acc_break_even
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.costing.contribution
    strength: required
  misconception_ids:
  - mc.acc.o.cost_be_divides_by_price
  - mc.acc.o.cost_be_divides_by_vc
  - mc.acc.o.cost_be_units_revenue_confused
  skill_ids:
  - acc-o-costing
  glossary:
  - fixed cost
  - variable cost
  - direct cost
  - indirect cost
  - contribution
  - contribution per unit
  - break-even point
  - break-even
  - margin of safety
  - target profit
  - revenue
  - unit cost
  key_points:
  - id: kp_no_profit
    text:
      en: Break-even is the output where total contribution just covers fixed costs, so there is no profit or loss.
    follow_up:
      en: What is the level of profit when sales are at break-even?
  - id: kp_fixed_over_contribution
    text:
      en: Break-even units are fixed costs divided by contribution per unit, and revenue is units times selling price.
    follow_up:
      en: Which two figures do you combine to find the number of units?
  difficulty_prior: 0.1
  version: 0.1.1
  status: active
- id: kc.acc.o.costing.margin_of_safety
  code: ACC-O-16.K04
  node_id: cur.acc.o.costing
  statement: Calculate the margin of safety and the profit at a given output
  kind: procedural
  tools:
  - acc_break_even
  - math_evaluate
  exam_weight: 0.15
  prerequisites:
  - kc_id: kc.acc.o.costing.break_even
    strength: required
  misconception_ids:
  - mc.acc.o.cost_contribution_as_profit
  - mc.acc.o.cost_mos_added
  - mc.acc.o.cost_mos_be_as_mos
  - mc.acc.o.cost_mos_output_as_mos
  skill_ids:
  - acc-o-costing
  glossary:
  - fixed cost
  - variable cost
  - direct cost
  - indirect cost
  - contribution
  - contribution per unit
  - break-even point
  - break-even
  - margin of safety
  - target profit
  - revenue
  - unit cost
  key_points:
  - id: kp_buffer
    text:
      en: The margin of safety is how far actual or budgeted sales are above the break-even point.
    follow_up:
      en: How far can sales fall before the business starts making a loss?
  - id: kp_profit_beyond
    text:
      en: Profit at a given output is the units above break-even multiplied by the contribution per unit.
    follow_up:
      en: Which units earn profit once fixed costs are covered?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.acc.o.costing.target_profit
  code: ACC-O-16.K05
  node_id: cur.acc.o.costing
  statement: Calculate the output needed to earn a target profit
  kind: procedural
  tools:
  - acc_break_even
  - math_evaluate
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.costing.break_even
    strength: required
  misconception_ids:
  - mc.acc.o.cost_be_divides_by_price
  - mc.acc.o.cost_target_fc_omitted
  - mc.acc.o.cost_target_subtracted
  skill_ids:
  - acc-o-costing
  glossary:
  - fixed cost
  - variable cost
  - direct cost
  - indirect cost
  - contribution
  - contribution per unit
  - break-even point
  - break-even
  - margin of safety
  - target profit
  - revenue
  - unit cost
  key_points:
  - id: kp_cover_both
    text:
      en: To earn a target profit, contribution must cover the fixed costs and the profit wanted.
    follow_up:
      en: What two amounts must the contribution pay for?
  - id: kp_units_needed
    text:
      en: The output needed is fixed costs plus target profit, divided by the contribution per unit.
    follow_up:
      en: How do you turn that total requirement into a number of units?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
