  key_points:
  - id: kp_opening_purchases_closing
    text:
      en: Cost of sales is opening inventory plus purchases, less closing inventory.
    follow_up:
      en: What is deducted at the end because the goods are still unsold?
  - id: kp_adjust_purchases
    text:
      en: Purchases are adjusted by adding carriage inwards and deducting returns outwards.
    follow_up:
      en: Which costs of getting goods into the business belong in the purchases figure?
