- id: kc.acc.o.partnerships.partnership_agreement
  code: ACC-O-12.K01
  node_id: cur.acc.o.partnerships
  statement: Recall what a partnership agreement covers and the rules that apply without one
  kind: factual
  tools: []
  exam_weight: 0.15
  prerequisites:
  - kc_id: kc.acc.o.double_entry.record_owner_transactions
    strength: helpful
  misconception_ids:
  - mc.acc.o.pa_agreement_scope
  - mc.acc.o.pa_capital_ratio_default
  - mc.acc.o.pa_interest_default
  - mc.acc.o.pa_salary_default
  skill_ids:
  - acc-o-partnerships
  glossary:
  - partnership
  - partnership agreement
  - interest on capital
  - interest on drawings
  - partner's salary
  - partners' salaries
  - appropriation account
  - appropriation
  - residual profit
  - profit-sharing ratio
  - current account
  - capital account
  - fixed capital
  - drawings
  - capital
  key_points:
  - id: kp_agreement_terms
    text:
      en: A partnership agreement sets how profits are shared and covers capital, interest, salaries and drawings.
    follow_up:
      en: What matters would partners want settled before they begin trading together?
  - id: kp_no_agreement
    text:
      en: Without an agreement, profits are shared equally and no interest or salaries are given, apart from interest on loans.
    follow_up:
      en: How are profits divided when the partners never agreed anything?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.acc.o.partnerships.interest_and_salary
  code: ACC-O-12.K02
  node_id: cur.acc.o.partnerships
  statement: Calculate interest on capital, interest on drawings and partners' salaries
  kind: procedural
  tools:
  - acc_double_entry
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.partnerships.partnership_agreement
    strength: required
  misconception_ids:
  - mc.acc.o.pa_iod_added
  - mc.acc.o.pa_rate_on_wrong_base
  - mc.acc.o.pa_salary_omitted
  skill_ids:
  - acc-o-partnerships
  glossary:
  - partnership
  - partnership agreement
  - interest on capital
  - interest on drawings
  - partner's salary
  - partners' salaries
  - appropriation account
  - appropriation
  - residual profit
  - profit-sharing ratio
  - current account
  - capital account
  - fixed capital
  - drawings
  - capital
  key_points:
  - id: kp_interest_capital_salary
    text:
      en: Interest on capital and salaries reward money invested and work done, and are given out before the residual profit is shared.
    follow_up:
      en: Why do these amounts come out of profit before the final split?
  - id: kp_interest_drawings
    text:
      en: Interest on drawings is charged to the partner, so it reduces that partner's share and adds to the profit available.
    follow_up:
      en: Which way does interest on drawings move a partner's share?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.acc.o.partnerships.appropriation
  code: ACC-O-12.K03
  node_id: cur.acc.o.partnerships
  statement: Calculate each partner's share of the residual profit in the appropriation account
  kind: procedural
  tools:
  - acc_double_entry
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.partnerships.interest_and_salary
    strength: required
  - kc_id: kc.acc.o.sole_trader_statements.profit_for_year
    strength: helpful
  misconception_ids:
  - mc.acc.o.pa_appropriation_as_expense
  - mc.acc.o.pa_iod_subtracted
  - mc.acc.o.pa_ratio_reversed
  - mc.acc.o.pa_share_before_appropriations
  skill_ids:
  - acc-o-partnerships
  glossary:
  - partnership
  - partnership agreement
  - interest on capital
  - interest on drawings
  - partner's salary
  - partners' salaries
  - appropriation account
  - appropriation
  - residual profit
  - profit-sharing ratio
  - current account
  - capital account
  - fixed capital
  - drawings
  - capital
  key_points:
  - id: kp_residual_ratio
    text:
      en: After interest and salaries, the remaining profit is shared in the agreed profit-sharing ratio.
    follow_up:
      en: What is divided using the ratio, the full profit or what is left?
  - id: kp_total_share
