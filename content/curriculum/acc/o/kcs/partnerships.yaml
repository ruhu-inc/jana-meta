- id: kc.acc.o.partnerships.current_accounts
  code: ACC-O-12.K04
  node_id: cur.acc.o.partnerships
  statement: Calculate the closing balance of a partner's current account
  kind: procedural
  tools:
  - acc_double_entry
  - math_evaluate
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.partnerships.appropriation
    strength: required
  - kc_id: kc.acc.o.double_entry.balance_account
    strength: helpful
  misconception_ids:
  - mc.acc.o.pa_drawings_added_current
  - mc.acc.o.pa_iod_omitted
  - mc.acc.o.pa_opening_side_reversed
  skill_ids:
  - acc-o-partnerships
  glossary:
  - partnership
  - partnership agreement
  - interest on capital
  - interest on drawings
  - partner's salary
  - partners' salaries
  - appropriation account
  - appropriation
  - residual profit
  - profit-sharing ratio
  - current account
  - capital account
  - fixed capital
  - drawings
  - capital
  key_points:
  - id: kp_credits_debits
    text:
      en: A current account is credited with salary, interest and profit share, and debited with drawings and interest on drawings.
    follow_up:
      en: Which items increase what the business owes the partner?
  - id: kp_balance_sign
    text:
      en: The closing balance is the difference between the sides, and a credit balance is owed to the partner.
