- id: kc.acc.o.control_accounts.control_purpose
  code: ACC-O-06.K01
  node_id: cur.acc.o.control_accounts
  statement: Explain the purpose of sales and purchases ledger control accounts
  kind: factual
  tools: []
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.source_documents.post_day_book_totals
    strength: helpful
  misconception_ids:
  - mc.acc.o.ca_control_finds_all_errors
  - mc.acc.o.ca_control_for_cash
  - mc.acc.o.ca_control_replaces_ledger
  skill_ids:
  - acc-o-control-accounts
  glossary:
  - control account
  - sales ledger control account
  - purchases ledger control account
  - sales ledger control
  - purchases ledger control
  - sales ledger
  - purchases ledger
  - trade receivables
  - trade payables
  - credit sales
  - credit purchases
  - sales returns
  - purchases returns
  - discount allowed
  - discount received
  - irrecoverable debt
  - dishonoured cheque
  - contra entry
  - set-off
  - opening balance
  - closing balance
  - day book
  - debit balance
  - credit balance
  - ledger
  key_points:
  - id: kp_total_check
    text:
      en: A control account shows the total owed by all customers or to all suppliers, and acts as a check on the ledger.
    follow_up:
      en: What is a total account used to test in the individual ledger?
  - id: kp_locate_errors
    text:
      en: If it disagrees with the list of balances, an error is signalled, and it helps to find who is responsible and where to look.
    follow_up:
      en: What does a difference between the two figures tell you about the ledger?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.acc.o.control_accounts.control_sources
  code: ACC-O-06.K02
  node_id: cur.acc.o.control_accounts
  statement: Identify where each figure in a control account comes from and its side
  kind: conceptual
  tools:
  - acc_double_entry
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.acc.o.control_accounts.control_purpose
    strength: required
  misconception_ids:
  - mc.acc.o.ca_side_reversed
  - mc.acc.o.ca_source_confused
  - mc.acc.o.ca_wrong_control_account
  skill_ids:
  - acc-o-control-accounts
  glossary:
  - control account
  - sales ledger control account
  - purchases ledger control account
  - sales ledger control
  - purchases ledger control
  - sales ledger
  - purchases ledger
  - trade receivables
  - trade payables
  - credit sales
  - credit purchases
  - sales returns
  - purchases returns
  - discount allowed
  - discount received
  - irrecoverable debt
  - dishonoured cheque
  - contra entry
  - set-off
  - opening balance
  - closing balance
  - day book
  - debit balance
  - credit balance
  - ledger
  key_points:
  - id: kp_totals_from_books
    text:
      en: Control account figures come from the totals of the day books, the cash book and the journal for the period.
    follow_up:
      en: Where do you find the total of credit sales for the month?
  - id: kp_same_sides
    text:
      en: Items sit on the same side as in the individual accounts, so a rise in what customers owe is a debit in the sales control.
    follow_up:
      en: On which side does a customer's balance sit, and what increases it?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.acc.o.control_accounts.sales_ledger_control
  code: ACC-O-06.K03
  node_id: cur.acc.o.control_accounts
  statement: Calculate the closing balance of a sales ledger control account
  kind: procedural
  tools:
  - acc_double_entry
  - math_evaluate
  exam_weight: 0.3
  prerequisites:
  - kc_id: kc.acc.o.control_accounts.control_sources
    strength: required
  - kc_id: kc.acc.o.double_entry.balance_account
    strength: required
  misconception_ids:
  - mc.acc.o.ca_cash_sales_included
  - mc.acc.o.ca_discount_side_reversed
  - mc.acc.o.ca_irrecoverable_omitted
  skill_ids:
  - acc-o-control-accounts
  glossary:
  - control account
  - sales ledger control account
  - purchases ledger control account
  - sales ledger control
  - purchases ledger control
  - sales ledger
  - purchases ledger
  - trade receivables
  - trade payables
