  - closing balance
  - day book
  - debit balance
  - credit balance
  - ledger
  key_points:
  - id: kp_debits_credits
    text:
      en: Opening receivables and credit sales go on the debit side, while cash, discount and returns go on the credit side.
    follow_up:
      en: Which items increase what customers owe and which reduce it?
  - id: kp_balance_down
    text:
      en: The closing balance is the difference between the two sides and should agree with the total of customers' balances.
    follow_up:
      en: How do you get the closing figure, and what should it match?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
