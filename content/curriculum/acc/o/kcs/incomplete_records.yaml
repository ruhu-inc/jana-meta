- id: kc.acc.o.incomplete_records.statement_of_affairs
  code: ACC-O-14.K01
  node_id: cur.acc.o.incomplete_records
  statement: Calculate a trader's capital from a statement of affairs
  kind: procedural
  tools:
  - acc_double_entry
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.accounting_equation.apply_equation
    strength: required
  misconception_ids:
  - mc.acc.o.ir_soa_assets_only
  - mc.acc.o.ir_soa_item_misclassified
  - mc.acc.o.ae_equation_signs_wrong
  skill_ids:
  - acc-o-incomplete-records
  glossary:
  - incomplete records
  - statement of affairs
  - opening capital
  - closing capital
  - capital introduced
  - capital
  - drawings
  - profit for the year
  - credit sales
  - credit purchases
  - trade receivables
  - trade payables
  - margin
  - mark-up
  - gross margin
  - cost of sales
  - revenue
  - asset
  - liability
  - liabilities
  key_points:
  - id: kp_list_assets_liabilities
    text:
      en: A statement of affairs lists assets and liabilities at one date because there is no ledger to take capital from.
    follow_up:
      en: Why does a trader without full records have to list items to find capital?
  - id: kp_capital_difference
    text:
      en: Capital is the total of the assets less the total of the liabilities.
    follow_up:
      en: How do you get capital once all items have been listed?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.acc.o.incomplete_records.profit_from_capital
  code: ACC-O-14.K02
  node_id: cur.acc.o.incomplete_records
  statement: Calculate profit for the year from the change in capital, drawings and capital introduced
  kind: procedural
  tools:
  - acc_statements
  - math_evaluate
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.acc.o.incomplete_records.statement_of_affairs
    strength: required
  - kc_id: kc.acc.o.sole_trader_statements.closing_capital
    strength: helpful
  misconception_ids:
  - mc.acc.o.ir_capital_introduced_added
  - mc.acc.o.ir_change_only
  - mc.acc.o.ir_drawings_subtracted
  skill_ids:
  - acc-o-incomplete-records
  glossary:
  - incomplete records
  - statement of affairs
  - opening capital
  - closing capital
  - capital introduced
  - capital
  - drawings
  - profit for the year
  - credit sales
  - credit purchases
  - trade receivables
  - trade payables
  - margin
  - mark-up
  - gross margin
  - cost of sales
  - revenue
  - asset
  - liability
  - liabilities
  key_points:
  - id: kp_change_in_capital
    text:
      en: Profit is the increase in capital over the year, after allowing for what the owner took out or put in.
    follow_up:
      en: Why does the change in capital not equal profit on its own?
  - id: kp_adjustments
    text:
      en: Drawings are added back and capital introduced is deducted from the change in capital.
    follow_up:
      en: What two owner movements must be adjusted before the change is called profit?
