  key_points:
  - id: kp_margin_on_sales
    text:
      en: A margin is a percentage of revenue, so cost of sales is revenue less the gross profit.
    follow_up:
      en: What base is a margin worked out on?
  - id: kp_markup_on_cost
    text:
      en: Mark-up is worked out on cost, so adding it to the cost gives the revenue.
    follow_up:
      en: What base is a mark-up worked out on, compared with a margin?
