- id: kc.acc.o.concepts.identify_concept
  code: ACC-O-17.K01
  node_id: cur.acc.o.concepts
  statement: Identify the accounting principle applied in a described situation
  kind: conceptual
  tools: []
  exam_weight: 0.5
  prerequisites:
  - kc_id: kc.acc.o.accounting_equation.purpose_and_users
    strength: helpful
  misconception_ids:
  - mc.acc.o.con_cost_always
  - mc.acc.o.con_materiality_vs_entity
  - mc.acc.o.con_names_confused
  - mc.acc.o.con_prudence_catch_all
  - mc.acc.o.con_prudence_realisation_confused
  skill_ids:
  - acc-o-concepts
  glossary:
  - accounting principle
  - principle
  - accounting concept
  - business entity
  - going concern
  - consistency
  - prudence
  - accruals
  - matching
  - realisation
  - materiality
  - money measurement
  - historic cost
  - duality
  - revenue
  - expense
  - capital
  - drawings
  - asset
  - inventory
  - depreciation
  - net realisable value
  - non-current asset
  key_points:
  - id: kp_match_situation
    text:
      en: Each accounting concept describes a rule, and a situation is matched to the concept whose rule it follows or breaks.
    follow_up:
      en: How would you decide which rule a described treatment is following?
  - id: kp_common_concepts
    text:
      en: Prudence avoids overstating profit, going concern assumes the business continues, and consistency keeps methods the same.
    follow_up:
      en: What does each of these ideas ask the accountant to do?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.acc.o.concepts.apply_concept
  code: ACC-O-17.K02
  node_id: cur.acc.o.concepts
  statement: Select the accounting treatment that a stated principle requires
  kind: conceptual
  tools: []
  exam_weight: 0.5
  prerequisites:
  - kc_id: kc.acc.o.concepts.identify_concept
    strength: required
  misconception_ids:
  - mc.acc.o.con_cash_basis_principle
  - mc.acc.o.con_consistency_ignored
  - mc.acc.o.con_cost_always
  - mc.acc.o.con_entity_ignored
  - mc.acc.o.con_materiality_vs_entity
  - mc.acc.o.con_names_confused
  - mc.acc.o.con_prudence_realisation_confused
  skill_ids:
  - acc-o-concepts
  glossary:
  - accounting principle
  - principle
  - accounting concept
  - business entity
  - going concern
  - consistency
  - prudence
  - accruals
  - matching
  - realisation
  - materiality
  - money measurement
  - historic cost
  - duality
  - revenue
  - expense
  - capital
  - drawings
  - asset
  - inventory
  - depreciation
  - net realisable value
  - non-current asset
  key_points:
  - id: kp_apply_prudence
    text:
      en: Under prudence, losses are recognised as soon as they are expected, while profits wait until they are earned.
    follow_up:
      en: How should an expected loss and an expected gain be treated differently?
  - id: kp_apply_other
    text:
      en: Business entity keeps the owner's affairs apart from the business, and money measurement records only items with a money value.
    follow_up:
      en: Why is the owner's private spending kept out of the business records?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
