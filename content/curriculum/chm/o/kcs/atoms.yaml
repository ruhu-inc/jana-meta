    strength: required
  confusable_with:
  - kc.chm.o.atoms.structure_and_properties
  misconception_ids:
  - mc.chm.o.melting_breaks_covalent_bonds
  - mc.chm.o.structure_type_misidentified
  - mc.chm.o.graphite_conducts_by_ions
  - mc.chm.o.giant_covalent_as_molecules
  - mc.chm.o.graphite_soft_bonds_weak
  skill_ids:
  - chm-o-atoms
  glossary:
  - giant covalent
  - covalent
  - covalent bond
  - diamond
  - graphite
  - silicon(IV) oxide
  - silicon dioxide
  - silicon
  - lattice
  - delocalised electron
  - relative formula mass
  key_points:
