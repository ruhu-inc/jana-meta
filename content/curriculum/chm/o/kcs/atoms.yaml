- id: kc.chm.o.atoms.element_compound_mixture
  code: CHM-O-02.01.K01
  node_id: cur.chm.o.atoms_elements_and_compounds.elements_compounds_and_mixtures
  statement: Classify a substance as an element, a compound or a mixture
  kind: conceptual
  tools: []
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.chm.o.states.particle_model
    strength: helpful
  misconception_ids:
  - mc.chm.o.diatomic_as_compound
  - mc.chm.o.mixture_as_compound
  - mc.chm.o.compound_as_element
  - mc.chm.o.compound_as_mixture
  skill_ids:
  - chm-o-atoms
  glossary:
  - element
  - compound
  - mixture
  - molecule
  - relative formula mass
  - relative molecular mass
  - chemical formula
  - formula
  key_points:
  - id: kp_element_compound
    text:
      en: An element has only one type of atom, while a compound has different atoms chemically bonded in fixed proportions.
    follow_up:
      en: What do the atoms in an element have in common, and what holds the atoms in a compound together?
  - id: kp_mixture
    text:
      en: A mixture is not chemically joined, so its parts keep their own properties and can be separated physically.
    follow_up:
      en: How are the substances in a mixture held together, and how can you separate them?
  difficulty_prior: -1.0
  version: 0.1.1
  status: active
- id: kc.chm.o.atoms.subatomic_particles
  code: CHM-O-02.02.K01
  node_id: cur.chm.o.atoms_elements_and_compounds.atomic_structure_and_the_periodic_table
  statement: Determine the numbers of protons, neutrons and electrons in an atom or ion from its proton and nucleon numbers
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.12
  prerequisites: []
  misconception_ids:
  - mc.chm.o.neutrons_nucleon_number
  - mc.chm.o.neutrons_added
  - mc.chm.o.neutrons_equal_protons
  - mc.chm.o.ion_electrons_unchanged
  - mc.chm.o.ion_electrons_equal_charge
  - mc.chm.o.ion_charge_sign_reversed
  skill_ids:
  - chm-o-atoms
  glossary:
  - proton
  - neutron
  - electron
  - nucleus
  - proton number
  - nucleon number
  - atomic number
  - mass number
  - ion
  key_points:
  - id: kp_proton_electron
    text:
      en: In a neutral atom the number of protons equals the number of electrons, and the proton number is the atomic number.
    follow_up:
      en: How does the count of electrons relate to the count of protons in a neutral atom?
  - id: kp_neutrons
    text:
      en: The number of neutrons is the nucleon number minus the proton number.
    follow_up:
      en: If you are told the nucleon number and the proton number, how do you find the neutrons?
  - id: kp_ion_electrons
    text:
      en: An ion has gained or lost electrons, so its electron number differs from its proton number.
    follow_up:
      en: For a positive ion, how do its electrons compare with its protons?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.chm.o.atoms.electron_arrangement
  code: CHM-O-02.02.K02
  node_id: cur.chm.o.atoms_elements_and_compounds.atomic_structure_and_the_periodic_table
  statement: Determine the electron arrangement and outer-shell electrons of the first twenty elements
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.14
  prerequisites:
  - kc_id: kc.chm.o.atoms.subatomic_particles
    strength: required
  misconception_ids:
  - mc.chm.o.first_shell_holds_eight
  - mc.chm.o.third_shell_overfilled
  - mc.chm.o.arrangement_from_nucleon_number
  - mc.chm.o.shells_filled_outside_in
  skill_ids:
  - chm-o-atoms
  glossary:
  - electron arrangement
  - electron
  - shell
  - outer shell
  - outer-shell
  - proton number
  - aluminium
  - potassium
  key_points:
  - id: kp_shell_filling
    text:
      en: Electrons fill shells from the nearest the nucleus outwards, with 2 in the first shell and up to 8 in the second and third.
    follow_up:
      en: In what order do electrons fill the shells, and how many fit in each of the first three?
  - id: kp_outer_electrons
    text:
      en: The outer-shell electrons set the chemistry of the element, and their number equals the group number for Groups I to VII.
    follow_up:
      en: Which electrons decide how an element reacts, and how do you read their number from the periodic table?
  difficulty_prior: -0.5
  version: 0.1.1
  status: active
- id: kc.chm.o.atoms.isotopes
  code: CHM-O-02.03.K01
  node_id: cur.chm.o.atoms_elements_and_compounds.isotopes
  statement: Calculate a relative atomic mass from the masses and percentage abundances of isotopes
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.chm.o.atoms.subatomic_particles
    strength: required
  confusable_with:
  - kc.chm.o.atoms.subatomic_particles
  misconception_ids:
  - mc.chm.o.isotope_simple_average
  - mc.chm.o.isotope_no_divide_100
  - mc.chm.o.isotope_abundance_swapped
  - mc.chm.o.isotopes_differ_chemically
  skill_ids:
  - chm-o-atoms
  glossary:
  - isotope
  - relative atomic mass
  - abundance
  - percentage abundance
  - nucleon number
  - rubidium
  - iridium
  - antimony
  key_points:
  - id: kp_isotopes_def
    text:
      en: Isotopes are atoms of the same element with the same proton number but different numbers of neutrons.
    follow_up:
      en: What is the same and what is different between two isotopes of one element?
  - id: kp_weighted_mean
    text:
      en: 'The relative atomic mass is a weighted mean: multiply each mass by its percentage, add them and divide by 100.'
    follow_up:
      en: Why is the relative atomic mass not simply the average of the isotope masses?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.chm.o.atoms.ion_formation
  code: CHM-O-02.04.K01
  node_id: cur.chm.o.atoms_elements_and_compounds.ion_and_ionic_bonds
  statement: Predict the charge on the ion an element forms from its electron arrangement
  kind: conceptual
  tools: []
  exam_weight: 0.14
  prerequisites:
  - kc_id: kc.chm.o.atoms.electron_arrangement
    strength: required
  misconception_ids:
  - mc.chm.o.ion_electrons_unchanged
  - mc.chm.o.ion_charge_sign_reversed
  - mc.chm.o.ion_sign_reversed
  - mc.chm.o.ion_wrong_direction
  - mc.chm.o.ion_charge_from_period
  skill_ids:
  - chm-o-atoms
  glossary:
  - ion
  - positive ion
  - negative ion
  - cation
  - anion
  - electron arrangement
  - outer shell
  - magnesium
  - oxygen
  key_points:
  - id: kp_full_outer_shell
    text:
      en: Atoms gain or lose electrons to reach a full outer shell, like a noble gas.
    follow_up:
