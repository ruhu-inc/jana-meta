- id: kc.chm.o.atoms.structure_and_properties
  code: CHM-O-02.05.K02
  node_id: cur.chm.o.atoms_elements_and_compounds.simple_molecules_and_covalent_bonds
  statement: Relate melting point and electrical conductivity to ionic, simple molecular or giant structure
  kind: conceptual
  tools: []
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.atoms.ion_formation
    strength: required
  - kc_id: kc.chm.o.atoms.covalent_bonding
    strength: required
  misconception_ids:
  - mc.chm.o.melting_breaks_covalent_bonds
  - mc.chm.o.ionic_conduction_by_electrons
  - mc.chm.o.ionic_compound_as_molecules
  - mc.chm.o.ionic_as_covalent
  - mc.chm.o.structure_type_misidentified
  - mc.chm.o.conducts_means_metallic
  skill_ids:
  - chm-o-atoms
  glossary:
  - ionic
  - ionic lattice
  - simple molecular
  - giant structure
  - giant covalent
  - metallic
  - melting point
  - electrical conductivity
  - conductivity
  - conduct electricity
  - molten
  - molecular
  - particle
  - relative formula mass
  - solution
  key_points:
  - id: kp_ionic_giant
    text:
      en: Ionic compounds have strong attractions throughout a lattice, so high melting points, and conduct only when molten or dissolved.
    follow_up:
      en: Why do ionic solids melt only at high temperatures, and when can they carry a current?
  - id: kp_simple_molecular
    text:
      en: Simple molecular substances have weak forces between molecules, so low melting points and no electrical conduction.
    follow_up:
      en: What is broken when a simple molecular substance melts, and why is it easy to do?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.chm.o.atoms.giant_covalent
  code: CHM-O-02.06.K01
