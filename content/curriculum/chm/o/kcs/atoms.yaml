- id: kc.chm.o.atoms.covalent_bonding
  code: CHM-O-02.05.K01
  node_id: cur.chm.o.atoms_elements_and_compounds.simple_molecules_and_covalent_bonds
  statement: Identify the number of shared electron pairs in simple covalent molecules
  kind: conceptual
  tools: []
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.atoms.electron_arrangement
    strength: required
  confusable_with:
  - kc.chm.o.atoms.ion_formation
  misconception_ids:
  - mc.chm.o.covalent_as_transfer
  - mc.chm.o.covalent_multiple_bond_missed
  - mc.chm.o.covalent_lone_pairs_counted
  - mc.chm.o.covalent_pairs_equal_atoms
  skill_ids:
  - chm-o-atoms
  glossary:
  - covalent bond
  - covalent
  - shared pair
  - electron pair
  - lone pair
  - non-bonding pair
  - molecule
  - dot-and-cross diagram
  - outer shell
  - electron
  - ammonia
  - nitrogen
  - hydrogen
  - oxygen
  key_points:
