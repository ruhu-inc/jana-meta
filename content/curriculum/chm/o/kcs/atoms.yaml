- id: kc.chm.o.atoms.metallic_bonding
  code: CHM-O-02.07.K01
  node_id: cur.chm.o.atoms_elements_and_compounds.metallic_bonding
  statement: Explain the conductivity and malleability of metals using positive ions and delocalised electrons
  kind: conceptual
  tools: []
  exam_weight: 0.08
  prerequisites:
  - kc_id: kc.chm.o.atoms.electron_arrangement
    strength: helpful
  confusable_with:
  - kc.chm.o.atoms.giant_covalent
  misconception_ids:
  - mc.chm.o.metal_conducts_by_ions
  - mc.chm.o.metallic_as_shared_pairs
  - mc.chm.o.malleable_because_bonds_weak
  skill_ids:
  - chm-o-atoms
  glossary:
  - metallic bonding
  - metallic bond
  - metallic
  - delocalised electrons
  - delocalised
  - positive ion
  - lattice
  - malleable
  - malleability
  - electron
  - magnesium
  key_points:
  - id: kp_electron_sea
    text:
      en: A metal is a lattice of positive ions in a sea of delocalised electrons, which are free to move and carry charge.
    follow_up:
