- id: kc.chm.o.periodic.arrangement
  code: CHM-O-08.01.K01
  node_id: cur.chm.o.the_periodic_table.arrangement_of_elements
  statement: Relate the group and period of an element to its electron arrangement
  kind: conceptual
  tools: []
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.chm.o.atoms.electron_arrangement
    strength: required
  misconception_ids:
  - mc.chm.o.ion_charge_from_period
  - mc.chm.o.periodic_group_period_swapped
  - mc.chm.o.periodic_group_from_full_shell
  - mc.chm.o.periodic_period_full_shells_only
  skill_ids:
  - chm-o-periodic
  glossary:
  - Periodic Table
  - group
  - period
  - electron arrangement
  - outer shell
  - outer-shell electrons
  - proton number
  - element
  - electron
  key_points:
  - id: kp_group_outer
    text:
      en: The group number equals the number of outer-shell electrons, so elements in a group react in a similar way.
    follow_up:
      en: What does the group number tell you about the electrons, and what follows for the chemistry?
  - id: kp_period_shells
    text:
      en: The period number equals the number of electron shells that are occupied.
    follow_up:
      en: What does the period number tell you about the electron arrangement?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.chm.o.periodic.group_i
  code: CHM-O-08.02.K01
  node_id: cur.chm.o.the_periodic_table.group_i_properties
  statement: Predict the properties and reactions of Group I metals from the trend down the group
  kind: conceptual
  tools: []
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.chm.o.periodic.arrangement
    strength: required
  confusable_with:
  - kc.chm.o.periodic.group_vii
  misconception_ids:
  - mc.chm.o.periodic_group1_reactivity_decreases
  - mc.chm.o.periodic_same_group_identical
  - mc.chm.o.periodic_group1_more_outer_electrons
  - mc.chm.o.periodic_group1_water_gives_oxygen
  - mc.chm.o.periodic_group1_forms_oxide
  - mc.chm.o.periodic_group1_solution_acidic
  skill_ids:
  - chm-o-periodic
  glossary:
  - Group I
  - alkali metal
  - lithium
  - sodium
  - potassium
  - rubidium
  - caesium
  - alkali
  - alkaline
  - hydroxide
  - universal indicator
  - outer electron
  - reactivity
  key_points:
  - id: kp_trend_reactivity
    text:
      en: Going down Group I, the metals get more reactive, softer and have lower melting points.
    follow_up:
      en: How do reactivity and melting point change as you go down the group?
  - id: kp_water_reaction
    text:
      en: Group I metals react with water to give a metal hydroxide solution and hydrogen gas.
    follow_up:
      en: What two products form when a Group I metal is dropped into water?
  - id: kp_reason_outer_electron
    text:
      en: The outer electron is lost more easily down the group as it is further from the nucleus.
    follow_up:
      en: Why does losing the outer electron get easier down the group?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.chm.o.periodic.group_vii
  code: CHM-O-08.03.K01
  node_id: cur.chm.o.the_periodic_table.group_vii_properties
  statement: Predict the properties and displacement reactions of the halogens from the trend down Group VII
  kind: conceptual
  tools: []
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.chm.o.periodic.arrangement
    strength: required
  confusable_with:
  - kc.chm.o.periodic.group_i
  misconception_ids:
  - mc.chm.o.periodic_same_group_identical
  - mc.chm.o.periodic_halogen_reactivity_increases
  - mc.chm.o.periodic_displacement_reversed
  - mc.chm.o.periodic_halogen_state_trend_reversed
  skill_ids:
  - chm-o-periodic
  glossary:
  - Group VII
  - halogen
  - halide
  - chlorine
  - bromine
  - iodine
  - astatine
  - displacement
  - potassium chloride
  - potassium bromide
  - potassium iodide
  - aqueous
  - solution
  - relative formula mass
  - equation
  key_points:
  - id: kp_halogen_trend
    text:
      en: Going down Group VII, the halogens get darker in colour, have higher melting points and become less reactive.
    follow_up:
      en: Describe how colour, melting point and reactivity change down the group.
  - id: kp_halogen_displacement
    text:
      en: A more reactive halogen displaces a less reactive halide from its solution, such as chlorine from bromide.
    follow_up:
      en: When will a halogen push another halogen out of a solution of its salt?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.chm.o.periodic.transition_elements
  code: CHM-O-08.04.K01
  node_id: cur.chm.o.the_periodic_table.transition_elements
  statement: Describe the typical properties of transition elements and compare them with Group I metals
  kind: conceptual
  tools: []
  exam_weight: 0.15
  prerequisites: []
  misconception_ids:
  - mc.chm.o.periodic_transition_like_group1
  - mc.chm.o.periodic_transition_white_compounds
  - mc.chm.o.periodic_transition_one_charge
  skill_ids:
  - chm-o-periodic
  glossary:
  - transition element
  - transition metal
  - catalyst
  - coloured compound
  - oxidation state
  - Periodic Table
  - Group I
  - density
  - relative formula mass
  - solution
  key_points:
  - id: kp_transition_properties
    text:
      en: Transition elements have high density, high melting points, form coloured compounds and are good catalysts.
    follow_up:
      en: Which properties are typical of the block of elements in the middle of the table?
  - id: kp_compared_group_i
    text:
      en: Compared with Group I, they are harder and denser, with higher melting points, and react much less vigorously.
    follow_up:
      en: How do they differ from Group I metals in hardness, density and reactivity?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.chm.o.periodic.noble_gases
  code: CHM-O-08.05.K01
  node_id: cur.chm.o.the_periodic_table.noble_gases
  statement: Explain the unreactivity and uses of the noble gases from their electron arrangement
  kind: conceptual
  tools: []
  exam_weight: 0.15
  prerequisites:
  - kc_id: kc.chm.o.atoms.electron_arrangement
    strength: required
  misconception_ids:
  - mc.chm.o.periodic_noble_diatomic
  - mc.chm.o.periodic_noble_unreactive_because_gas
  - mc.chm.o.periodic_helium_eight
  - mc.chm.o.periodic_transition_like_group1
  - mc.chm.o.periodic_noble_gas_reacts
  skill_ids:
  - chm-o-periodic
  glossary:
  - noble gas
  - Group VIII
  - Group 0
  - unreactive
  - inert
  - electron arrangement
  - outer shell
  - argon
  - neon
  - helium
  key_points:
  - id: kp_full_shell
    text:
      en: The noble gases have full outer shells, so they have no tendency to gain, lose or share electrons and are unreactive.
    follow_up:
      en: What is special about their electron arrangement, and what does it do to their reactions?
  - id: kp_uses
    text:
      en: Their inertness decides their uses, such as argon in light bulbs and helium in balloons.
    follow_up:
      en: How does being unreactive make argon suitable for a light bulb?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
