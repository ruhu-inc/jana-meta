- id: kc.chm.o.organic.alkanes_and_alkenes
  code: CHM-O-11.05.K01
  node_id: cur.chm.o.organic_chemistry.alkenes
  statement: Distinguish alkanes from alkenes by their reactions, including the test with bromine water
  kind: conceptual
  tools: []
  exam_weight: 0.14
  prerequisites:
  - kc_id: kc.chm.o.organic.functional_groups
    strength: required
  misconception_ids:
  - mc.chm.o.organic_alkanes_decolourise_bromine
  - mc.chm.o.organic_bromine_colour_reversed
  - mc.chm.o.organic_addition_substitution_mixed
  skill_ids:
  - chm-o-organic
  glossary:
  - alkane
  - alkene
  - saturated
  - unsaturated
  - hydrocarbon
  - bromine water
  - addition reaction
  - substitution reaction
  - double bond
  key_points:
  - id: kp_saturated_unsaturated
    text:
      en: Alkanes are saturated with only single bonds, while alkenes are unsaturated and contain a C=C double bond.
    follow_up:
      en: What kind of bond differs between the two families?
  - id: kp_bromine_test
    text:
      en: Bromine water stays orange with an alkane but is decolourised by an alkene because it adds across the double bond.
    follow_up:
      en: What would you see on adding bromine water to each, and why do they differ?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
