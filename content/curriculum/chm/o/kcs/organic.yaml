- id: kc.chm.o.organic.general_formulae
  code: CHM-O-11.01.K02
  node_id: cur.chm.o.organic_chemistry.formulae_functional_groups_and_terminolo
  statement: Use a general formula to find the molecular formula and relative molecular mass of a series member
  kind: procedural
  tools:
  - chem_molar_mass
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.organic.functional_groups
    strength: required
  - kc_id: kc.chm.o.stoichiometry.relative_formula_mass
    strength: required
  misconception_ids:
  - mc.chm.o.organic_gf_wrong_series
  - mc.chm.o.organic_gf_hydrogen_mass_ignored
  - mc.chm.o.organic_gf_group_atoms_missed
  skill_ids:
  - chm-o-organic
  glossary:
  - general formula
  - molecular formula
  - relative molecular mass
  - homologous series
  - alkane
  - alkene
  - alcohol
  - carboxylic acid
  - molecule
  key_points:
  - id: kp_substitute_n
    text:
      en: Put the number of carbon atoms in place of n in the general formula, such as CnH2n+2 for alkanes, to get the molecular formula.
    follow_up:
      en: What do you replace in the general formula to get the formula of one member?
  - id: kp_mr_from_formula
    text:
      en: Adding up the relative atomic masses of all the atoms in that molecular formula gives the relative molecular mass.
    follow_up:
      en: Having found the molecular formula, how do you turn it into a relative molecular mass?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.chm.o.organic.fuels_and_cracking
  code: CHM-O-11.03.K01
  node_id: cur.chm.o.organic_chemistry.fuels
  statement: Describe the fractional distillation of petroleum and explain why large alkanes are cracked
  kind: conceptual
  tools: []
  exam_weight: 0.12
  prerequisites: []
  misconception_ids:
  - mc.chm.o.organic_fraction_is_one_compound
  - mc.chm.o.organic_big_molecules_boil_low
  - mc.chm.o.organic_cracking_is_separation
  skill_ids:
  - chm-o-organic
  glossary:
  - petroleum
  - crude oil
  - fractional distillation
  - fractionating column
  - fraction
  - refinery
  - refinery gas
  - gasoline
  - naphtha
  - kerosene
  - diesel oil
  - bitumen
  - cracking
  - alkane
  - alkene
  - dodecane
  - molecule
  key_points:
  - id: kp_fractional_distillation
    text:
      en: Fractional distillation separates petroleum by boiling point, with the smaller molecules rising higher in the column.
    follow_up:
      en: On what property does the separation depend, and where in the column do small molecules end up?
  - id: kp_cracking
    text:
      en: Large alkanes are cracked into smaller alkanes and alkenes, as small molecules are in more demand.
    follow_up:
      en: Why is it worth breaking large hydrocarbons into smaller ones, and what is made?
