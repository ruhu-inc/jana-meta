- id: kc.chm.o.organic.functional_groups
  code: CHM-O-11.01.K01
  node_id: cur.chm.o.organic_chemistry.formulae_functional_groups_and_terminolo
  statement: Identify the homologous series of an organic compound from its formula or functional group
  kind: conceptual
  tools: []
  exam_weight: 0.14
  prerequisites: []
  misconception_ids:
  - mc.chm.o.organic_oh_group_is_hydroxide
  - mc.chm.o.organic_series_by_carbon_count
  - mc.chm.o.organic_oh_and_cooh_confused
  skill_ids:
  - chm-o-organic
  glossary:
  - functional group
  - homologous series
  - organic compound
  - hydrocarbon
  - alkane
  - alkene
  - alcohol
  - carboxylic acid
  - ethanol
  - ethanoic acid
  - universal indicator
  - general formula
  - molecular formula
  - relative molecular mass
  key_points:
  - id: kp_group_defines_series
    text:
      en: A homologous series is a family of compounds with the same functional group and so similar chemical properties.
    follow_up:
      en: What do all members of one homologous series share?
  - id: kp_recognise_group
    text:
      en: 'The functional group is recognised in the formula: C=C for alkenes, OH for alcohols and COOH for carboxylic acids.'
    follow_up:
      en: Which feature in a formula tells you the family a compound belongs to?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.chm.o.organic.naming
