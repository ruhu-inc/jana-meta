  key_points:
  - id: kp_metal_carbonate
    text:
      en: An acid reacts with a metal to give a salt and hydrogen, and with a carbonate to give a salt, water and carbon dioxide.
    follow_up:
      en: Name the gas produced when an acid meets a reactive metal, and the gas when it meets a carbonate.
  - id: kp_base_alkali
    text:
      en: An acid reacting with a base or an alkali gives only a salt and water, which is neutralisation.
    follow_up:
      en: What are the only two products when an acid is neutralised by a base?
