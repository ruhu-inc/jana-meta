- id: kc.chm.o.acids.reactions_of_acids
  code: CHM-O-07.01.K01
  node_id: cur.chm.o.acids_bases_and_salts.the_characteristic_properties_of_acids_a
  statement: Predict the products when an acid reacts with a metal, a base, an alkali or a carbonate
  kind: conceptual
  tools: []
  exam_weight: 0.2
  prerequisites: []
  misconception_ids:
