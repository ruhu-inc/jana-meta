- id: kc.chm.o.reactions.physical_chemical_change
  code: CHM-O-06.01.K01
  node_id: cur.chm.o.chemical_reactions.physical_and_chemical_changes
  statement: Distinguish a physical change from a chemical change
  kind: conceptual
  tools: []
  exam_weight: 0.1
  prerequisites: []
  misconception_ids:
  - mc.chm.o.reactions_state_change_is_chemical
  - mc.chm.o.reactions_dissolving_is_chemical
  - mc.chm.o.reactions_new_substance_missed
  skill_ids:
  - chm-o-reactions
  glossary:
  - physical change
  - chemical change
  - new substance
  - dissolving
  - evaporation
  - combustion
  key_points:
  - id: kp_new_substance
    text:
      en: A chemical change forms a new substance, while a physical change leaves the substance the same.
    follow_up:
      en: What is the basic difference in what ends up after each type of change?
  - id: kp_reversible_signs
    text:
      en: Signs of a chemical change include colour change, gas, precipitate and energy change; a physical change is easy to reverse.
    follow_up:
      en: Name some observations that suggest a chemical change, and how does reversibility differ?
  difficulty_prior: -1.0
  version: 0.1.1
  status: active
- id: kc.chm.o.reactions.rate_factors
  code: CHM-O-06.02.K01
  node_id: cur.chm.o.chemical_reactions.rate_of_reaction
  statement: Predict how concentration, pressure, temperature, surface area and a catalyst change the rate of a reaction
  kind: conceptual
  tools: []
  exam_weight: 0.18
  prerequisites: []
  misconception_ids:
  - mc.chm.o.reactions_bigger_pieces_faster
  - mc.chm.o.reactions_catalyst_used_up
  - mc.chm.o.reactions_rate_changes_amount
  skill_ids:
  - chm-o-reactions
  glossary:
  - rate of reaction
  - concentration
  - surface area
  - catalyst
  - temperature
  - collision
  - successful collision
  - activation energy
  - particle
  - hydrochloric acid
  - magnesium
  key_points:
  - id: kp_increase_rate
    text:
      en: Higher concentration, pressure, temperature or surface area, or a catalyst, all increase the rate of reaction.
    follow_up:
      en: Which changes make a reaction go faster, and does the catalyst belong in that list?
  - id: kp_catalyst_not_used
    text:
      en: A catalyst speeds up a reaction but is not used up, so its mass is the same at the end.
    follow_up:
      en: What happens to a catalyst by the end of the reaction?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.chm.o.reactions.collision_theory
  code: CHM-O-06.02.K02
  node_id: cur.chm.o.chemical_reactions.rate_of_reaction
  statement: Explain changes in the rate of reaction using the frequency and energy of collisions
  kind: conceptual
  tools: []
  exam_weight: 0.14
  prerequisites:
  - kc_id: kc.chm.o.reactions.rate_factors
    strength: required
  misconception_ids:
  - mc.chm.o.reactions_all_collisions_react
  - mc.chm.o.reactions_catalyst_gives_energy
  - mc.chm.o.reactions_concentration_harder_collisions
  skill_ids:
  - chm-o-reactions
  glossary:
  - collision theory
  - collision
  - collide
  - successful collision
  - collision frequency
  - temperature
  - molecule
  - activation energy
  - particle
  - concentration
  - concentrated
  - hydrochloric acid
  - magnesium
  key_points:
  - id: kp_frequency
    text:
      en: Anything raising the number of collisions each second, like higher concentration or smaller particles, raises the rate.
    follow_up:
      en: How does a higher concentration or surface area affect how often particles collide?
  - id: kp_energy
    text:
      en: Higher temperature gives particles more energy, so more collisions reach the activation energy; a catalyst lowers it.
    follow_up:
      en: Why does a rise in temperature produce more successful collisions, and how does a catalyst help?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.chm.o.reactions.rate_data
  code: CHM-O-06.02.K03
  node_id: cur.chm.o.chemical_reactions.rate_of_reaction
  statement: Calculate a mean rate of reaction from measurements of gas volume or mass over time
  kind: procedural
  tools:
  - math_evaluate
  - chem_stoichiometry
  exam_weight: 0.14
  prerequisites:
  - kc_id: kc.chm.o.reactions.rate_factors
    strength: helpful
  misconception_ids:
  - mc.chm.o.reactions_rate_inverted
  - mc.chm.o.reactions_rate_reading_not_change
  - mc.chm.o.reactions_rate_end_time_not_interval
  skill_ids:
  - chm-o-reactions
  glossary:
  - rate of reaction
  - mean rate
  - gas syringe
  - molar gas volume
  - room temperature and pressure
  - oxygen
  key_points:
  - id: kp_rate_formula
    text:
      en: Mean rate is the amount of product formed, or reactant used, divided by the time taken.
    follow_up:
      en: Which two quantities do you divide to find a mean rate?
  - id: kp_gradient
    text:
      en: On a graph the rate at a given moment is the gradient, which is steepest at the start and zero when the reaction ends.
    follow_up:
      en: Where is the graph steepest, and what does a flat line mean?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.chm.o.reactions.equilibrium
  code: CHM-O-06.03.K01
  node_id: cur.chm.o.chemical_reactions.reversible_reactions_and_equilibrium
  statement: Predict how changing temperature, pressure or concentration shifts the position of an equilibrium
  kind: conceptual
  tools: []
  exam_weight: 0.16
  prerequisites:
  - kc_id: kc.chm.o.reactions.collision_theory
    strength: helpful
  misconception_ids:
  - mc.chm.o.reactions_equilibrium_static
  - mc.chm.o.reactions_shift_reinforces_change
  - mc.chm.o.reactions_catalyst_shifts_equilibrium
  skill_ids:
  - chm-o-reactions
  glossary:
  - equilibrium
  - dynamic equilibrium
  - position of equilibrium
  - reversible reaction
  - reversible
  - exothermic
  - endothermic
  - yield
  - Haber process
  - Contact process
  - ammonia
  - sulfur trioxide
  - molecule
  - temperature
  - pressure
  key_points:
  - id: kp_le_chatelier
    text:
      en: The position moves to oppose a change, such as towards the endothermic side when the temperature rises.
    follow_up:
      en: In which direction does the system move when you heat it up, and why?
  - id: kp_pressure_conc
    text:
      en: Raising pressure favours the side with fewer gas molecules, and adding reactant moves the position towards the products.
    follow_up:
      en: How do the numbers of gas molecules decide the effect of pressure, and what does extra reactant do?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
- id: kc.chm.o.reactions.redox
  code: CHM-O-06.04.K01
  node_id: cur.chm.o.chemical_reactions.redox
  statement: Identify the substances oxidised and reduced, and the oxidising and reducing agents, in a reaction
  kind: conceptual
  tools: []
  exam_weight: 0.16
  prerequisites:
  - kc_id: kc.chm.o.atoms.ion_formation
    strength: helpful
  confusable_with:
  - kc.chm.o.reactions.oxidation_numbers
  misconception_ids:
  - mc.chm.o.reactions_oxidation_is_gaining_electrons
  - mc.chm.o.reactions_oxidising_agent_is_oxidised
  - mc.chm.o.reactions_redox_needs_oxygen
  skill_ids:
  - chm-o-reactions
  glossary:
  - redox
  - oxidation
  - reduction
  - oxidised
  - reduced
  - oxidising agent
  - reducing agent
  - electron
  - acidified potassium manganate(VII)
  - potassium manganate(VII)
  - manganate(VII)
  - potassium iodide
  - acidified
  - colourless
  - solution
  key_points:
  - id: kp_oil_rig
    text:
      en: Oxidation is loss of electrons or gain of oxygen, and reduction is gain of electrons or loss of oxygen.
    follow_up:
      en: What happens to electrons, and to oxygen, in oxidation and in reduction?
  - id: kp_agents
    text:
      en: The oxidising agent is the substance that gets reduced, and the reducing agent is the substance that gets oxidised.
    follow_up:
      en: How does the agent's role relate to what happens to it in the reaction?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.chm.o.reactions.oxidation_numbers
  code: CHM-O-06.04.K02
  node_id: cur.chm.o.chemical_reactions.redox
  statement: Calculate the oxidation number of an element in a compound or ion
  kind: procedural
  tools:
  - math_evaluate
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.reactions.redox
    strength: helpful
  confusable_with:
  - kc.chm.o.reactions.redox
  misconception_ids:
  - mc.chm.o.reactions_oxnum_charge_ignored
  - mc.chm.o.reactions_oxnum_sign_flipped
  - mc.chm.o.reactions_oxnum_count_ignored
  skill_ids:
  - chm-o-reactions
  glossary:
  - oxidation number
  - oxidation state
  - oxidation
  - ion
  - overall charge
  - compound
  - manganese
  - oxygen
  - nitrogen
  - hydrogen
  key_points:
  - id: kp_rules
    text:
      en: An uncombined element has oxidation number 0, and the numbers in a compound add up to its overall charge.
    follow_up:
      en: What do the oxidation numbers of all the atoms add up to in a neutral compound or an ion?
  - id: kp_fixed_values
    text:
      en: Oxygen is usually -2, hydrogen is usually +1, and Group I and Group II metals are +1 and +2, so the unknown element can be found.
    follow_up:
      en: Which element values can you rely on to find the one you do not know?
  difficulty_prior: 0.5
  version: 0.1.1
  status: active
