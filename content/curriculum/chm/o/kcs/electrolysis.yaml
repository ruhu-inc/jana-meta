- id: kc.chm.o.electrolysis.molten_products
  code: CHM-O-04.01.K01
  node_id: cur.chm.o.electrochemistry.electrolysis
  statement: Predict the products at each electrode when a molten binary compound is electrolysed
  kind: conceptual
  tools: []
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.chm.o.atoms.ion_formation
    strength: required
  confusable_with:
  - kc.chm.o.electrolysis.aqueous_products
  misconception_ids:
  - mc.chm.o.ionic_conduction_by_electrons
  - mc.chm.o.electrolysis_metal_at_anode
  - mc.chm.o.electrolysis_molten_gives_hydrogen
  - mc.chm.o.electrolysis_electrons_through_electrolyte
  skill_ids:
  - chm-o-electrolysis
  glossary:
  - electrolysis
  - electrolysed
  - electrolyte
  - electrode
  - anode
  - cathode
  - molten
  - binary compound
  - relative molecular mass
  key_points:
  - id: kp_free_ions
    text:
      en: Electrolysis needs the ions to be free to move, which happens when the compound is molten or dissolved.
    follow_up:
      en: What condition must the compound be in for the ions to carry current?
  - id: kp_electrode_products
    text:
      en: Positive ions gain electrons at the cathode and negative ions lose them at the anode, giving a metal and a non-metal.
    follow_up:
      en: Which ion goes to which electrode, and what is formed at each in a molten binary compound?
  difficulty_prior: -0.3
  version: 0.1.1
  status: active
- id: kc.chm.o.electrolysis.aqueous_products
  code: CHM-O-04.01.K02
  node_id: cur.chm.o.electrochemistry.electrolysis
  statement: Predict the products of electrolysing an aqueous solution from the ions present and their concentration
  kind: conceptual
  tools: []
  exam_weight: 0.25
  prerequisites:
  - kc_id: kc.chm.o.electrolysis.molten_products
    strength: required
  confusable_with:
  - kc.chm.o.electrolysis.molten_products
  misconception_ids:
  - mc.chm.o.electrolysis_reactive_metal_from_solution
  - mc.chm.o.electrolysis_halide_concentration_ignored
  - mc.chm.o.electrolysis_hydrogen_always_at_cathode
  skill_ids:
  - chm-o-electrolysis
  glossary:
  - electrolysis
  - electrolysed
  - electrolyte
  - electrode
  - anode
  - cathode
  - aqueous
  - concentrated
  - dilute
  - inert electrode
  - half-equation
  - hydrochloric acid
  - sulfuric acid
  - solution
  - relative formula mass
  key_points:
  - id: kp_water_ions
    text:
      en: An aqueous solution also holds hydrogen and hydroxide ions from water, so each electrode has a choice of ions.
    follow_up:
      en: Besides the ions of the dissolved compound, what other ions are in the solution?
  - id: kp_selection_rule
    text:
      en: At the cathode the less reactive of the metal and hydrogen forms, and at the anode a halogen or else oxygen forms.
    follow_up:
      en: How do you decide which ion is discharged at each electrode?
  - id: kp_concentration_effect
    text:
      en: A concentrated halide solution gives the halogen at the anode, but a dilute one gives oxygen instead.
    follow_up:
      en: How would diluting a sodium chloride solution change the product at the anode?
  difficulty_prior: 0.4
  version: 0.1.1
  status: active
- id: kc.chm.o.electrolysis.half_equations
  code: CHM-O-04.01.K03
  node_id: cur.chm.o.electrochemistry.electrolysis
  statement: Construct the ionic half-equations for the changes at the anode and the cathode
  kind: procedural
  tools:
  - chem_balance
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.chm.o.electrolysis.molten_products
    strength: required
  - kc_id: kc.chm.o.stoichiometry.balancing_equations
    strength: helpful
  misconception_ids:
  - mc.chm.o.electrolysis_electrons_wrong_side
  - mc.chm.o.electrolysis_single_atoms_formed
  - mc.chm.o.electrolysis_half_charge_unbalanced
  skill_ids:
  - chm-o-electrolysis
  glossary:
  - half-equation
  - ionic half-equation
  - electrolysis
  - electrolysed
  - electrode
  - anode
  - cathode
  - electron
  - aluminium
  - aqueous
  - concentrated
  - sulfuric acid
  - hydroxide
  key_points:
  - id: kp_cathode_gain
    text:
      en: At the cathode ions gain electrons (reduction), so the electrons appear on the left of the half-equation.
    follow_up:
      en: At the cathode, are electrons gained or lost, and which side of the equation do they go on?
  - id: kp_anode_lose
    text:
      en: At the anode ions lose electrons (oxidation), and the half-equation must balance both atoms and charge.
    follow_up:
      en: What must be balanced in a half-equation besides the atoms?
  difficulty_prior: 0.5
  version: 0.1.1
  status: active
- id: kc.chm.o.electrolysis.applications
  code: CHM-O-04.01.K04
  node_id: cur.chm.o.electrochemistry.electrolysis
  statement: Describe how electrolysis is used to electroplate, purify copper and extract aluminium
  kind: conceptual
  tools: []
  exam_weight: 0.15
  prerequisites:
  - kc_id: kc.chm.o.electrolysis.aqueous_products
    strength: helpful
  misconception_ids:
  - mc.chm.o.electrolysis_plated_object_as_anode
  - mc.chm.o.electrolysis_impure_copper_as_cathode
  - mc.chm.o.electrolysis_aluminium_by_carbon
  skill_ids:
  - chm-o-electrolysis
  glossary:
  - electrolysis
  - electrolysed
  - electroplating
  - electroplated
  - electrode
  - anode
  - cathode
  - purification
  - purified
  - aluminium
  - cryolite
  - impurities
  - solution
  key_points:
  - id: kp_plating_refining
    text:
      en: In electroplating the object is the cathode and the coating metal is the anode; impure copper is the anode when refining.
    follow_up:
      en: In plating an object, which electrode is the object, and which is the coating metal?
  - id: kp_aluminium
    text:
      en: Aluminium is extracted by electrolysing molten aluminium oxide dissolved in cryolite, which lowers the energy needed.
    follow_up:
      en: Why is the aluminium oxide dissolved in another substance before electrolysis?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.chm.o.electrolysis.quantitative
  code: CHM-O-04.01.K05
  node_id: cur.chm.o.electrochemistry.electrolysis
  statement: Calculate the mass of a product of electrolysis from the current and the time
  kind: procedural
  tools:
  - chem_stoichiometry
  exam_weight: 0.15
  prerequisites:
  - kc_id: kc.chm.o.electrolysis.half_equations
    strength: required
  - kc_id: kc.chm.o.stoichiometry.moles_and_mass
    strength: required
  misconception_ids:
  - mc.chm.o.electrolysis_time_not_in_seconds
  - mc.chm.o.electrolysis_electron_ratio_ignored
  - mc.chm.o.electrolysis_electron_ratio_inverted
  skill_ids:
  - chm-o-electrolysis
  glossary:
  - electrolysis
  - faraday constant
  - charge
  - current
  - coulomb
  - electrode
  - relative atomic mass
  key_points:
  - id: kp_charge
    text:
      en: The charge passed is the current multiplied by the time in seconds.
    follow_up:
      en: Which two quantities combine to give the charge, and what unit of time must be used?
  - id: kp_moles_electrons
    text:
      en: The moles of product come from the charge divided by 96 500 per mole of electrons, adjusted for the electrons each ion needs.
    follow_up:
      en: How do you turn the charge into moles of product, and what does the ion's charge change?
  difficulty_prior: 0.9
  version: 0.1.1
  status: active
