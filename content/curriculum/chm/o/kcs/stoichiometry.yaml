- id: kc.chm.o.stoichiometry.ionic_formulae
  code: CHM-O-03.01.K01
  node_id: cur.chm.o.stoichiometry.formulae
  statement: Construct the formula of an ionic compound from the charges on its ions
  kind: procedural
  tools:
  - chem_molar_mass
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.chm.o.atoms.ion_formation
    strength: required
  misconception_ids:
  - mc.chm.o.formula_one_of_each
  - mc.chm.o.formula_own_charge_as_count
  - mc.chm.o.formula_brackets_missing
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - ionic formula
  - ionic compound
  - ion
  - charge
  - formula
  - aluminium
  - potassium
  - carbonate
  - sulfate
  - nitrate
  - hydroxide
  - ammonium
  - relative formula mass
  key_points:
  - id: kp_balance_charges
    text:
      en: The ions combine in the ratio that makes the total positive charge equal the total negative charge.
    follow_up:
      en: What must be true of the total charges in an ionic formula?
  - id: kp_swap_brackets
    text:
      en: Use the charge of each ion as the number of the other, simplify, and put brackets round a polyatomic ion needing more than one.
    follow_up:
      en: How do you work out the amount of each ion, and when are brackets needed?
  difficulty_prior: -0.4
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.balancing_equations
  code: CHM-O-03.01.K02
  node_id: cur.chm.o.stoichiometry.formulae
  statement: Construct a balanced symbol equation by changing coefficients only, never formulae
  kind: procedural
  tools:
  - chem_balance
  - chem_stoichiometry
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.ionic_formulae
    strength: helpful
  misconception_ids:
  - mc.chm.o.subscript_changed_to_balance
  - mc.chm.o.balanced_not_lowest
  - mc.chm.o.balance_one_element_only
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - balanced equation
  - symbol equation
  - equation
  - coefficient
  - formula
  - formulae
  - reactant
  - product
  key_points:
  - id: kp_coefficients_only
    text:
      en: Only the numbers in front of formulae can be changed, because changing a formula changes the substance.
    follow_up:
      en: What are you allowed to change when balancing, and why not the small numbers?
  - id: kp_atoms_equal
    text:
      en: An equation is balanced when each element has the same number of atoms on both sides.
    follow_up:
      en: How do you check that an equation is balanced?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.relative_formula_mass
  code: CHM-O-03.02.K01
  node_id: cur.chm.o.stoichiometry.relative_masses_of_atoms_and_molecules
  statement: Calculate the relative formula mass of a compound from relative atomic masses
  kind: procedural
  tools:
  - chem_molar_mass
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.ionic_formulae
    strength: helpful
  misconception_ids:
  - mc.chm.o.formula_brackets_missing
  - mc.chm.o.mr_count_ignored
  - mc.chm.o.mr_bracket_multiplier
  - mc.chm.o.mr_atomic_number
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - relative formula mass
  - relative molecular mass
  - relative atomic mass
  - formula
  - carbonate
  - hydroxide
  - sulfate
  - nitrate
  - ammonium
  - aluminium
  - magnesium
  key_points:
  - id: kp_add_ar
    text:
      en: Add up the relative atomic masses of every atom shown in the formula.
    follow_up:
      en: What do you add together to get the relative formula mass?
  - id: kp_brackets_multiples
    text:
      en: Numbers after brackets multiply every atom inside, and water of crystallisation is added in the same way.
    follow_up:
      en: How do you treat atoms inside brackets, or a number written before water in a hydrated salt?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.percentage_composition
  code: CHM-O-03.02.K02
  node_id: cur.chm.o.stoichiometry.relative_masses_of_atoms_and_molecules
  statement: Calculate the percentage by mass of an element in a compound
  kind: procedural
  tools:
  - chem_molar_mass
  - math_evaluate
  exam_weight: 0.08
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.relative_formula_mass
    strength: required
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
  - mc.chm.o.percent_ar_over_mr_no_100
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - percentage composition
  - percentage by mass
  - relative formula mass
  - relative atomic mass
  - ammonium
  - aluminium
  key_points:
  - id: kp_fraction
    text:
      en: The percentage is the mass of the element in one formula divided by the relative formula mass.
    follow_up:
      en: Which two masses form the fraction for the element in a compound?
  - id: kp_times_hundred
    text:
      en: Multiply that fraction by 100 and count all the atoms of the element in the formula.
    follow_up:
      en: After forming the fraction, what step turns it into a percentage, and what about the number of atoms?
  difficulty_prior: -0.1
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.moles_and_mass
  code: CHM-O-03.03.K01
  node_id: cur.chm.o.stoichiometry.the_mole_and_the_avogadro_constant
  statement: Convert between the mass of a substance and its amount in moles using its molar mass
  kind: procedural
  tools:
  - chem_stoichiometry
  - chem_molar_mass
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.relative_formula_mass
    strength: required
  misconception_ids:
  - mc.chm.o.mr_bracket_multiplier
  - mc.chm.o.moles_ratio_inverted
  - mc.chm.o.moles_multiply_mass
  - mc.chm.o.diatomic_as_atoms
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - mole
  - amount of substance
  - molar mass
  - relative formula mass
  - Avogadro constant
  - equation
  key_points:
  - id: kp_moles_formula
    text:
      en: Moles equal mass divided by molar mass.
    follow_up:
      en: Which quantity is divided by which to get an amount in moles?
  - id: kp_rearrange
    text:
      en: Mass equals moles multiplied by molar mass, with the molar mass in g/mol equal to the relative formula mass.
    follow_up:
      en: How do you go from moles back to a mass, and what number do you use as the molar mass?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.reacting_masses
  code: CHM-O-03.03.K02
  node_id: cur.chm.o.stoichiometry.the_mole_and_the_avogadro_constant
  statement: Calculate a reacting mass from a balanced equation and a given mass
  kind: procedural
  tools:
  - chem_stoichiometry
  - chem_balance
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.moles_and_mass
    strength: required
  - kc_id: kc.chm.o.stoichiometry.balancing_equations
    strength: required
  misconception_ids:
  - mc.chm.o.moles_ratio_inverted
  - mc.chm.o.ratio_ignored
  - mc.chm.o.mass_ratio_as_mole_ratio
  - mc.chm.o.ratio_inverted
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - reacting mass
  - mole ratio
  - balanced equation
  - equation
  - molar mass
  - relative formula mass
  - limiting reactant
  - excess
  key_points:
  - id: kp_mass_to_moles
    text:
      en: Convert the known mass to moles first, then use the equation's mole ratio to get the moles of the wanted substance.
    follow_up:
      en: What do you do with the given mass before using the equation?
  - id: kp_back_to_mass
    text:
      en: Convert the moles you found into a mass using the molar mass of the wanted substance.
    follow_up:
      en: Once you have moles of the wanted substance, how do you end up with the mass?
  difficulty_prior: 0.5
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.gas_volumes
  code: CHM-O-03.03.K03
  node_id: cur.chm.o.stoichiometry.the_mole_and_the_avogadro_constant
  statement: Calculate gas volumes at room conditions from amounts using the molar gas volume
  kind: procedural
  tools:
  - chem_stoichiometry
  exam_weight: 0.08
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.moles_and_mass
    strength: required
  confusable_with:
  - kc.chm.o.stoichiometry.solution_concentration
  misconception_ids:
  - mc.chm.o.diatomic_as_atoms
  - mc.chm.o.ratio_ignored
  - mc.chm.o.gas_volume_divided
  - mc.chm.o.gas_cm3_dm3
  - mc.chm.o.gas_stp_volume
  - mc.chm.o.gas_volume_from_mass
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - molar gas volume
  - room temperature and pressure
  - mole
  - dm³
  key_points:
  - id: kp_molar_volume
    text:
      en: At room conditions one mole of any gas occupies 24 dm3.
    follow_up:
      en: What volume does a mole of any gas fill at room temperature and pressure?
  - id: kp_volume_calc
    text:
      en: Volume equals moles times 24, in dm3, and equal volumes of gases at the same conditions hold equal numbers of moles.
    follow_up:
      en: How do you get a gas volume from moles, and what does the equation's ratio tell you about volumes?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.solution_concentration
  code: CHM-O-03.03.K04
  node_id: cur.chm.o.stoichiometry.the_mole_and_the_avogadro_constant
  statement: Calculate the concentration, volume or amount of solute in a solution
  kind: procedural
  tools:
  - chem_stoichiometry
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.moles_and_mass
    strength: required
  confusable_with:
  - kc.chm.o.stoichiometry.gas_volumes
  misconception_ids:
  - mc.chm.o.gas_cm3_dm3
  - mc.chm.o.conc_volume_not_converted
  - mc.chm.o.conc_inverted
  - mc.chm.o.conc_mass_as_moles
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - concentration
  - solution
  - solute
  - solvent
  - mol/dm³
  - g/dm³
  - hydrochloric acid
  - sodium hydroxide
  - potassium hydroxide
  key_points:
  - id: kp_conc_formula
    text:
      en: Concentration in mol/dm3 equals moles divided by volume in dm3.
    follow_up:
      en: What two quantities do you divide to get a concentration, and in what unit is the volume?
  - id: kp_unit_conversion
    text:
      en: Divide a volume in cm3 by 1000 to get dm3, and a concentration in g/dm3 is the mass of solute in each dm3.
    follow_up:
      en: How do you handle a volume given in cm3, and how do g/dm3 differ from mol/dm3?
  difficulty_prior: 0.2
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.empirical_formula
  code: CHM-O-03.03.K05
  node_id: cur.chm.o.stoichiometry.the_mole_and_the_avogadro_constant
  statement: Determine an empirical or molecular formula from reacting masses or percentage composition
  kind: procedural
  tools:
  - chem_molar_mass
  - math_evaluate
  exam_weight: 0.08
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.moles_and_mass
    strength: required
  misconception_ids:
  - mc.chm.o.empirical_mass_ratio
  - mc.chm.o.empirical_divided_wrong_way
  - mc.chm.o.empirical_rounded_early
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - empirical formula
  - molecular formula
  - relative molecular mass
  - molecule
  - mole ratio
  - formula
  - aluminium
  key_points:
  - id: kp_moles_ratio
    text:
      en: Divide each mass or percentage by the atomic mass to get moles, then divide by the smallest to find the simplest ratio.
    follow_up:
      en: What do you do with each mass first, and how do you reach the simplest whole-number ratio?
  - id: kp_molecular_multiple
    text:
      en: The molecular formula is the empirical formula multiplied by the relative molecular mass divided by the empirical formula mass.
    follow_up:
      en: What extra information do you need to turn an empirical formula into a molecular formula?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
- id: kc.chm.o.stoichiometry.yield_and_purity
  code: CHM-O-03.03.K06
  node_id: cur.chm.o.stoichiometry.the_mole_and_the_avogadro_constant
  statement: Calculate the percentage yield or percentage purity of a product from experimental masses
  kind: procedural
  tools:
  - chem_stoichiometry
  exam_weight: 0.1
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.reacting_masses
    strength: required
  misconception_ids:
  - mc.chm.o.yield_inverted
  - mc.chm.o.yield_uses_reactant_mass
  - mc.chm.o.purity_impurity_share
  - mc.chm.o.purity_inverted
  - mc.chm.o.percent_ar_over_mr_no_100
  skill_ids:
  - chm-o-stoichiometry
  glossary:
  - percentage yield
  - percentage purity
  - theoretical yield
  - actual yield
  - yield
  - purity
  - impurities
  key_points:
  - id: kp_percent_yield
    text:
      en: Percentage yield is the actual mass obtained divided by the theoretical maximum mass, times 100.
    follow_up:
      en: Which two masses form the percentage yield, and which one comes from the equation?
  - id: kp_percent_purity
    text:
      en: Percentage purity is the mass of pure substance divided by the total mass of the sample, times 100.
    follow_up:
      en: What do you divide by what to find the purity of a sample?
  difficulty_prior: 0.6
  version: 0.1.1
  status: active
