- id: kc.chm.o.metals.properties_and_uses
  code: CHM-O-09.02.K01
  node_id: cur.chm.o.metals.uses_of_metals
  statement: Relate the uses of a metal to its physical and chemical properties
  kind: conceptual
  tools: []
  exam_weight: 0.15
  prerequisites: []
  misconception_ids:
  - mc.chm.o.metals_use_wrong_property
  - mc.chm.o.metals_conduct_by_moving_ions
  - mc.chm.o.metals_aluminium_corrodes_easily
  skill_ids:
  - chm-o-metals
  glossary:
  - malleable
  - ductile
  - conductor
  - electrical conductor
  - density
  - corrosion
  - aluminium
  - magnesium
  - alloy
  key_points:
  - id: kp_property_use
    text:
      en: A metal is chosen for a job because a property fits it, such as copper for wires since it conducts well and bends easily.
    follow_up:
      en: How do you link a use of a metal to the property that makes it suitable?
  - id: kp_chemical_property
    text:
      en: Chemical properties like resistance to corrosion or low reactivity also decide the use, for example aluminium for drinks cans.
    follow_up:
      en: Besides physical properties, what does a metal's reactivity decide about its use?
  difficulty_prior: -0.8
  version: 0.1.1
  status: active
- id: kc.chm.o.metals.alloys
  code: CHM-O-09.03.K01
  node_id: cur.chm.o.metals.alloys_and_their_properties
  statement: Explain why an alloy is usually harder than its pure metal using the arrangement of its atoms
  kind: conceptual
  tools: []
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.atoms.metallic_bonding
    strength: helpful
  misconception_ids:
  - mc.chm.o.metals_alloy_is_compound
  - mc.chm.o.metals_alloy_stronger_bonds
  - mc.chm.o.metals_alloy_impure_weaker
  skill_ids:
  - chm-o-metals
  glossary:
  - alloy
  - pure metal
  - brass
  - stainless steel
  - steel
  - bronze
  - malleable
  key_points:
  - id: kp_different_sizes
    text:
      en: An alloy is a mixture of a metal with other elements, whose atoms are different sizes.
    follow_up:
      en: What is an alloy made from, and how do the atoms in it differ?
  - id: kp_layers_blocked
    text:
      en: The different-sized atoms disrupt the regular layers, so they cannot slide over each other easily and the alloy is harder.
    follow_up:
      en: What happens to the layers of atoms when other-sized atoms are mixed in, and how does that affect hardness?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.chm.o.metals.reactivity_series
  code: CHM-O-09.04.K01
  node_id: cur.chm.o.metals.reactivity_series
  statement: Predict displacement reactions and reactions with water and acids from the reactivity series
  kind: conceptual
  tools: []
  exam_weight: 0.25
  prerequisites: []
  misconception_ids:
  - mc.chm.o.metals_displacement_reversed
  - mc.chm.o.metals_all_metals_react
  - mc.chm.o.metals_gas_is_oxygen
  skill_ids:
  - chm-o-metals
  glossary:
  - reactivity series
  - reactivity
  - displacement
  - displace
  - potassium
  - magnesium
  - aluminium
  - hydrogen
  - solution
  key_points:
  - id: kp_displacement
    text:
      en: A more reactive metal displaces a less reactive metal from its compound, but not the other way round.
    follow_up:
      en: When does a metal push another metal out of its salt solution?
  - id: kp_water_acid
    text:
      en: The higher a metal is in the series, the more vigorously it reacts with water and acids; the lowest do not react.
    follow_up:
      en: How does the position in the series change how a metal behaves with water and acid?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.chm.o.metals.corrosion
  code: CHM-O-09.05.K01
  node_id: cur.chm.o.metals.corrosion_of_metals
  statement: Identify the conditions for rusting and explain barrier and sacrificial protection
  kind: conceptual
  tools: []
  exam_weight: 0.15
  prerequisites:
  - kc_id: kc.chm.o.metals.reactivity_series
    strength: helpful
  misconception_ids:
  - mc.chm.o.metals_aluminium_corrodes_easily
  - mc.chm.o.metals_rust_one_condition
  - mc.chm.o.metals_all_metals_rust
  - mc.chm.o.metals_sacrificial_less_reactive
  skill_ids:
  - chm-o-metals
  glossary:
  - rusting
  - corrosion
  - sacrificial protection
  - galvanising
  - galvanised
  - barrier method
  - hydrated iron(III) oxide
  - oxygen
  key_points:
  - id: kp_rust_conditions
    text:
      en: Iron rusts only when both oxygen and water are present.
    follow_up:
      en: Which substances must be there for iron to rust, and what happens if one is missing?
  - id: kp_barrier_sacrificial
    text:
      en: Barrier methods such as paint keep out air and water; sacrificial protection uses a more reactive metal that corrodes first.
    follow_up:
      en: How does painting stop rust, and how is a more reactive metal used differently?
  difficulty_prior: -0.2
  version: 0.1.1
  status: active
- id: kc.chm.o.metals.extraction
  code: CHM-O-09.06.K01
  node_id: cur.chm.o.metals.extraction_of_metals
  statement: Select a method to extract a metal from its position in the reactivity series
  kind: conceptual
  tools: []
  exam_weight: 0.18
  prerequisites:
  - kc_id: kc.chm.o.metals.reactivity_series
    strength: required
  misconception_ids:
  - mc.chm.o.metals_carbon_reduces_all
  - mc.chm.o.metals_extraction_reversed
  - mc.chm.o.metals_reduction_gains_oxygen
  skill_ids:
  - chm-o-metals
  glossary:
  - extraction
  - reactivity series
  - electrolysis
  - reduction
  - reduced
  - carbon monoxide
  - blast furnace
  - aluminium
  - aluminium oxide
  - ore
  - electron
  key_points:
  - id: kp_position_method
    text:
      en: 'Extraction depends on position: unreactive metals are found uncombined, middle ones need carbon, reactive ones electrolysis.'
    follow_up:
      en: What links the choice of extraction method to a metal's place in the series?
  - id: kp_carbon_reduction
    text:
      en: Carbon takes the oxygen from the oxide of a metal less reactive than carbon, but cannot do so for a more reactive metal.
    follow_up:
      en: Why can carbon extract iron but not aluminium?
  difficulty_prior: 0.3
  version: 0.1.1
  status: active
- id: kc.chm.o.metals.extraction_yield
  code: CHM-O-09.06.K02
