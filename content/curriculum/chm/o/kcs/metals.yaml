  - id: kp_reactions
    text:
      en: Reactive metals react with water to give hydroxide and hydrogen, with steam to give an oxide, and with acids to give a salt.
    follow_up:
      en: What products form when a reactive metal meets water, steam and an acid?
  difficulty_prior: -0.4
  version: 0.1.0
