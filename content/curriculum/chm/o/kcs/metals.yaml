- id: kc.chm.o.metals.properties_of_metals
  code: CHM-O-09.01.K01
  node_id: cur.chm.o.metals.properties_of_metals
  statement: Explain the physical properties of metals with metallic bonding and describe how metals react with acids, water and steam
  kind: conceptual
  tools: []
  exam_weight: 0.12
  prerequisites:
  - kc_id: kc.chm.o.atoms.metallic_bonding
    strength: required
  misconception_ids:
  - mc.chm.o.metals_conduct_by_moving_ions
  - mc.chm.o.metals_all_metals_react
  - mc.chm.o.metals_gas_is_oxygen
  skill_ids:
  - chm-o-metals
  glossary:
  - malleable
  - ductile
  - conductor
  - electrical conductor
  - delocalised electrons
  - lattice
  - metallic bonding
  - melting point
  - metal oxide
  - basic oxide
  - alkaline
  - hydrogen
  - steam
  key_points:
  - id: kp_bonding_explains
    text:
      en: Metals conduct and bend because delocalised electrons move freely and layers of ions slide without breaking the bonding.
    follow_up:
