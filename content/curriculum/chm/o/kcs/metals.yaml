  - mc.chm.o.metals_yield_ratio_ignored
  - mc.chm.o.metals_yield_mass_ratio
  - mc.chm.o.metals_yield_ratio_inverted
  skill_ids:
  - chm-o-metals
  glossary:
  - ore
  - extraction
  - aluminium
  - aluminium oxide
  - iron(III) oxide
  - percentage by mass
  - electrolysis
  - relative formula mass
  - equation
  key_points:
  - id: kp_ore_moles
    text:
      en: Find the moles of the ore from its mass and molar mass, then use the equation ratio to get the moles of metal.
    follow_up:
