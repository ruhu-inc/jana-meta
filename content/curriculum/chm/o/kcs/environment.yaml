- id: kc.chm.o.environment.water
  code: CHM-O-10.01.K01
  node_id: cur.chm.o.chemistry_of_the_environment.water
  statement: Describe the chemical tests for water and the stages of treating the water supply
  kind: conceptual
  tools: []
  exam_weight: 0.3
  prerequisites: []
  misconception_ids:
  - mc.chm.o.environment_water_test_shows_purity
  - mc.chm.o.environment_water_test_colours_reversed
  - mc.chm.o.environment_treatment_stages_mixed
  skill_ids:
  - chm-o-environment
  glossary:
  - anhydrous copper(II) sulfate
  - cobalt(II) chloride
  - sedimentation
  - filtration
  - chlorination
  - boiling point
  - water treatment
  key_points:
  - id: kp_water_tests
    text:
      en: Water is shown by turning anhydrous copper(II) sulfate from white to blue or blue cobalt chloride paper from blue to pink.
    follow_up:
      en: What colour changes show that a liquid contains water?
  - id: kp_treatment
    text:
      en: Water supply is treated by filtering out solids and using chlorine to kill microbes.
    follow_up:
      en: What two stages treat supply water, and what is each one for?
  difficulty_prior: -0.6
  version: 0.1.1
  status: active
- id: kc.chm.o.environment.fertilisers
  code: CHM-O-10.02.K01
  node_id: cur.chm.o.chemistry_of_the_environment.fertilisers
  statement: Calculate and compare the percentage of nitrogen supplied by fertilisers
  kind: procedural
  tools:
  - chem_molar_mass
  - math_evaluate
  exam_weight: 0.2
  prerequisites:
  - kc_id: kc.chm.o.stoichiometry.percentage_composition
    strength: required
  misconception_ids:
  - mc.chm.o.percent_count_ignored
  - mc.chm.o.percent_inverted
  - mc.chm.o.environment_n_atoms_count_ignored
  - mc.chm.o.environment_n_percent_inverted
  - mc.chm.o.environment_percent_not_times_100
  skill_ids:
  - chm-o-environment
  glossary:
  - fertiliser
  - NPK fertiliser
  - nitrogen
  - phosphorus
  - potassium
  - ammonium
  - ammonium nitrate
  - ammonium sulfate
  - urea
  - percentage by mass
  - relative formula mass
  key_points:
  - id: kp_nitrogen_needed
    text:
      en: Fertilisers supply nitrogen, phosphorus and potassium that crops need to grow.
    follow_up:
      en: Which elements do plants take from a fertiliser?
  - id: kp_percent_n
    text:
      en: The percentage of nitrogen is the mass of nitrogen atoms in one formula divided by the relative formula mass, times 100.
    follow_up:
      en: How do you compare two fertilisers fairly on their nitrogen content?
  difficulty_prior: 0.0
  version: 0.1.1
  status: active
- id: kc.chm.o.environment.air_pollution
  code: CHM-O-10.03.K01
  node_id: cur.chm.o.chemistry_of_the_environment.air_quality_and_climate
  statement: Identify the sources and effects of common air pollutants and how each is reduced
  kind: conceptual
  tools: []
  exam_weight: 0.3
  prerequisites: []
  misconception_ids:
  - mc.chm.o.environment_pollutant_effects_mixed
  - mc.chm.o.environment_nox_from_fuel_nitrogen
  - mc.chm.o.environment_converter_removes_co2
  skill_ids:
  - chm-o-environment
  glossary:
  - pollutant
  - pollution
  - carbon monoxide
  - nitrogen oxides
  - nitrogen monoxide
  - nitrogen dioxide
  - oxides of nitrogen
  - sulfur dioxide
  - acid rain
  - catalytic converter
  - flue gas desulfurisation
  - desulfurisation
  - particulates
  - calcium carbonate
  - carbonate
  key_points:
  - id: kp_sources_effects
    text:
      en: Carbon monoxide, sulfur dioxide and nitrogen oxides come from burning fuels and cause poisoning and acid rain.
    follow_up:
      en: Where do these pollutants come from, and what harm does each one cause?
  - id: kp_reduction
    text:
      en: Pollution is reduced with catalytic converters, by removing sulfur from fuels, or by scrubbing the waste gases.
    follow_up:
      en: What can be done to stop each of these gases leaving a car or a power station?
  difficulty_prior: -0.4
  version: 0.1.1
