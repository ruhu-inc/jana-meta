# Packaged gateway defaults. A deployment file is merged over this one; `slots` and `providers` are replaced whole.
# Quotas, the online tier's allowance (D33, D121), objectives, token lifetimes and retention take their declared
# defaults from config.py; the plans and prices are TABLE BIZ-18a in plans.toml, merged under this file.

environment = "production"
study_model = "primary/strong-model"

# MDL-26: the device asks for "<slot>/<alias>" (for example "primary/strong-model"). Every engine role, Study and Ask
# run on Meta's Muse Spark (JM-D9); there is no other cloud language model and no cross-vendor fallback.
[slots]
primary = "meta"

# Meta Model API, OpenAI-compatible Chat Completions (https://dev.meta.ai/docs/protocols/chat-completions), checked
# 2026-10-26. Standard mode ids only: Contributor mode is a separate id and Meta trains on it (JM-D16). One model
# serves both aliases, so the router's tiers keep working; reasoning effort is set per request by the device.
[providers.meta]
adapter = "meta"
base_url = "https://api.meta.ai/v1"
secret = "meta_api_key"
pseudonym_field = "safety_identifier" # the per-session random pseudonym only (PRV-25)
timeout_s = 120.0

# The Spark effort each requested effort becomes, per alias (SPEC §12): the fast alias serves the Coach, Diagnoser and
# auxiliary roles, where answers are short and latency matters most; the strong alias serves the Solver and Checker,
# whose numbers the engine's tools check anyway. Measured 2026-10-26: Coach 6.0 s at low, 3.8 s at minimal; the Solver's
# plan 2-5 s at low (300-700 reasoning tokens) and 0.7-2 s at minimal, with every seeded plan still verified by its
# tools (`python -m jana_tools.turn_latency`).
[providers.meta.models.fast-model]
id = "muse-spark-1.3"
thinking = { kind = "level", none = "minimal", low = "minimal", medium = "low", high = "medium" }

[providers.meta.models.strong-model]
id = "muse-spark-1.3"
thinking = { kind = "level", none = "minimal", low = "minimal", medium = "minimal", high = "minimal" }

# Standard mode, per 1M tokens (https://dev.meta.ai/docs/pricing-rate-limits, 2026-10-26). Reasoning tokens are part
# of the output tokens and billed at the output rate; images are billed as input tokens.
[prices."muse-spark-1.3"]
input = 1.25
cached_input = 0.15
output = 4.25

# Same price; kept so the day-1 checks can compare 1.2 with 1.3 under the ledger (§4.4).
[prices."muse-spark-1.2"]
input = 1.25
cached_input = 0.15
output = 4.25

# SAM 3.1 segmentation (JM-D10, SPEC §5; https://dev.meta.ai/docs/sam, 2026-10-26): the photo regions Muse Spark reads
# become masks Jana points at on the learner's own photo. $2.50 per 1,000 images; at most 300 images over the event.
[sam]
enabled = true

# The research agent's gateway job (SPEC §18.3-18.5): one Muse Spark web search per approved sub-question on the
# Responses API, then the result pages fetched and reduced to text for Study's verified jobs. Owner, 2026-10-26: 5 packs
# per learner per day and $0.30 per job (§18.10). Searches are $2.50 per 1,000 and are counted from the reply's
# `web_search_call` items, since they never appear in `usage`.
[research]
enabled = true
per_job_usd = 0.30
daily_jobs_per_learner = 5
max_searches = 12
max_pages = 30
parallel = 4
search_usd_per_1000 = 2.50
search_timeout_s = 90.0
page_timeout_s = 8.0
page_max_bytes = 1_000_000
page_max_chars = 60_000
job_timeout_s = 900.0
retention_s = 86_400.0
# The source policy (§18.10): no allow-list. Never fetched: social media, forums, video pages and answer-selling sites.
excluded_domains = [
    # social media
    "facebook.com", "fb.com", "instagram.com", "x.com", "twitter.com", "tiktok.com", "linkedin.com", "pinterest.com",
    "snapchat.com", "threads.net", "tumblr.com", "telegram.org", "t.me", "whatsapp.com", "discord.com",
    # forums and question sites
    "reddit.com", "quora.com", "stackexchange.com", "stackoverflow.com", "answers.yahoo.com", "answers.com",
    "nairaland.com", "studentroom.co.uk", "thestudentroom.co.uk",
    # video
    "youtube.com", "youtu.be", "vimeo.com", "dailymotion.com", "twitch.tv",
    # answer-selling and homework-dump sites
    "chegg.com", "coursehero.com", "brainly.com", "brainly.in", "studocu.com", "scribd.com", "bartleby.com",
    "numerade.com", "quizlet.com", "transtutors.com", "studypool.com", "homeworklib.com", "toppr.com",
    "gauthmath.com", "askfilo.com", "doubtnut.com", "sarthaks.com", "kunduz.com", "studyx.ai", "homework.study.com",
]
# Hosts under these were only ever spam or mirrors in the live searches (2026-10-27): never fetched.
excluded_suffixes = [".lat", ".quest", ".live", ".top", ".xyz", ".click", ".icu", ".buzz", ".pages.dev"]
# Ranked first: encyclopaedias, universities, governments, examination boards and open textbooks.
preferred_suffixes = [".edu", ".gov", ".ac.uk", ".gov.uk", ".edu.au", ".gov.au", ".edu.ng", ".gov.ng", ".ac.za", ".int"]
preferred_domains = [
    "wikipedia.org", "britannica.com", "openstax.org", "khanacademy.org", "bbc.co.uk/bitesize", "libretexts.org",
    "ck12.org", "physicsclassroom.com", "rsc.org", "iop.org", "nature.com", "ncbi.nlm.nih.gov", "who.int",
    "cambridgeinternational.org", "aqa.org.uk", "ocr.org.uk", "pearson.com/qualifications", "waecdirect.org",
    "waec.org.ng", "nhs.uk", "ifrs.org", "accaglobal.com", "icaew.com", "mathsisfun.com", "nrich.maths.org",
]
