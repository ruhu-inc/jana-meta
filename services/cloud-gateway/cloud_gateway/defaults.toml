# Packaged gateway defaults. A deployment file is merged over this one; `slots` and `providers` are replaced whole.
# Quotas, the online tier's allowance (D33, D121), objectives, token lifetimes and retention take their declared
# defaults from config.py; the plans and prices are TABLE BIZ-18a in plans.toml, merged under this file.

environment = "production"
study_model = "primary/strong-model"

# MDL-26: the device asks for "<slot>/<alias>" (for example "primary/strong-model"). Every engine role, Study and Ask
# run on Meta's Muse Spark (JM-D9); there is no other cloud language model and no cross-vendor fallback.
[slots]
primary = "meta"

# Meta Model API, OpenAI-compatible Chat Completions (https://dev.meta.ai/docs/protocols/chat-completions), checked
# 2026-10-26. Standard mode ids only: Contributor mode is a separate id and Meta trains on it (JM-D16). One model
# serves both aliases, so the router's tiers keep working; reasoning effort is set per request by the device.
[providers.meta]
adapter = "meta"
base_url = "https://api.meta.ai/v1"
secret = "meta_api_key"
pseudonym_field = "safety_identifier" # the per-session random pseudonym only (PRV-25)
timeout_s = 120.0

[providers.meta.models.fast-model]
id = "muse-spark-1.3"

[providers.meta.models.strong-model]
id = "muse-spark-1.3"

# Standard mode, per 1M tokens (https://dev.meta.ai/docs/pricing-rate-limits, 2026-10-26). Reasoning tokens are part
# of the output tokens and billed at the output rate; images are billed as input tokens.
[prices."muse-spark-1.3"]
input = 1.25
cached_input = 0.15
output = 4.25
