# The hosted demo for judging (scripts/hosted). No key belongs in this file: systemd hands the gateway its key as a
# credential file, read through `secrets_dir`. The gateway stays on loopback, so `environment` and `audience_host` are
# the same as a local run and the browser host's checks do not change.
# The same key opens Muse Voice Transcribe streams for cloud voice (SPEC §6.1).
environment = "dev"
audience_host = "localhost"
# The spending ledger survives restarts. Never delete it to reset.
storage_dir = "/var/lib/jana/gateway"
secrets_dir = "/run/credentials/jana-gateway.service"
keychain_service = "jana-meta.cloud-gateway"
# Cloud voice: Voice Transcribe hears and Kokoro-82M (the speech pack's, run by the gateway) reads the accepted words;
# speech charges are reserved against the budget below.
voice_enabled = false
# A Voice Transcribe session takes 1-3.5 s to open and acknowledge; audio meanwhile is held and sent in order, so the
# device's microphone opens at once instead of waiting for it (a read-aloud never needs it at all).
voice_prewarm_s = 0.3

# The event's Meta Model API credit is USD 150 for ten days (2026-10-26 to 2026-11-04). USD 120 is the hard total
# for development, leaving USD 30 for judging; USD 10 per UTC day. The ledger reserves every call's full bound before
# sending it, keeps unresolved holds, and refuses once a limit or the expiry is reached. It never buys credit.
[quotas]
device_daily_spend_usd = 5.00
study_daily_spend_usd = 5.00
deployment_daily_spend_usd = 25.00
deployment_total_spend_usd = 120.00
deployment_budget_expires_at = "2026-11-09T00:00:00Z" # through judging and the closing ceremony
# Muse Spark's reasoning shares the output budget, so a reply needs room to reason and then answer.
deployment_max_output_tokens = 16384

# Sponsored development access shares the deployment's inference allocation above.
[tier]
allowance_usd_per_student_month = 15.00

# Study Podcasts are read by cloud voice's Kokoro-82M (above), bounded on their own (§6.4).
[podcast_speech]
enabled = false
daily_characters = 20000
total_characters = 100000
daily_requests = 100
total_requests = 500
